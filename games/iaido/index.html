<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ 拔刀居合斩 (Iaido Slash) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game-layout.css">
  <style>
1. 拔刀居合斩 (IAIDO) 样式
       ========================================================================== */
    #iaido-stage {
      width: 100%;
      height: 440px;
      position: relative;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #09090b 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      cursor: pointer;
    }

    .iaido-hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .iaido-life-box {
      display: flex;
      gap: 4px;
      font-size: 1.1rem;
    }

    .iaido-center-zone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    .iaido-moon {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.2) 0%, rgba(254, 240, 138, 0.02) 70%, transparent 100%);
      border: 1px solid rgba(254, 240, 138, 0.2);
      position: absolute;
      animation: moonPulse 3s infinite ease-in-out;
    }
    @keyframes moonPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    .iaido-state-text {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #cbd5e1;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      z-index: 6;
    }

    .iaido-sub-text {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      z-index: 6;
    }

    .iaido-duelists {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px 20px;
      position: relative;
      z-index: 4;
    }

    .duelist-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .duelist-svg {
      width: 90px;
      height: 110px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
      transition: transform 0.15s ease-out;
    }

    .duelist-name {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .iaido-slash-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(239, 68, 68, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .iaido-kanji {
      font-size: 6.5rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 30px #ffffff, 0 0 60px #ff0000;
      animation: kanjiBlast 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes kanjiBlast {
      0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .iaido-slash-line {
      position: absolute;
      top: 50%;
      left: -20%;
      width: 140%;
      height: 5px;
      background: linear-gradient(90deg, transparent, #fff, #ef4444, transparent);
      box-shadow: 0 0 25px #fff;
      transform: rotate(-25deg);
      display: none;
      z-index: 25;
    }

    /* ==========================================================================
       
  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部通用导航栏 -->
    <header class="app-header">
      <div class="brand-title" onclick="window.location.href='../../'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">返回大厅</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" id="btn-sound-toggle" onclick="toggleSound()">🔊</button>
        <button class="btn-icon" id="btn-rules-header" onclick="showCurrentRules()">规则</button>
      </div>
    </header>

    <!-- 游戏导航栏 -->
    <div class="game-nav-bar">
      <button class="btn-back-lobby" onclick="window.location.href='../../'">
        <span>◀ 返回大厅</span>
      </button>
      <div class="current-game-badge" id="current-game-title">⚡ 拔刀居合斩 (Iaido Slash)</div>
      
      <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重开</button>
    </div>

    
    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对战</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 同屏双人</div>
    </div>
    

    <!-- 舞台容器 -->
    <div class="stage-wrapper">
<div id="iaido-stage" onclick="handleIaidoTap()">
          <div class="iaido-hud-top">
            <div class="duelist-box">
              <span class="duelist-name" style="color:#ef4444;" id="iaido-p1-name">🔴 剑客P1</span>
              <div class="iaido-life-box" id="iaido-p1-life">⚔️⚔️⚔️</div>
            </div>
            <div style="font-size:0.8rem; color:#94a3b8;" id="iaido-round-badge">第 1 回合 (抢3胜)</div>
            <div class="duelist-box">
              <span class="duelist-name" style="color:#38bdf8;" id="iaido-p2-name">🔵 剑客P2</span>
              <div class="iaido-life-box" id="iaido-p2-life">⚔️⚔️⚔️</div>
            </div>
          </div>

          <div class="iaido-center-zone">
            <div class="iaido-moon"></div>
            <div class="iaido-state-text" id="iaido-prompt">心如止水... 伺机而动</div>
            <div class="iaido-sub-text" id="iaido-sub-prompt">出现「斬」字瞬间点击屏幕</div>
          </div>

          <div class="iaido-duelists">
            <svg class="duelist-svg" id="iaido-p1-svg" viewBox="0 0 100 120">
              <circle cx="50" cy="30" r="14" fill="#ef4444"/>
              <path d="M 50 44 L 50 90 L 35 115 M 50 90 L 65 115" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
              <path d="M 50 55 L 75 75 L 88 50" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
              <!-- 太刀 -->
              <line x1="88" y1="50" x2="105" y2="15" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <svg class="duelist-svg" id="iaido-p2-svg" viewBox="0 0 100 120" style="transform: scaleX(-1);">
              <circle cx="50" cy="30" r="14" fill="#38bdf8"/>
              <path d="M 50 44 L 50 90 L 35 115 M 50 90 L 65 115" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
              <path d="M 50 55 L 75 75 L 88 50" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
              <!-- 太刀 -->
              <line x1="88" y1="50" x2="105" y2="15" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="iaido-slash-overlay" id="iaido-slash-overlay">
            <div class="iaido-kanji">斬</div>
          </div>
          <div class="iaido-slash-line" id="iaido-slash-line"></div>
        </div>

        <!-- 6. 皇家大话骰舞台 -->
        
    </div>
  </div>


  <!-- Toast 提示 -->
  <div class="toast" id="toast-msg"></div>

  <!-- 规则与结算弹窗 -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">游戏规则</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-btn" id="modal-confirm-btn">我知道了</button>
    </div>
  </div>


  <script src="../../shared/js/audio.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="game.js"></script>
</body>
</html>
