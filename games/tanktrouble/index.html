<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🛡️ 坦克震荡 (Tank Trouble) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game-layout.css">
  <style>
/* ==========================================================================
   🛡️ 坦克震荡 (Tank Trouble) 专属样式
   ========================================================================== */
/* ==========================================================================
       12. 坦克震荡 (Tank Trouble) 样式
       ========================================================================== */
    .stage-wrapper.tanktrouble-mode {
      aspect-ratio: auto;
      height: auto;
      max-height: none;
      max-width: 540px;
      background: #111827;
      border: 1px solid #374151;
      padding: 8px;
      overflow: visible;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    #tanktrouble-stage {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .tanktrouble-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 8px;
      gap: 6px;
    }

    .tt-score-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }

    .tt-target-pill {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #475569;
      color: #fbbf24;
      border-radius: 8px;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 0.82rem;
    }

    .tt-canvas-wrapper {
      width: 100%;
      background: #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #374151;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    #tanktrouble-canvas {
      width: 100%;
      height: auto;
      display: block;
      touch-action: none;
    }

    .tanktrouble-touch-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 0 4px;
    }

    .tt-touch-player {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tt-dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .tt-dpad-row {
      display: flex;
      gap: 3px;
    }

    .tt-btn {
      width: 40px;
      height: 40px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    }
    .tt-btn:active, .tt-btn.active {
      background: #334155;
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    .tt-btn-fire {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid #fff;
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s ease;
    }
    .tt-fire-p1 {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-color: #f87171;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.5);
    }
    .tt-fire-p2 {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-color: #4ade80;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.5);
    }
    .tt-btn-fire:active, .tt-btn-fire.active {
      transform: scale(0.92);
      filter: brightness(1.25);
    }

    .tt-desktop-hints {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.74rem;
      color: #94a3b8;
      text-align: center;
    }
    .tt-desktop-hints b {
      color: #f1f5f9;
    }
    @media (max-width: 480px) {
      .tt-btn {
        width: 36px;
        height: 36px;
        font-size: 0.78rem;
      }
      .tt-btn-fire {
        width: 54px;
        height: 54px;
        font-size: 0.85rem;
      }
    }
    
#tanktrouble-stage { display: flex !important; }
  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部通用导航栏 -->
    <header class="app-header">
      <div class="brand-title" onclick="window.location.href='../../'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">返回大厅</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" id="btn-sound-toggle" onclick="toggleSound()">🔊</button>
        <button class="btn-icon" id="btn-rules-header" onclick="showCurrentRules()">规则</button>
      </div>
    </header>

    <!-- 游戏导航栏 -->
    <div class="game-nav-bar">
      <button class="btn-back-lobby" onclick="window.location.href='../../'">
        <span>◀ 返回大厅</span>
      </button>
      <div class="current-game-badge" id="current-game-title">🛡️ 坦克震荡 (Tank Trouble)</div>
      
      <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重开</button>
    </div>

    
    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对战</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 同屏双人</div>
    </div>
    

    <!-- 舞台主容器 -->
    <div class="stage-wrapper tanktrouble-mode">
<div id="tanktrouble-stage">
          <div class="tanktrouble-hud">
            <div class="tt-score-pill" style="color:#ef4444;" id="tt-p1-score">🔴 P1: 0</div>
            <div class="tt-target-pill" id="tt-match-target">抢 5 胜</div>
            <div class="tt-score-pill" style="color:#22c55e;" id="tt-p2-score">🟢 P2: 0</div>
            <div class="tt-score-pill" style="color:#3b82f6; display:none;" id="tt-p3-score">🔵 P3: 0</div>
          </div>
          <div class="tt-canvas-wrapper">
            <canvas id="tanktrouble-canvas" width="520" height="360"></canvas>
          </div>
          <!-- 移动端双人 / 单人触控面板 -->
          <div class="tanktrouble-touch-bar" id="tt-touch-controls">
            <!-- P1 移动端虚拟按键 (左侧) -->
            <div class="tt-touch-player tt-touch-p1" id="tt-touch-p1">
              <div class="tt-dpad">
                <button class="tt-btn tt-up" id="tt-p1-up">▲</button>
                <div class="tt-dpad-row">
                  <button class="tt-btn tt-left" id="tt-p1-left">◀</button>
                  <button class="tt-btn tt-down" id="tt-p1-down">▼</button>
                  <button class="tt-btn tt-right" id="tt-p1-right">▶</button>
                </div>
              </div>
              <button class="tt-btn-fire tt-fire-p1" id="tt-p1-fire">🔥 开火</button>
            </div>
            <!-- P2 移动端虚拟按键 (右侧，双人模式下显现) -->
            <div class="tt-touch-player tt-touch-p2" id="tt-touch-p2" style="display:none;">
              <button class="tt-btn-fire tt-fire-p2" id="tt-p2-fire">🔥 开火</button>
              <div class="tt-dpad">
                <button class="tt-btn tt-up" id="tt-p2-up">▲</button>
                <div class="tt-dpad-row">
                  <button class="tt-btn tt-left" id="tt-p2-left">◀</button>
                  <button class="tt-btn tt-down" id="tt-p2-down">▼</button>
                  <button class="tt-btn tt-right" id="tt-p2-right">▶</button>
                </div>
              </div>
            </div>
          </div>
          <!-- 桌面端键位指引 -->
          <div class="tt-desktop-hints" id="tt-desktop-hints">
            <span>🔴 <b>P1:</b> WASD 移动 (人机时亦可按方向键) · <b>空格 / Q</b> 开火</span>
            <span>🟢 <b>P2 (双人对战):</b> 方向键 <b>↑↓←→</b> 移动 · <b>M / Enter</b> 开火</span>
          </div>
        </div>

        <!-- 13. 飞行棋舞台 -->
        
    </div>
    <div class="game-status" id="status-text"></div>

    
  </div>


  <!-- Toast 提示 -->
  <div class="toast" id="toast-msg"></div>

  <!-- 规则与结算弹窗 -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">游戏规则</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-btn" id="modal-confirm-btn">我知道了</button>
    </div>
  </div>


  <script src="../../shared/js/audio.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="game.js"></script>
</body>
</html>
