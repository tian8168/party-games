<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魂斗罗 (Contra) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    .stage-wrapper {
      max-width: 780px !important;
      width: 100% !important;
    }

    #contra-emu-container {
      width: 100%;
      aspect-ratio: 256 / 240;
      min-height: 380px;
      max-height: 520px;
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #contra-emu-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .emu-loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(8px);
      padding: 24px;
      gap: 16px;
    }
    .emu-loading-overlay h3 {
      color: #f1f5f9;
      font-size: 1.5rem;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    .emu-loading-overlay .sub {
      color: #94a3b8;
      font-size: 0.84rem;
      text-align: center;
      line-height: 1.6;
      max-width: 440px;
    }
    .emu-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }
    .btn-emu-play {
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-emu-30lives {
      background: linear-gradient(135deg, #ef4444, #f97316);
      border-color: #fb923c;
      box-shadow: 0 4px 18px rgba(239, 68, 68, 0.45);
    }
    .btn-emu-classic {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-color: #60a5fa;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.35);
    }
    .btn-emu-upload {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      font-size: 0.88rem;
    }
    .btn-emu-play:hover {
      transform: scale(1.03);
      filter: brightness(1.15);
    }
    .btn-emu-play:active { transform: scale(0.97); }

    .status-msg {
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 700;
      min-height: 20px;
    }
    .status-err {
      color: #ef4444;
    }

    .controls-guide {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .control-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .control-card b { color: #f1f5f9; }
    .control-card .key {
      display: inline-block;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #e2e8f0;
    }

    /* Mobile touch controls */
    .touch-controls {
      display: none;
      width: 100%;
      padding: 12px 6px;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    @media (max-width: 768px) {
      .touch-controls { display: flex; }
    }
    .dpad {
      width: 120px; height: 120px;
      position: relative;
    }
    .dpad-btn {
      position: absolute;
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    .dpad-btn:active { background: rgba(255,255,255,0.3); }
    .dpad-up { left: 40px; top: 0; }
    .dpad-down { left: 40px; bottom: 0; }
    .dpad-left { left: 0; top: 40px; }
    .dpad-right { right: 0; top: 40px; }
    .action-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-weight: 900;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    .action-btn:active { filter: brightness(1.5); }
    .btn-b { background: rgba(239, 68, 68, 0.65); }
    .btn-a { background: rgba(59, 130, 246, 0.65); }
    .meta-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .meta-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #94a3b8;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
    }
    .meta-btn:active { background: rgba(255,255,255,0.25); color: #fff; }
  </style>
</head>
<body>
  <div class="container in-game">
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">🔫 魂斗罗 (Contra)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 操作</button>
        <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重置</button>
      </div>
    </div>

    <div class="stage-wrapper">
      <div id="contra-emu-container">
        <!-- Overlay -->
        <div class="emu-loading-overlay" id="emu-overlay">
          <h3>🔫 魂斗罗 · 经典红白机</h3>
          <div class="sub">
            童年 FC 原版硬件模拟，支持键盘双套键位与手机触屏。<br>请选择你要启动的版本：
          </div>

          <div class="emu-btn-group" id="emu-btn-group">
            <button class="btn-emu-play btn-emu-30lives" onclick="startBundledGame('contra_30lives.nes')">
              🔥 启动 30命S弹经典版 (推荐)
            </button>
            <button class="btn-emu-play btn-emu-classic" onclick="startBundledGame('contra.nes')">
              🛡️ 启动 原版3条命模式
            </button>
            <label class="btn-emu-play btn-emu-upload" style="margin:0;">
              📁 加载本地 .nes 文件
              <input type="file" id="rom-file-input" accept=".nes" style="display:none;" onchange="handleFileSelect(event)">
            </label>
          </div>

          <div class="status-msg" id="emu-status"></div>
        </div>
      </div>

      <!-- Touch controls for mobile -->
      <div class="touch-controls" id="touch-controls">
        <div class="dpad">
          <div class="dpad-btn dpad-up" data-btn="up">▲</div>
          <div class="dpad-btn dpad-down" data-btn="down">▼</div>
          <div class="dpad-btn dpad-left" data-btn="left">◀</div>
          <div class="dpad-btn dpad-right" data-btn="right">▶</div>
        </div>
        <div class="meta-btns">
          <div class="meta-btn" data-btn="select">SELECT</div>
          <div class="meta-btn" data-btn="start">START</div>
        </div>
        <div class="action-btns">
          <div class="action-btn btn-b" data-btn="b">B(射)</div>
          <div class="action-btn btn-a" data-btn="a">A(跳)</div>
        </div>
      </div>

      <div class="controls-guide">
        <div class="control-card">
          <b>🎮 键位方案一 (经典小键盘)</b><br>
          <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> 方向移动<br>
          <span class="key">Z</span> 射击(B) &nbsp; <span class="key">X</span> 跳跃(A)<br>
          <span class="key">Enter</span> 开始(START) &nbsp; <span class="key">Shift</span> 选人(SELECT)
        </div>
        <div class="control-card">
          <b>⚡ 键位方案二 (WASD双手流)</b><br>
          <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> 方向移动<br>
          <span class="key">J</span> 射击(B) &nbsp; <span class="key">K</span> 跳跃(A)<br>
          <span class="key">U</span> 连射(Turbo B) &nbsp; <span class="key">I</span> 连跳(Turbo A)
        </div>
      </div>
    </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script src="https://unpkg.com/jsnes@2/dist/jsnes.min.js"></script>
  <script>
    const STATE = {
      currentView: 'GAME',
      currentGame: 'CONTRA',
      gameMode: 'AI',
      turn: 1,
      scores: { 1: 0, 2: 0, 3: 0, 4: 0 },
      online: { connected: false, roomId: null, myRole: 'host', opponentJoined: false, mqttClient: null }
    };

    let emuBrowser = null;

    function setStatus(msg, isErr = false) {
      const el = document.getElementById('emu-status');
      if (el) {
        el.textContent = msg;
        el.className = 'status-msg' + (isErr ? ' status-err' : '');
      }
    }

    function startBundledGame(filename) {
      const btns = document.getElementById('emu-btn-group');
      if (btns) btns.style.opacity = '0.4';
      setStatus('⏳ 正在加载 ROM 与初始化 NES 硬件...');

      if (typeof jsnes === 'undefined') {
        setStatus('❌ JSNES 模拟器脚本加载中，请稍候再试...', true);
        if (btns) btns.style.opacity = '1';
        return;
      }

      fetch('./roms/' + filename)
        .then(resp => {
          if (!resp.ok) throw new Error('读取本地ROM失败 (HTTP ' + resp.status + ')');
          return resp.arrayBuffer();
        })
        .then(buffer => {
          runRomBuffer(buffer);
        })
        .catch(err => {
          console.error(err);
          setStatus('❌ ' + err.message, true);
          if (btns) btns.style.opacity = '1';
        });
    }

    function handleFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      setStatus('⏳ 正在读取本地文件: ' + file.name);
      const reader = new FileReader();
      reader.onload = function(evt) {
        runRomBuffer(evt.target.result);
      };
      reader.onerror = function() {
        setStatus('❌ 读取文件失败', true);
      };
      reader.readAsArrayBuffer(file);
    }

    function runRomBuffer(buffer) {
      try {
        const bytes = new Uint8Array(buffer);
        let romData = '';
        for (let i = 0; i < bytes.length; i++) {
          romData += String.fromCharCode(bytes[i]);
        }

        // Clean up previous instance if any
        if (emuBrowser) {
          try { emuBrowser.destroy(); } catch(e) {}
          emuBrowser = null;
        }

        const container = document.getElementById('contra-emu-container');
        // Remove any old canvas
        const oldCanvases = container.querySelectorAll('canvas');
        oldCanvases.forEach(c => c.remove());

        emuBrowser = new jsnes.Browser({
          container: container,
          romData: romData,
          onError: function(e) {
            console.error('NES Runtime Error:', e);
            setStatus('❌ 模拟器运行异常: ' + e.message, true);
            const overlay = document.getElementById('emu-overlay');
            if (overlay) overlay.style.display = 'flex';
          }
        });

        // Hide overlay
        const overlay = document.getElementById('emu-overlay');
        if (overlay) overlay.style.display = 'none';

        setupCustomControls();
        setupTouchControls();
      } catch(err) {
        console.error(err);
        setStatus('❌ 启动失败: ' + err.message, true);
        const btns = document.getElementById('emu-btn-group');
        if (btns) btns.style.opacity = '1';
      }
    }

    let customKeysBound = false;
    function setupCustomControls() {
      if (customKeysBound) return;
      customKeysBound = true;

      // Add dual-keyboard support: WASD + JK + UI
      window.addEventListener('keydown', (e) => {
        if (!emuBrowser || !emuBrowser.nes) return;
        const nes = emuBrowser.nes;

        if (['KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyJ', 'KeyK', 'KeyU', 'KeyI'].includes(e.code)) {
          e.preventDefault();
        }
        if (e.code === 'KeyW') nes.buttonDown(1, jsnes.Controller.BUTTON_UP);
        if (e.code === 'KeyS') nes.buttonDown(1, jsnes.Controller.BUTTON_DOWN);
        if (e.code === 'KeyA') nes.buttonDown(1, jsnes.Controller.BUTTON_LEFT);
        if (e.code === 'KeyD') nes.buttonDown(1, jsnes.Controller.BUTTON_RIGHT);
        if (e.code === 'KeyJ') nes.buttonDown(1, jsnes.Controller.BUTTON_B);
        if (e.code === 'KeyK') nes.buttonDown(1, jsnes.Controller.BUTTON_A);
        if (e.code === 'KeyU') nes.buttonDown(1, jsnes.Controller.BUTTON_TURBO_B);
        if (e.code === 'KeyI') nes.buttonDown(1, jsnes.Controller.BUTTON_TURBO_A);
      });

      window.addEventListener('keyup', (e) => {
        if (!emuBrowser || !emuBrowser.nes) return;
        const nes = emuBrowser.nes;

        if (e.code === 'KeyW') nes.buttonUp(1, jsnes.Controller.BUTTON_UP);
        if (e.code === 'KeyS') nes.buttonUp(1, jsnes.Controller.BUTTON_DOWN);
        if (e.code === 'KeyA') nes.buttonUp(1, jsnes.Controller.BUTTON_LEFT);
        if (e.code === 'KeyD') nes.buttonUp(1, jsnes.Controller.BUTTON_RIGHT);
        if (e.code === 'KeyJ') nes.buttonUp(1, jsnes.Controller.BUTTON_B);
        if (e.code === 'KeyK') nes.buttonUp(1, jsnes.Controller.BUTTON_A);
        if (e.code === 'KeyU') nes.buttonUp(1, jsnes.Controller.BUTTON_TURBO_B);
        if (e.code === 'KeyI') nes.buttonUp(1, jsnes.Controller.BUTTON_TURBO_A);
      });
    }

    let touchBound = false;
    function setupTouchControls() {
      if (touchBound) return;
      touchBound = true;

      const btnMap = {
        'up': jsnes.Controller.BUTTON_UP,
        'down': jsnes.Controller.BUTTON_DOWN,
        'left': jsnes.Controller.BUTTON_LEFT,
        'right': jsnes.Controller.BUTTON_RIGHT,
        'a': jsnes.Controller.BUTTON_A,
        'b': jsnes.Controller.BUTTON_B,
        'start': jsnes.Controller.BUTTON_START,
        'select': jsnes.Controller.BUTTON_SELECT
      };

      document.querySelectorAll('[data-btn]').forEach(el => {
        const btnName = el.getAttribute('data-btn');
        const nesBtn = btnMap[btnName];
        if (nesBtn === undefined) return;

        const press = (e) => {
          e.preventDefault();
          if (emuBrowser && emuBrowser.nes) emuBrowser.nes.buttonDown(1, nesBtn);
        };
        const release = (e) => {
          e.preventDefault();
          if (emuBrowser && emuBrowser.nes) emuBrowser.nes.buttonUp(1, nesBtn);
        };

        el.addEventListener('pointerdown', press);
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
        el.addEventListener('pointerleave', release);
      });
    }

    function resetCurrentGame() {
      if (emuBrowser && emuBrowser.nes) {
        emuBrowser.nes.reset();
      } else {
        const overlay = document.getElementById('emu-overlay');
        if (overlay) overlay.style.display = 'flex';
        const btns = document.getElementById('emu-btn-group');
        if (btns) btns.style.opacity = '1';
        setStatus('');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("🔫 魂斗罗 操作指南", `
        <p><strong>经典红白机魂斗罗 (FC/NES)</strong>，运行原版真实芯片模拟硬件。</p><br>
        <p><b>键盘操作支持两套方案：</b></p>
        <ul>
          <li><b>方案一 (单手/箭头)：</b>方向键 ↑↓←→ 移动，Z 键射击，X 键跳跃，Enter 开始，Shift 选择。</li>
          <li><b>方案二 (双手/WASD)：</b>W/A/S/D 移动，J 键射击，K 键跳跃，U 键连射，I 键连跳。</li>
        </ul><br>
        <p>手机端自动呼出底部半透明触控手柄，随时随地畅玩！</p>`, resetCurrentGame);
    });
  </script>
</body>
</html>
