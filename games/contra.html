<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魂斗罗 (Contra) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    .stage-wrapper {
      max-width: 780px !important;
      width: 100% !important;
    }

    #contra-emu-container {
      width: 100%;
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #1e293b;
      aspect-ratio: 256 / 240;
      min-height: 380px;
    }

    #contra-emu-container canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .emu-loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(6px);
      gap: 16px;
    }
    .emu-loading-overlay h3 {
      color: #f1f5f9;
      font-size: 1.4rem;
      margin: 0;
    }
    .emu-loading-overlay .sub {
      color: #94a3b8;
      font-size: 0.82rem;
      text-align: center;
      line-height: 1.6;
      max-width: 420px;
    }
    .emu-loading-overlay .status {
      color: #38bdf8;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .emu-loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .emu-error {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      max-width: 400px;
    }

    .btn-emu-start {
      padding: 14px 48px;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #dc2626, #f97316);
      border: 2px solid #fb923c;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-emu-start:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 32px rgba(239, 68, 68, 0.7);
    }
    .btn-emu-start:active { transform: scale(0.97); }

    .controls-guide {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .control-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .control-card b { color: #f1f5f9; }
    .control-card .key {
      display: inline-block;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #e2e8f0;
    }

    /* Mobile touch controls */
    .touch-controls {
      display: none;
      width: 100%;
      padding: 8px;
      gap: 8px;
    }
    @media (max-width: 768px) {
      .touch-controls { display: flex; justify-content: space-between; }
    }
    .dpad {
      width: 120px; height: 120px;
      position: relative;
    }
    .dpad-btn {
      position: absolute;
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    .dpad-btn:active { background: rgba(255,255,255,0.3); }
    .dpad-up { left: 40px; top: 0; }
    .dpad-down { left: 40px; bottom: 0; }
    .dpad-left { left: 0; top: 40px; }
    .dpad-right { right: 0; top: 40px; }
    .action-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-weight: 900;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    .action-btn:active { filter: brightness(1.5); }
    .btn-b { background: rgba(239, 68, 68, 0.6); }
    .btn-a { background: rgba(59, 130, 246, 0.6); }
    .meta-btns {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }
    .meta-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #94a3b8;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="container in-game">
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">🔫 魂斗罗 (Contra)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 操作</button>
        <button class="btn-icon" id="restart-btn">🔄 重置</button>
      </div>
    </div>

    <div class="stage-wrapper">
      <div id="contra-emu-container">
        <!-- JSNES will inject canvas here -->
        <div class="emu-loading-overlay" id="emu-overlay">
          <h3>🔫 魂斗罗 · 经典红白机</h3>
          <div class="sub">
            经典 FC/NES 原版魂斗罗，通过浏览器内置模拟器运行。<br>
            点击下方按钮加载游戏 ROM 并启动。
          </div>
          <button class="btn-emu-start" id="btn-emu-start" onclick="loadAndStartEmulator()">⚡ 加载游戏</button>
          <div class="status" id="emu-status"></div>
        </div>
      </div>

      <!-- Touch controls for mobile -->
      <div class="touch-controls" id="touch-controls">
        <div class="dpad">
          <div class="dpad-btn dpad-up" data-btn="up">▲</div>
          <div class="dpad-btn dpad-down" data-btn="down">▼</div>
          <div class="dpad-btn dpad-left" data-btn="left">◀</div>
          <div class="dpad-btn dpad-right" data-btn="right">▶</div>
        </div>
        <div class="meta-btns">
          <div class="meta-btn" data-btn="select">SELECT</div>
          <div class="meta-btn" data-btn="start">START</div>
        </div>
        <div class="action-btns">
          <div class="action-btn btn-b" data-btn="b">B</div>
          <div class="action-btn btn-a" data-btn="a">A</div>
        </div>
      </div>

      <div class="controls-guide">
        <div class="control-card">
          <b>🎮 方向控制</b><br>
          <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> 方向键移动<br>
          <span class="key">↑</span> 瞄准上方 / 跳跃中控制
        </div>
        <div class="control-card">
          <b>🔫 动作按键</b><br>
          <span class="key">Z</span> / <span class="key">X</span> = B键(射击) / A键(跳跃)<br>
          <span class="key">Enter</span> = START &nbsp; <span class="key">Shift</span> = SELECT
        </div>
      </div>
    </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script src="https://unpkg.com/jsnes@2/dist/jsnes.min.js"></script>
  <script>
    const STATE = {
      currentView: 'GAME',
      currentGame: 'CONTRA',
      gameMode: 'AI',
      turn: 1,
      scores: { 1: 0, 2: 0, 3: 0, 4: 0 },
      online: { connected: false, roomId: null, myRole: 'host', opponentJoined: false, mqttClient: null }
    };

    let emuBrowser = null;
    const ROM_URL = 'https://raw.githubusercontent.com/mengfei523060/nesrom/master/%E9%AD%82%E6%96%97%E7%BD%971%E4%B8%AD%E6%96%87%E6%97%A0%E9%99%90%E5%91%BD.nes';

    function setStatus(msg) {
      const el = document.getElementById('emu-status');
      if (el) el.textContent = msg;
    }

    function loadAndStartEmulator() {
      const btn = document.getElementById('btn-emu-start');
      if (btn) btn.style.display = 'none';
      setStatus('⏳ 正在加载模拟器引擎与游戏 ROM...');

      // Check JSNES loaded
      if (typeof jsnes === 'undefined') {
        setStatus('❌ 模拟器引擎加载失败，请刷新页面重试');
        if (btn) btn.style.display = 'block';
        return;
      }

      // Fetch ROM
      fetch(ROM_URL)
        .then(resp => {
          if (!resp.ok) throw new Error('ROM download failed: ' + resp.status);
          setStatus('⏳ ROM 下载中...');
          return resp.arrayBuffer();
        })
        .then(buffer => {
          setStatus('⏳ 正在初始化 NES 硬件模拟...');

          // Convert ArrayBuffer to binary string (JSNES expects this)
          const bytes = new Uint8Array(buffer);
          let romData = '';
          for (let i = 0; i < bytes.length; i++) {
            romData += String.fromCharCode(bytes[i]);
          }

          const container = document.getElementById('contra-emu-container');

          // Create the browser emulator
          emuBrowser = new jsnes.Browser({
            container: container,
            romData: romData,
            onError: function(e) {
              console.error('NES Error:', e);
            }
          });

          // Hide overlay
          const overlay = document.getElementById('emu-overlay');
          if (overlay) overlay.style.display = 'none';

          // Setup touch controls
          setupTouchControls();
        })
        .catch(err => {
          console.error('Failed to load ROM:', err);
          setStatus('❌ ROM 加载失败: ' + err.message);
          if (btn) btn.style.display = 'block';
        });
    }

    function setupTouchControls() {
      if (!emuBrowser || !emuBrowser.nes) return;
      const nes = emuBrowser.nes;

      const btnMap = {
        'up': jsnes.Controller.BUTTON_UP,
        'down': jsnes.Controller.BUTTON_DOWN,
        'left': jsnes.Controller.BUTTON_LEFT,
        'right': jsnes.Controller.BUTTON_RIGHT,
        'a': jsnes.Controller.BUTTON_A,
        'b': jsnes.Controller.BUTTON_B,
        'start': jsnes.Controller.BUTTON_START,
        'select': jsnes.Controller.BUTTON_SELECT
      };

      document.querySelectorAll('[data-btn]').forEach(el => {
        const btnName = el.getAttribute('data-btn');
        const nesBtn = btnMap[btnName];
        if (nesBtn === undefined) return;

        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          nes.buttonDown(1, nesBtn);
        });
        el.addEventListener('pointerup', (e) => {
          e.preventDefault();
          nes.buttonUp(1, nesBtn);
        });
        el.addEventListener('pointercancel', (e) => {
          e.preventDefault();
          nes.buttonUp(1, nesBtn);
        });
        el.addEventListener('pointerleave', (e) => {
          e.preventDefault();
          nes.buttonUp(1, nesBtn);
        });
      });
    }

    function resetCurrentGame() {
      if (emuBrowser && emuBrowser.nes) {
        emuBrowser.nes.reset();
      } else {
        const overlay = document.getElementById('emu-overlay');
        if (overlay) overlay.style.display = 'flex';
        const btn = document.getElementById('btn-emu-start');
        if (btn) btn.style.display = 'block';
        setStatus('');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("🔫 魂斗罗 操作指南", `
        <p><strong>经典红白机魂斗罗</strong>，通过浏览器 NES 模拟器运行原版 ROM。</p><br>
        <p><b>键盘操作：</b></p>
        <ul>
          <li><b>方向键 ↑↓←→：</b>移动 / 瞄准</li>
          <li><b>Z 键：</b>B键 = 射击</li>
          <li><b>X 键：</b>A键 = 跳跃</li>
          <li><b>Enter：</b>START（开始/暂停）</li>
          <li><b>Shift：</b>SELECT</li>
        </ul><br>
        <p>手机端可使用屏幕下方的虚拟按键操作。</p>`, resetCurrentGame);
    });
  </script>
</body>
</html>
