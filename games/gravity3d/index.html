<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧊 3D 立体五子棋 (3D Gomoku) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game-layout.css">
  <style>
/* ==========================================================================
   🧊 3D 立体五子棋 (3D Gomoku) 专属样式
   ========================================================================== */

    #board-3d-wrapper {
      position: relative;
      width: 100% !important;
      height: 100% !important;
      max-width: 480px;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b, #090d16);
      border: 1px solid #334155;
      display: block !important;
    }
    #board-3d-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    .btn-reset-cam {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 5;
      transition: all 0.2s;
    }
    .btn-reset-cam:hover { background: #1e293b; color: #fff; border-color: #60a5fa; }
    .tip-3d-overlay {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.72rem;
      color: #64748b;
      pointer-events: none;
      z-index: 5;
    }
  
  </style>
  <script src="../../three.min.js"></script>
  <script src="../../OrbitControls.js"></script>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部通用导航栏 -->
    <header class="app-header">
      <div class="brand-title" onclick="window.location.href='../../'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">返回大厅</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" id="btn-sound-toggle" onclick="toggleSound()">🔊</button>
        <button class="btn-icon" id="btn-rules-header" onclick="showCurrentRules()">规则</button>
      </div>
    </header>

    <!-- 游戏导航栏 -->
    <div class="game-nav-bar">
      <button class="btn-back-lobby" onclick="window.location.href='../../'">
        <span>◀ 返回大厅</span>
      </button>
      <div class="current-game-badge" id="current-game-title">🧊 3D 立体五子棋 (3D Gomoku)</div>
      
      <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重开</button>
    </div>

    
    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对战</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 同屏双人</div>
      <div class="mode-tab" id="tab-online" onclick="switchGameMode('ONLINE')">🌐 好友联机</div>
    </div>
    <!-- 联机房间控制面板 -->
      <div class="online-panel hidden" id="online-panel">
        <div class="room-header">
          <div>房间号: <span class="room-id-badge" id="display-room-id">未创建</span></div>
          <div id="display-role-info" style="font-size:0.8rem; color:#cbd5e1;">尚未进入房间</div>
        </div>
        <div class="online-actions">
          <button class="btn-action-primary" id="btn-create-room" onclick="createOnlineRoom()">
            <span>➕ 创建新房间</span>
          </button>
          <button class="btn-action-primary" id="btn-share-link" style="display:none;" onclick="copyInviteLink()">
            <span>📋 复制邀请链接发好友</span>
          </button>
          <button class="btn-action-secondary" id="btn-join-room" onclick="promptJoinRoom()">
            <span>加入房间</span>
          </button>
        </div>
      </div>

      
    <div class="scoreboard" id="generic-scoreboard">
        <div class="player-card p2" id="card-p2">
          <div class="player-avatar"></div>
          <div class="player-info">
            <div class="player-name" id="name-p2">🟢 北门</div>
            <div class="player-subinfo" id="walls-wrapper-p2">剩余挡板: <span id="walls-count-p2">10</span></div>
            <div class="wall-bars" id="wall-bars-p2"></div>
          </div>
        </div>

        <div class="player-card p1 active" id="card-p1">
          <div class="player-avatar"></div>
          <div class="player-info">
            <div class="player-name" id="name-p1">🔴 南门</div>
            <div class="player-subinfo" id="walls-wrapper-p1">剩余挡板: <span id="walls-count-p1">10</span></div>
            <div class="wall-bars" id="wall-bars-p1"></div>
          </div>
        </div>

        <!-- 4人局扩展卡片 -->
        <div class="player-card p3" id="card-p3" style="display:none;">
          <div class="player-avatar"></div>
          <div class="player-info">
            <div class="player-name" id="name-p3">🔵 西门</div>
            <div class="player-subinfo" id="walls-wrapper-p3">剩余挡板: <span id="walls-count-p3">5</span></div>
            <div class="wall-bars" id="wall-bars-p3"></div>
          </div>
        </div>

        <div class="player-card p4" id="card-p4" style="display:none;">
          <div class="player-avatar"></div>
          <div class="player-info">
            <div class="player-name" id="name-p4">🟡 东门</div>
            <div class="player-subinfo" id="walls-wrapper-p4">剩余挡板: <span id="walls-count-p4">5</span></div>
            <div class="wall-bars" id="wall-bars-p4"></div>
          </div>
        </div>
      </div>

      <!-- 飞行棋 4人专属状态栏 -->
      <div class="aeroplane-hud" id="aeroplane-hud" style="display:none;">
        <div class="aero-card aero-p0 active" id="aero-card-0" onclick="handleAeroCardClick(0)">
          <div class="aero-avatar" style="background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#ef4444;">🔴</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-0">红方</span>
              <span class="aero-role-badge" id="aero-role-0">玩家</span>
            </div>
            <div class="aero-stats" id="aero-stats-0">待机:4 · 🏁 0/4</div>
          </div>
        </div>
        <div class="aero-card aero-p1" id="aero-card-1" onclick="handleAeroCardClick(1)">
          <div class="aero-avatar" style="background:rgba(245,158,11,0.2); border:1px solid #f59e0b; color:#f59e0b;">🟡</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-1">黄方</span>
              <span class="aero-role-badge" id="aero-role-1">电脑</span>
            </div>
            <div class="aero-stats" id="aero-stats-1">待机:4 · 🏁 0/4</div>
          </div>
        </div>
        <div class="aero-card aero-p2" id="aero-card-2" onclick="handleAeroCardClick(2)">
          <div class="aero-avatar" style="background:rgba(56,189,248,0.2); border:1px solid #38bdf8; color:#38bdf8;">🔵</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-2">蓝方</span>
              <span class="aero-role-badge" id="aero-role-2">电脑</span>
            </div>
            <div class="aero-stats" id="aero-stats-2">待机:4 · 🏁 0/4</div>
          </div>
        </div>
        <div class="aero-card aero-p3" id="aero-card-3" onclick="handleAeroCardClick(3)">
          <div class="aero-avatar" style="background:rgba(34,197,94,0.2); border:1px solid #22c55e; color:#22c55e;">🟢</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-3">绿方</span>
              <span class="aero-role-badge" id="aero-role-3">电脑</span>
            </div>
            <div class="aero-stats" id="aero-stats-3">待机:4 · 🏁 0/4</div>
          </div>
        </div>
      </div>

      

    <!-- 舞台主容器 -->
    <div class="stage-wrapper">

      <div id="board-3d-wrapper">
        <canvas id="board-3d-canvas"></canvas>
        <button class="btn-reset-cam" onclick="reset3DCamera()">🔄 重置视角</button>
        <div class="tip-3d-overlay">🖱️ 拖拽360°旋转 · 滚轮缩放 · 点击任意立柱落子</div>
      </div>
  
    </div>

    <div class="game-status" id="status-text">正在加载 3D 游戏引擎...</div>
  </div>


  <!-- Toast 提示 -->
  <div class="toast" id="toast-msg"></div>

  <!-- 规则与结算弹窗 -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">游戏规则</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-btn" id="modal-confirm-btn">我知道了</button>
    </div>
  </div>


  <script src="../../shared/js/audio.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../mqtt.min.js"></script>
  <script src="../../shared/js/network.js"></script>
  <script src="game.js"></script>
</body>
</html>
