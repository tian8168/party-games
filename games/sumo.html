<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>物理飞车相扑 (Car Sumo) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    /* Override stage-wrapper to allow larger canvas for sumo */
    .stage-wrapper {
      max-width: 780px !important;
      width: 100% !important;
    }

    #sumo-stage {
      width: 100%;
      position: relative;
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      border-radius: 14px;
      border: 1px solid #1e293b;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #sumo-canvas {
      width: 100%;
      display: block;
      touch-action: none;
    }

    .sumo-hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .sumo-score-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
    }

    .sumo-touch-hint {
      position: absolute;
      bottom: 64px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      z-index: 6;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .sumo-controls-bar {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      pointer-events: auto;
    }

    .btn-sumo-boost {
      flex: 1;
      max-width: 280px;
      padding: 12px 6px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.05s ease, filter 0.05s ease;
    }
    .btn-sumo-p1 {
      background: linear-gradient(135deg, #ef4444, #f97316);
      border: 1px solid #fb923c;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45);
    }
    .btn-sumo-p2 {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border: 1px solid #38bdf8;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.45);
    }
    .btn-sumo-boost:active, .btn-sumo-boost.boosting {
      transform: scale(0.95);
      filter: brightness(1.25);
    }

    /* Start overlay */
    .sumo-start-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(6px);
      gap: 18px;
    }
    .sumo-start-overlay h3 {
      color: #f1f5f9;
      font-size: 1.5rem;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .sumo-start-overlay .sub {
      color: #94a3b8;
      font-size: 0.82rem;
      margin-top: -8px;
      text-align: center;
      line-height: 1.5;
    }
    .btn-sumo-start {
      padding: 14px 48px;
      font-size: 1.15rem;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: 2px solid #818cf8;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-sumo-start:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.7);
    }
    .btn-sumo-start:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="container in-game">
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">🚗 物理飞车相扑 (Car Sumo)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 规则</button>
        <button class="btn-icon" id="restart-btn">🔄 重置</button>
      </div>
    </div>

    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对弈</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 双人同屏</div>
    </div>

    <div class="stage-wrapper">
      <div id="sumo-stage">
          <canvas id="sumo-canvas"></canvas>
          <div class="sumo-hud">
            <div class="sumo-score-badge" style="color:#ef4444;" id="sumo-p1-score">🔴 玩家: 0</div>
            <div class="sumo-score-badge" style="color:#cbd5e1;" id="sumo-match-target">抢 3 胜</div>
            <div class="sumo-score-badge" style="color:#38bdf8;" id="sumo-p2-score">🔵 电脑: 0</div>
          </div>
          <div class="sumo-touch-hint" id="sumo-touch-hint">💡 WASD 控制方向与冲刺 / 方向键控制第二玩家</div>
          <div class="sumo-controls-bar" id="sumo-controls-bar">
            <button class="btn-sumo-boost btn-sumo-p1" id="btn-sumo-boost">🚀 按住冲刺 [空格/W]</button>
            <button class="btn-sumo-boost btn-sumo-p2" id="btn-sumo-boost-p2" style="display:none;">🚀 蓝方冲刺 [↑/回车]</button>
          </div>
          <!-- Start Overlay -->
          <div class="sumo-start-overlay" id="sumo-start-overlay">
            <h3>🚗 物理飞车相扑</h3>
            <div class="sub">
              🔴 P1: <b>WASD</b> 控制方向 + <b>空格</b> 冲刺<br>
              🔵 P2: <b>方向键</b> 控制方向 + <b>回车</b> 冲刺<br>
              将对手撞出擂台边缘即可得分！
            </div>
            <button class="btn-sumo-start" id="btn-sumo-start" onclick="startSumoMatch()">⚡ 开始对战</button>
          </div>
        </div>
    </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script>
    
    // 基础游戏运行时状态
    const STATE = {
      currentView: 'GAME',
      currentGame: 'SUMO',
      gameMode: 'AI',
      turn: 1,
      scores: { 1: 0, 2: 0, 3: 0, 4: 0 },
      online: {
        connected: false,
        roomId: null,
        myRole: 'host',
        opponentJoined: false,
        mqttClient: null
      }
    };

    STATE.sumo = {
        p1Score: 0, p2Score: 0, targetScore: 3,
        car1: null, car2: null,
        arenaRadius: 180, particles: [], animId: null,
        roundOver: false, matchOver: false, aiReactionDelay: 0,
        started: false,
        keys: { p1: { up:false, down:false, left:false, right:false }, p2: { up:false, down:false, left:false, right:false } }
      };

    function checkIsMyTurn() {
      if (STATE.gameMode === 'LOCAL') return true;
      if (STATE.gameMode === 'AI') return STATE.turn === 1;
      if (STATE.gameMode === 'ONLINE') {
        if (STATE.online.myRole === 'host' && STATE.turn === 1) return true;
        if (STATE.online.myRole === 'guest' && STATE.turn === 2) return true;
        return false;
      }
      return true;
    }

    function updateScoreboard() {}

    function switchGameMode(mode, doReset = true) {
      STATE.gameMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab-' + mode.toLowerCase());
      if (activeTab) activeTab.classList.add('active');

      // Show/hide P2 boost button
      const btnP2 = document.getElementById('btn-sumo-boost-p2');
      if (btnP2) btnP2.style.display = mode === 'LOCAL' ? 'flex' : 'none';

      // Update labels
      const isLocal = mode === 'LOCAL';
      const p2ScoreEl = document.getElementById('sumo-p2-score');
      if (p2ScoreEl) p2ScoreEl.textContent = `${isLocal ? '🔵 玩家2' : '🔵 电脑'}: 0`;
      
      const hintEl = document.getElementById('sumo-touch-hint');
      if (hintEl) {
        hintEl.textContent = isLocal
          ? '💡 🔴P1: WASD+空格 · 🔵P2: 方向键+回车'
          : '💡 WASD 控制方向，空格冲刺，将对手推出擂台！';
      }
      
      const btnP1 = document.getElementById('btn-sumo-boost');
      if (btnP1) btnP1.textContent = isLocal ? '🚀 P1 冲刺 [空格]' : '🚀 按住冲刺 [空格/W]';
      if (btnP2) btnP2.textContent = '🚀 P2 冲刺 [回车/↑]';

      // Update start overlay description
      const overlay = document.getElementById('sumo-start-overlay');
      if (overlay) {
        overlay.style.display = 'flex';
        const sub = overlay.querySelector('.sub');
        if (sub) {
          sub.innerHTML = isLocal
            ? '🔴 P1: <b>WASD</b> 控制方向 + <b>空格</b> 冲刺<br>🔵 P2: <b>方向键</b> 控制方向 + <b>回车</b> 冲刺<br>将对手撞出擂台边缘即可得分！'
            : '🔴 P1: <b>WASD</b> 控制方向 + <b>空格</b> 冲刺<br>🤖 电脑会自动追踪并发起攻击<br>将对手撞出擂台边缘即可得分！';
        }
      }

      // Stop & reset
      STATE.sumo.started = false;
      if (STATE.sumo.animId) { cancelAnimationFrame(STATE.sumo.animId); STATE.sumo.animId = null; }
      STATE.sumo.p1Score = 0;
      STATE.sumo.p2Score = 0;
      resizeSumoCanvas();
      resetSumoRound();
      renderSumo();
    }

    function sendOnlineAction(data) {
      if (window.ONLINE_NETWORK) {
        window.ONLINE_NETWORK.sendAction(data);
      }
    }
  

    // ==========================================================================
    // 物理飞车相扑核心逻辑 (SUMO)
    // ==========================================================================
    let sumoInputBound = false;

    function startSumoMatch() {
      const overlay = document.getElementById('sumo-start-overlay');
      if (overlay) overlay.style.display = 'none';
      
      STATE.sumo.started = true;
      STATE.sumo.p1Score = 0;
      STATE.sumo.p2Score = 0;
      STATE.sumo.roundOver = false;
      STATE.sumo.matchOver = false;

      resizeSumoCanvas();
      resetSumoRound();
      startSumoLoop();
    }

    function initSumoGame() {
      STATE.sumo.p1Score = 0;
      STATE.sumo.p2Score = 0;
      STATE.sumo.roundOver = false;
      STATE.sumo.matchOver = false;
      STATE.sumo.started = false;

      const isLocal = STATE.gameMode === 'LOCAL';
      const p1ScoreEl = document.getElementById('sumo-p1-score');
      const p2ScoreEl = document.getElementById('sumo-p2-score');

      if (p1ScoreEl) p1ScoreEl.textContent = `${isLocal ? '🔴 玩家1' : '🔴 玩家'}: 0`;
      if (p2ScoreEl) p2ScoreEl.textContent = `${isLocal ? '🔵 玩家2' : '🔵 电脑'}: 0`;

      // Show start overlay
      const overlay = document.getElementById('sumo-start-overlay');
      if (overlay) overlay.style.display = 'flex';

      resizeSumoCanvas();
      resetSumoRound();
      renderSumo(); // Draw once so user sees the arena

      if (!sumoInputBound) {
        sumoInputBound = true;
        bindSumoInputEvents();
      }
    }

    function setSumoBoostP1(b) {
      if (STATE.sumo.car1 && !STATE.sumo.car1.falling) STATE.sumo.car1.boosting = b;
      const btn = document.getElementById('btn-sumo-boost');
      if (btn) btn.classList.toggle('boosting', b);
    }

    function setSumoBoostP2(b) {
      if (STATE.sumo.car2 && !STATE.sumo.car2.falling) STATE.sumo.car2.boosting = b;
      const btn = document.getElementById('btn-sumo-boost-p2');
      if (btn) btn.classList.toggle('boosting', b);
    }

    function bindSumoInputEvents() {
      const btnP1 = document.getElementById('btn-sumo-boost');
      const btnP2 = document.getElementById('btn-sumo-boost-p2');
      const canvas = document.getElementById('sumo-canvas');

      const bindBtn = (el, setFn) => {
        if (!el) return;
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); setFn(true); });
        el.addEventListener('pointerup', (e) => { e.preventDefault(); setFn(false); });
        el.addEventListener('pointercancel', (e) => { e.preventDefault(); setFn(false); });
        el.addEventListener('pointerleave', (e) => { e.preventDefault(); setFn(false); });
      };

      bindBtn(btnP1, setSumoBoostP1);
      bindBtn(btnP2, setSumoBoostP2);

      if (canvas) {
        canvas.addEventListener('pointerdown', (e) => {
          if (STATE.currentGame !== 'SUMO' || !STATE.sumo.started) return;
          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const touchX = e.clientX - rect.left;
          if (STATE.gameMode === 'LOCAL') {
            if (touchX < rect.width / 2) {
              setSumoBoostP1(true);
            } else {
              setSumoBoostP2(true);
            }
          } else {
            setSumoBoostP1(true);
          }
        });

        const cancelCanvasBoost = (e) => {
          if (STATE.currentGame !== 'SUMO') return;
          e.preventDefault();
          setSumoBoostP1(false);
          setSumoBoostP2(false);
        };
        canvas.addEventListener('pointerup', cancelCanvasBoost);
        canvas.addEventListener('pointercancel', cancelCanvasBoost);
        canvas.addEventListener('pointerleave', cancelCanvasBoost);
      }

      window.addEventListener('keydown', (e) => {
        if (STATE.currentGame !== 'SUMO' || !STATE.sumo.started) return;
        if (['Space', 'KeyW', 'ArrowUp', 'KeyA', 'KeyS', 'KeyD', 'KeyL', 'Enter', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
          e.preventDefault();
        }
        if (STATE.sumo && STATE.sumo.keys) {
          const k1 = STATE.sumo.keys.p1;
          if (e.code === 'KeyW') k1.up = true;
          if (e.code === 'KeyS') k1.down = true;
          if (e.code === 'KeyA') k1.left = true;
          if (e.code === 'KeyD') k1.right = true;
          if (e.code === 'Space') { k1.up = true; setSumoBoostP1(true); }
          if (STATE.gameMode === 'LOCAL') {
            const k2 = STATE.sumo.keys.p2;
            if (e.code === 'ArrowUp') k2.up = true;
            if (e.code === 'ArrowDown') k2.down = true;
            if (e.code === 'ArrowLeft') k2.left = true;
            if (e.code === 'ArrowRight') k2.right = true;
            if (e.code === 'Enter') { k2.up = true; setSumoBoostP2(true); }
          }
        }
      });
      window.addEventListener('keyup', (e) => {
        if (STATE.currentGame !== 'SUMO') return;
        if (STATE.sumo && STATE.sumo.keys) {
          const k1 = STATE.sumo.keys.p1;
          if (e.code === 'KeyW') k1.up = false;
          if (e.code === 'KeyS') k1.down = false;
          if (e.code === 'KeyA') k1.left = false;
          if (e.code === 'KeyD') k1.right = false;
          if (e.code === 'Space') { k1.up = false; setSumoBoostP1(false); }
          if (STATE.gameMode === 'LOCAL') {
            const k2 = STATE.sumo.keys.p2;
            if (e.code === 'ArrowUp') k2.up = false;
            if (e.code === 'ArrowDown') k2.down = false;
            if (e.code === 'ArrowLeft') k2.left = false;
            if (e.code === 'ArrowRight') k2.right = false;
            if (e.code === 'Enter') { k2.up = false; setSumoBoostP2(false); }
          }
        }
      });
    }

    function resizeSumoCanvas() {
      const c = document.getElementById('sumo-canvas');
      if (!c) return;
      const stage = document.getElementById('sumo-stage');
      const stageW = stage ? stage.clientWidth : 700;
      const w = Math.max(stageW, 400);
      const h = Math.max(Math.min(w * 0.72, 520), 340);
      c.width = w;
      c.height = h;
      STATE.sumo.arenaRadius = Math.min(w, h) * 0.42;
    }

    function resetSumoRound() {
      const c = document.getElementById('sumo-canvas');
      if (!c) return;
      const cx = c.width / 2;
      const cy = c.height / 2;
      const R = STATE.sumo.arenaRadius || 180;
      const offset = Math.min(80, R * 0.45);
      const carR = Math.max(18, Math.min(22, R * 0.12));

      STATE.sumo.car1 = {
        x: cx - offset, y: cy,
        vx: 0, vy: 0, angle: 0, r: carR,
        boosting: false, falling: false, fallScale: 1, fallAlpha: 1, fallSpin: 0
      };

      STATE.sumo.car2 = {
        x: cx + offset, y: cy,
        vx: 0, vy: 0, angle: Math.PI, r: carR,
        boosting: false, falling: false, fallScale: 1, fallAlpha: 1, fallSpin: 0
      };

      STATE.sumo.particles = [];
      STATE.sumo.roundOver = false;
      STATE.sumo.aiReactionDelay = 30;
      STATE.sumo.keys = { p1: { up:false, down:false, left:false, right:false }, p2: { up:false, down:false, left:false, right:false } };

      const isLocal = STATE.gameMode === 'LOCAL';
      const p1ScoreEl = document.getElementById('sumo-p1-score');
      const p2ScoreEl = document.getElementById('sumo-p2-score');
      if (p1ScoreEl) p1ScoreEl.textContent = `${isLocal ? '🔴 玩家1' : '🔴 玩家'}: ${STATE.sumo.p1Score}`;
      if (p2ScoreEl) p2ScoreEl.textContent = `${isLocal ? '🔵 玩家2' : '🔵 电脑'}: ${STATE.sumo.p2Score}`;
    }

    function startSumoLoop() {
      if (STATE.sumo.animId) cancelAnimationFrame(STATE.sumo.animId);

      let lastTime = performance.now();
      let accumulator = 0;
      const FIXED_STEP = 1000 / 60;

      function loop(now) {
        if (STATE.currentGame === 'SUMO' && STATE.sumo.started) {
          if (!now) now = performance.now();
          let elapsed = now - lastTime;
          lastTime = now;
          if (elapsed > 100) elapsed = 100;
          accumulator += elapsed;

          while (accumulator >= FIXED_STEP) {
            updateSumoPhysics();
            accumulator -= FIXED_STEP;
          }

          renderSumo();
          STATE.sumo.animId = requestAnimationFrame(loop);
        }
      }
      loop(performance.now());
    }

    function updateSumoPhysics() {
      const c1 = STATE.sumo.car1;
      const c2 = STATE.sumo.car2;
      if (!c1 || !c2) return;

      const c = document.getElementById('sumo-canvas');
      if (!c) return;
      const cx = c.width / 2;
      const cy = c.height / 2;
      const R = STATE.sumo.arenaRadius || 180;

      // When round is ending (someone falling)
      if (STATE.sumo.roundOver) {
        [c1, c2].forEach(car => {
          if (car.falling) {
            car.x += car.vx * 0.45;
            car.y += car.vy * 0.45;
            car.fallScale = Math.max(0, car.fallScale - 0.035);
            car.fallAlpha = Math.max(0, car.fallAlpha - 0.035);
            car.fallSpin += 0.25;
          } else {
            car.vx *= 0.92;
            car.vy *= 0.92;
            car.x += car.vx;
            car.y += car.vy;
          }
        });
        STATE.sumo.particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        });
        STATE.sumo.particles = STATE.sumo.particles.filter(p => p.life > 0);
        return;
      }

      const wrapAngle = (a) => {
        while (a < -Math.PI) a += Math.PI * 2;
        while (a > Math.PI) a -= Math.PI * 2;
        return a;
      };

      // Apply controls for a car
      function applyCarPhysics(car, keys, opp, color1, color2) {
        // Explicit directional steering
        const turnSpeed = 0.10;
        if (keys.left) car.angle -= turnSpeed;
        if (keys.right) car.angle += turnSpeed;

        // Auto-aim only when NO keys are pressed at all
        if (!keys.up && !keys.down && !keys.left && !keys.right) {
          const targetAngle = Math.atan2(opp.y - car.y, opp.x - car.x);
          const diff = wrapAngle(targetAngle - car.angle);
          car.angle += diff * 0.06;
        }

        car.boosting = keys.up;
        if (keys.up) {
          car.vx += Math.cos(car.angle) * 0.55;
          car.vy += Math.sin(car.angle) * 0.55;
          if (Math.random() < 0.75) {
            STATE.sumo.particles.push({
              x: car.x - Math.cos(car.angle) * (car.r + 2),
              y: car.y - Math.sin(car.angle) * (car.r + 2),
              vx: -Math.cos(car.angle) * 2.5 + (Math.random() - 0.5) * 2,
              vy: -Math.sin(car.angle) * 2.5 + (Math.random() - 0.5) * 2,
              life: 0.7, color: Math.random() > 0.5 ? color1 : color2, size: 3.5
            });
          }
        } else if (keys.down) {
          // Reverse / brake
          car.vx -= Math.cos(car.angle) * 0.38;
          car.vy -= Math.sin(car.angle) * 0.38;
        }
      }

      if (STATE.sumo.keys) {
        applyCarPhysics(c1, STATE.sumo.keys.p1, c2, '#f97316', '#ef4444');
        if (STATE.gameMode === 'LOCAL') {
          applyCarPhysics(c2, STATE.sumo.keys.p2, c1, '#38bdf8', '#3b82f6');
        } else {
          // AI Logic - smarter behavior
          if (STATE.sumo.aiReactionDelay > 0) {
            STATE.sumo.aiReactionDelay--;
          } else {
            const distToP1 = Math.hypot(c1.x - c2.x, c1.y - c2.y);
            const distToCenter = Math.hypot(c2.x - cx, c2.y - cy);
            const targetAngle = Math.atan2(c1.y - c2.y, c1.x - c2.x);
            const diff = wrapAngle(targetAngle - c2.angle);
            c2.angle += diff * 0.09;

            // AI adapts: if near edge, retreat toward center
            if (distToCenter > R * 0.7) {
              const centerAngle = Math.atan2(cy - c2.y, cx - c2.x);
              const cDiff = wrapAngle(centerAngle - c2.angle);
              c2.angle += cDiff * 0.12;
              c2.vx += Math.cos(c2.angle) * 0.42;
              c2.vy += Math.sin(c2.angle) * 0.42;
              c2.boosting = true;
            } else if (Math.abs(diff) < 0.5 && Math.random() < 0.82) {
              c2.vx += Math.cos(c2.angle) * 0.50;
              c2.vy += Math.sin(c2.angle) * 0.50;
              c2.boosting = true;
              if (Math.random() < 0.75) {
                STATE.sumo.particles.push({
                  x: c2.x - Math.cos(c2.angle) * (c2.r + 2),
                  y: c2.y - Math.sin(c2.angle) * (c2.r + 2),
                  vx: -Math.cos(c2.angle) * 2.5 + (Math.random() - 0.5) * 2,
                  vy: -Math.sin(c2.angle) * 2.5 + (Math.random() - 0.5) * 2,
                  life: 0.65, color: '#38bdf8', size: 3
                });
              }
            } else {
              c2.boosting = false;
              // Occasional dodge
              if (distToP1 < R * 0.4 && Math.random() < 0.15) {
                c2.angle += (Math.random() > 0.5 ? 1 : -1) * 0.6;
              }
            }
          }
        }
      }

      // Drag and speed limit
      [c1, c2].forEach(car => {
        car.vx *= 0.955;
        car.vy *= 0.955;
        const spd = Math.hypot(car.vx, car.vy);
        if (spd > 9.0) {
          car.vx = (car.vx / spd) * 9.0;
          car.vy = (car.vy / spd) * 9.0;
        }
        car.x += car.vx;
        car.y += car.vy;
      });

      // Rigid collision response
      const dx = c2.x - c1.x;
      const dy = c2.y - c1.y;
      const dist = Math.hypot(dx, dy);
      const minDist = c1.r + c2.r;
      if (dist < minDist && dist > 0.001) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;

        c1.x -= nx * overlap * 0.52;
        c1.y -= ny * overlap * 0.52;
        c2.x += nx * overlap * 0.52;
        c2.y += ny * overlap * 0.52;

        const relVel = (c1.vx - c2.vx) * nx + (c1.vy - c2.vy) * ny;
        if (relVel > 0) {
          // Stronger collision: boosting car gets bonus impulse
          const c1Boosting = c1.boosting ? 1.3 : 1.0;
          const c2Boosting = c2.boosting ? 1.3 : 1.0;
          const restitution = 1.6;
          const impulse = (1 + restitution) * relVel * 0.5;
          c1.vx -= nx * impulse * c2Boosting;
          c1.vy -= ny * impulse * c2Boosting;
          c2.vx += nx * impulse * c1Boosting;
          c2.vy += ny * impulse * c1Boosting;

          AUDIO.play('bonk');

          // Impact particles
          for (let i = 0; i < 14; i++) {
            STATE.sumo.particles.push({
              x: (c1.x + c2.x) / 2,
              y: (c1.y + c2.y) / 2,
              vx: (Math.random() - 0.5) * 10,
              vy: (Math.random() - 0.5) * 10,
              life: 1.0,
              color: Math.random() > 0.5 ? '#f59e0b' : '#ffffff',
              size: Math.random() * 4 + 2
            });
          }
        }
      }

      // Edge check
      const d1 = Math.hypot(c1.x - cx, c1.y - cy);
      const d2 = Math.hypot(c2.x - cx, c2.y - cy);
      const fallThreshold = R + 8;

      if (d1 > fallThreshold || d2 > fallThreshold) {
        STATE.sumo.roundOver = true;
        AUDIO.play('fall');

        if (d1 > fallThreshold && d2 > fallThreshold) {
          if (d1 > d2) {
            c1.falling = true;
            STATE.sumo.p2Score++;
          } else {
            c2.falling = true;
            STATE.sumo.p1Score++;
          }
        } else if (d1 > fallThreshold) {
          c1.falling = true;
          STATE.sumo.p2Score++;
        } else {
          c2.falling = true;
          STATE.sumo.p1Score++;
        }

        setTimeout(checkSumoMatchEnd, 1100);
      }

      // Particles update
      STATE.sumo.particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
      });
      STATE.sumo.particles = STATE.sumo.particles.filter(p => p.life > 0);
    }

    function checkSumoMatchEnd() {
      const isLocal = STATE.gameMode === 'LOCAL';
      const p1ScoreEl = document.getElementById('sumo-p1-score');
      const p2ScoreEl = document.getElementById('sumo-p2-score');
      if (p1ScoreEl) p1ScoreEl.textContent = `${isLocal ? '🔴 玩家1' : '🔴 玩家'}: ${STATE.sumo.p1Score}`;
      if (p2ScoreEl) p2ScoreEl.textContent = `${isLocal ? '🔵 玩家2' : '🔵 电脑'}: ${STATE.sumo.p2Score}`;

      if (STATE.sumo.p1Score >= STATE.sumo.targetScore || STATE.sumo.p2Score >= STATE.sumo.targetScore) {
        const isP1 = STATE.sumo.p1Score >= STATE.sumo.targetScore;
        STATE.sumo.matchOver = true;
        const msg = isLocal
          ? (isP1 ? '🏆 🔴 玩家1 凭借狂暴冲撞夺得相扑总冠军！' : '🏆 🔵 玩家2 凭借绝妙漂移夺得相扑总冠军！')
          : (isP1 ? '🏆 猛烈推撞！你把对手彻底轰下了擂台，夺得冠军！' : '💀 遗憾跌落深渊，对手获胜！');

        showModal('相扑擂台 战报', msg);

        // Reset and show start overlay
        STATE.sumo.started = false;
        if (STATE.sumo.animId) { cancelAnimationFrame(STATE.sumo.animId); STATE.sumo.animId = null; }
        STATE.sumo.p1Score = 0;
        STATE.sumo.p2Score = 0;
        resetSumoRound();
        const overlay = document.getElementById('sumo-start-overlay');
        if (overlay) overlay.style.display = 'flex';
      } else {
        resetSumoRound();
      }
    }

    function renderSumo() {
      const c = document.getElementById('sumo-canvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      const cx = c.width / 2;
      const cy = c.height / 2;
      const R = STATE.sumo.arenaRadius || 180;

      ctx.clearRect(0, 0, c.width, c.height);

      // 1. Arena Abyss Drop-off
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R + 16, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.12)';
      ctx.fill();

      // Hazard dashed ring
      ctx.beginPath();
      ctx.arc(cx, cy, R + 5, 0, Math.PI * 2);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      if (ctx.setLineDash) ctx.setLineDash([8, 8]);
      ctx.stroke();
      if (ctx.setLineDash) ctx.setLineDash([]);

      // Main Arena Ring
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      const ringGrad = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R);
      ringGrad.addColorStop(0, '#1e293b');
      ringGrad.addColorStop(0.85, '#0f172a');
      ringGrad.addColorStop(1, '#020617');
      ctx.fillStyle = ringGrad;
      ctx.fill();

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#38bdf8';
      ctx.stroke();

      // Inner ring decorations
      ctx.beginPath();
      ctx.arc(cx, cy, R * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, R * 0.3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Center crosshair
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - 30, cy); ctx.lineTo(cx + 30, cy);
      ctx.moveTo(cx, cy - 30); ctx.lineTo(cx, cy + 30);
      ctx.stroke();
      ctx.restore();

      // 2. Particles
      STATE.sumo.particles.forEach(p => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, (p.size || 3) * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fill();
        ctx.restore();
      });

      // 3. Cars
      const cars = [STATE.sumo.car1, STATE.sumo.car2];
      cars.forEach((car, idx) => {
        if (!car) return;
        const isP1 = idx === 0;
        ctx.save();
        ctx.translate(car.x, car.y);

        if (car.falling) {
          ctx.scale(car.fallScale, car.fallScale);
          ctx.rotate(car.angle + car.fallSpin);
          ctx.globalAlpha = car.fallAlpha;
        } else {
          ctx.rotate(car.angle);
        }

        // Car Shadow
        ctx.beginPath();
        ctx.arc(2, 3, car.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fill();

        // Wheels
        ctx.fillStyle = '#334155';
        ctx.fillRect(-car.r * 0.7, -car.r - 3, car.r * 0.5, 5);
        ctx.fillRect(car.r * 0.2, -car.r - 3, car.r * 0.5, 5);
        ctx.fillRect(-car.r * 0.7, car.r - 2, car.r * 0.5, 5);
        ctx.fillRect(car.r * 0.2, car.r - 2, car.r * 0.5, 5);

        // Heavy Front Bumper
        ctx.beginPath();
        ctx.arc(car.r * 0.5, 0, car.r * 0.9, -Math.PI * 0.35, Math.PI * 0.35);
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#f59e0b';
        ctx.stroke();

        // Main Car Body
        ctx.beginPath();
        ctx.arc(0, 0, car.r, 0, Math.PI * 2);
        const carGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, car.r);
        if (isP1) {
          carGrad.addColorStop(0, '#f87171');
          carGrad.addColorStop(1, '#dc2626');
        } else {
          carGrad.addColorStop(0, '#60a5fa');
          carGrad.addColorStop(1, '#2563eb');
        }
        ctx.fillStyle = carGrad;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Cockpit
        ctx.beginPath();
        ctx.arc(car.r * 0.15, 0, car.r * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Headlights
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(car.r * 0.75, -car.r * 0.4, 3, 0, Math.PI * 2);
        ctx.arc(car.r * 0.75, car.r * 0.4, 3, 0, Math.PI * 2);
        ctx.fill();

        // Direction indicator arrow (shows where car is aiming)
        if (!car.falling && car.boosting) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.beginPath();
          ctx.moveTo(car.r + 8, 0);
          ctx.lineTo(car.r + 2, -5);
          ctx.lineTo(car.r + 2, 5);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      });
    }

    function resetSumoMatch() {
      initSumoGame();
    }

    // ==========================================================================
    

    function resetCurrentGame() {
      initSumoGame();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("🚗 物理飞车相扑 规则与操作指南", `<p><strong>极限推土机：</strong>在圆形空中悬浮擂台上，用 WASD 控制方向，空格冲刺推撞对手！</p><br>
          <p><strong>双人同屏对战：</strong>切换到"双人同屏"模式即可和朋友一起玩！</p>
          <ul>
            <li><b>🔴 玩家 1 (红车)：</b><b>WASD</b> 控制方向，<b>空格</b> 冲刺</li>
            <li><b>🔵 玩家 2 (蓝车)：</b><b>方向键</b> 控制方向，<b>回车</b> 冲刺</li>
          </ul><br>
          <p><strong>坠落深渊：</strong>利用动量冲撞把对方顶出擂台边缘即可得分，抢先得 <b>3 分</b> 者夺得总冠军！</p>`, resetCurrentGame);
      initSumoGame();
    });

    window.addEventListener('resize', () => {
      resizeSumoCanvas();
      if (!STATE.sumo.started) renderSumo();
    });
  </script>
