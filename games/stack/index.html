<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧱 极光叠叠高 (Stacker Towers) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game-layout.css">
  <style>
5. 极光叠叠高 (STACK) 样式
       ========================================================================== */
    #stack-stage {
      width: 100%;
      height: 450px;
      position: relative;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 100%);
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      display: none;
      cursor: pointer;
    }

    #stack-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stack-hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .stack-score-box {
      font-size: 1.6rem;
      font-weight: 900;
      color: #f8fafc;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    .stack-combo-badge {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      display: none;
    }

    .stack-tap-tip {
      position: absolute;
      bottom: 16px;
      width: 100%;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      pointer-events: none;
    }


    /* ==========================================================================
       
  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部通用导航栏 -->
    <header class="app-header">
      <div class="brand-title" onclick="window.location.href='../../'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">返回大厅</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" id="btn-sound-toggle" onclick="toggleSound()">🔊</button>
        <button class="btn-icon" id="btn-rules-header" onclick="showCurrentRules()">规则</button>
      </div>
    </header>

    <!-- 游戏导航栏 -->
    <div class="game-nav-bar">
      <button class="btn-back-lobby" onclick="window.location.href='../../'">
        <span>◀ 返回大厅</span>
      </button>
      <div class="current-game-badge" id="current-game-title">🧱 极光叠叠高 (Stacker Towers)</div>
      
      <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重开</button>
    </div>

    
    

    <!-- 舞台容器 -->
    <div class="stage-wrapper">
<div id="stack-stage" onclick="handleStackDrop()">
          <canvas id="stack-canvas"></canvas>
          <div class="stack-hud">
            <div class="stack-score-box" id="stack-score">0</div>
            <div class="stack-combo-badge" id="stack-combo">PERFECT x0</div>
          </div>
          <div class="stack-tap-tip" id="stack-tip">轻触屏幕任意位置落下晶体</div>
        </div>

        <!-- 12. 坦克震荡舞台 -->
        
    </div>
  </div>


  <!-- Toast 提示 -->
  <div class="toast" id="toast-msg"></div>

  <!-- 规则与结算弹窗 -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">游戏规则</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-btn" id="modal-confirm-btn">我知道了</button>
    </div>
  </div>


  <script src="../../shared/js/audio.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="game.js"></script>
</body>
</html>
