<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>皇家大话骰 (Liar's Dice) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    /* ==========================================================================
       2. 皇家大话骰 (LIARSDICE) 样式
       ========================================================================== */
    #liarsdice-stage {
      width: 100%;
      min-height: 440px;
      background: radial-gradient(circle at center, #064e3b 0%, #022c22 70%, #051b14 100%);
      border: 2px solid #047857;
      border-radius: 14px;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      position: relative;
    }

    .dice-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dice-area-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #6ee7b7;
    }

    .dice-tray {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(110, 231, 183, 0.2);
      border-radius: 10px;
      padding: 10px 8px;
      min-height: 58px;
    }

    .die-face {
      width: 42px;
      height: 42px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #0f172a;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transition: transform 0.2s, filter 0.2s;
    }
    .die-face.die-hidden {
      background: linear-gradient(135deg, #78350f, #451a03);
      border-color: #92400e;
      color: #f59e0b;
      font-size: 1.2rem;
      font-weight: 900;
    }
    .die-face.die-highlight {
      border-color: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
      transform: translateY(-2px);
    }

    .liars-bid-hud {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .liars-curr-bid {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fef08a;
    }

    .liars-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .dice-picker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .dice-qty-box {
      display: flex;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 2px;
    }

    .btn-qty-step {
      width: 32px;
      height: 32px;
      background: #334155;
      border: none;
      color: #fff;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
    }

    .dice-qty-val {
      width: 40px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .dice-val-selector {
      display: flex;
      gap: 4px;
      flex: 1;
      justify-content: flex-end;
    }

    .btn-val-choice {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-val-choice.active {
      background: #f59e0b;
      border-color: #fbbf24;
      color: #000;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
      transform: scale(1.1);
    }

    .liars-action-buttons {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-dice-bid {
      flex: 2;
      background: linear-gradient(135deg, #10b981, #059669);
      border: 1px solid #34d399;
      color: #fff;
      font-weight: 700;
      padding: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-dice-challenge {
      flex: 1.3;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: 1px solid #f87171;
      color: #fff;
      font-weight: 800;
      padding: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    
  </style>
</head>
<body>
  <div class="container in-game">
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">🎲 皇家大话骰 (Liar's Dice)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 规则</button>
        <button class="btn-icon" id="restart-btn">🔄 重置</button>
      </div>
    </div>

    
      <div class="mode-nav">
        <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对弈</div>
  <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 双人同屏</div>
</div>

    <div class="stage-wrapper">
      <div id="liarsdice-stage">
          <!-- 上方：对手骰子 -->
          <div class="dice-area">
            <div class="dice-area-header">
              <span id="liars-p2-name">🔵 对手 (恶魔AI)</span>
              <span id="liars-p2-hp">❤️❤️❤️</span>
            </div>
            <div class="dice-tray" id="liars-p2-tray"></div>
          </div>

          <!-- 中央：当前叫牌展示 -->
          <div class="liars-bid-hud">
            <div style="font-size:0.75rem; color:#94a3b8;" id="liars-turn-tip">等待摇骰...</div>
            <div class="liars-curr-bid" id="liars-curr-bid-text">当前无人叫牌 (首叫起步)</div>
            <div style="font-size:0.72rem; color:#a7f3d0;" id="liars-rule-note">💡 1点可代表任意点（除非有人叫过1点）</div>
          </div>

          <!-- 下方：己方骰子 -->
          <div class="dice-area">
            <div class="dice-area-header">
              <span id="liars-p1-name">🔴 己方手牌</span>
              <span id="liars-p1-hp">❤️❤️❤️</span>
            </div>
            <div class="dice-tray" id="liars-p1-tray"></div>
          </div>

          <!-- 叫牌操作器 -->
          <div class="liars-controls" id="liars-controls">
            <div class="dice-picker-row">
              <div class="dice-qty-box">
                <button class="btn-qty-step" onclick="stepDiceQty(-1)">-</button>
                <span class="dice-qty-val" id="dice-qty-val">4</span>
                <button class="btn-qty-step" onclick="stepDiceQty(1)">+</button>
              </div>
              <div class="dice-val-selector" id="dice-val-selector">
                <div class="btn-val-choice" data-val="1" onclick="selectDiceVal(1)">⚀</div>
                <div class="btn-val-choice" data-val="2" onclick="selectDiceVal(2)">⚁</div>
                <div class="btn-val-choice active" data-val="3" onclick="selectDiceVal(3)">⚂</div>
                <div class="btn-val-choice" data-val="4" onclick="selectDiceVal(4)">⚃</div>
                <div class="btn-val-choice" data-val="5" onclick="selectDiceVal(5)">⚄</div>
                <div class="btn-val-choice" data-val="6" onclick="selectDiceVal(6)">⚅</div>
              </div>
            </div>
            <div class="liars-action-buttons">
              <button class="btn-dice-bid" id="btn-dice-bid" onclick="submitDiceBid()">📢 叫牌下注</button>
              <button class="btn-dice-challenge" id="btn-dice-challenge" onclick="challengeDiceBid()">🚨 开！(质疑)</button>
            </div>
          </div>
        </div>
    </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script>
    
    // 基础游戏运行时状态
    const STATE = {
      currentView: 'GAME',
      currentGame: 'LIARSDICE',
      gameMode: 'AI',
      turn: 1,
      scores: { 1: 0, 2: 0, 3: 0, 4: 0 },
      online: {
        connected: false,
        roomId: null,
        myRole: 'host',
        opponentJoined: false,
        mqttClient: null
      }
    };

    function checkIsMyTurn() {
      if (STATE.gameMode === 'LOCAL') return true;
      if (STATE.gameMode === 'AI') return STATE.turn === 1;
      if (STATE.gameMode === 'ONLINE') {
        if (STATE.online.myRole === 'host' && STATE.turn === 1) return true;
        if (STATE.online.myRole === 'guest' && STATE.turn === 2) return true;
        return false;
      }
      return true;
    }

    function updateScoreboard() {
      const cardP1 = document.getElementById('card-p1');
      const cardP2 = document.getElementById('card-p2');
      const cardP3 = document.getElementById('card-p3');
      const cardP4 = document.getElementById('card-p4');
      if (cardP1) {
        cardP1.classList.toggle('active-turn', STATE.turn === 1);
        const n1 = document.getElementById('name-p1');
        if (n1) n1.innerHTML = '🔴 玩家 1 (主)' + (STATE.scores[1] !== undefined ? ' <small>('+STATE.scores[1]+')</small>' : '');
      }
      if (cardP2) {
        cardP2.classList.toggle('active-turn', STATE.turn === 2);
        const n2 = document.getElementById('name-p2');
        if (n2) {
          const p2Label = STATE.gameMode === 'AI' ? '🤖 电脑 (AI)' : (STATE.gameMode === 'ONLINE' ? '🟢 好友 (客)' : '🟢 玩家 2');
          n2.innerHTML = p2Label + (STATE.scores[2] !== undefined ? ' <small>('+STATE.scores[2]+')</small>' : '');
        }
      }
      if (cardP3) cardP3.classList.toggle('active-turn', STATE.turn === 3);
      if (cardP4) cardP4.classList.toggle('active-turn', STATE.turn === 4);
    }

    function switchGameMode(mode, doReset = true) {
      STATE.gameMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab-' + mode.toLowerCase());
      if (activeTab) activeTab.classList.add('active');

      const onlinePanel = document.getElementById('online-panel');
      if (onlinePanel) {
        onlinePanel.style.display = mode === 'ONLINE' ? 'flex' : 'none';
        if (mode === 'ONLINE' && window.ONLINE_NETWORK) {
          ONLINE_NETWORK.createRoom(STATE.currentGame);
        }
      }
      updateScoreboard();
      if (doReset && typeof resetCurrentGame === 'function') {
        resetCurrentGame();
      }
    }

    function sendOnlineAction(data) {
      if (window.ONLINE_NETWORK) {
        window.ONLINE_NETWORK.sendAction(data);
      }
    }
  

    // 8. 皇家大话骰核心逻辑 (LIARSDICE)
    // ==========================================================================
    function initLiarsDiceGame() {
      STATE.liarsdice.p1Hp = 3;
      STATE.liarsdice.p2Hp = 3;
      resetLiarsDiceRound();
    }

    function resetLiarsDiceRound() {
      STATE.liarsdice.p1Dice = Array.from({ length: 5 }, () => Math.floor(Math.random() * 6) + 1);
      STATE.liarsdice.p2Dice = Array.from({ length: 5 }, () => Math.floor(Math.random() * 6) + 1);
      STATE.liarsdice.currentBid = null;
      STATE.liarsdice.selectedQty = 3;
      STATE.liarsdice.selectedVal = 3;
      STATE.liarsdice.onesCalled = false;
      STATE.liarsdice.revealed = false;
      STATE.turn = 1;

      AUDIO.play('dice_shake');
      setTimeout(() => { AUDIO.play('cup_slam'); }, 300);

      updateLiarsDiceUI();
      renderLiarsDiceTrays();
    }

    function renderLiarsDiceTrays() {
      const diceIcons = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
      const p1Tray = document.getElementById('liars-p1-tray');
      const p2Tray = document.getElementById('liars-p2-tray');

      p1Tray.innerHTML = STATE.liarsdice.p1Dice.map(d => `<div class="die-face">${diceIcons[d]}</div>`).join('');

      if (STATE.liarsdice.revealed) {
        p2Tray.innerHTML = STATE.liarsdice.p2Dice.map(d => {
          const isTarget = d === STATE.liarsdice.currentBid?.val || (!STATE.liarsdice.onesCalled && d === 1 && STATE.liarsdice.currentBid?.val !== 1);
          return `<div class="die-face ${isTarget ? 'die-highlight' : ''}">${diceIcons[d]}</div>`;
        }).join('');
      } else {
        p2Tray.innerHTML = STATE.liarsdice.p2Dice.map(() => `<div class="die-face die-hidden">🎲</div>`).join('');
      }
    }

    function updateLiarsDiceUI() {
      const diceIcons = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
      document.getElementById('liars-p1-hp').textContent = '❤️'.repeat(STATE.liarsdice.p1Hp) + '🖤'.repeat(Math.max(0, 3 - STATE.liarsdice.p1Hp));
      document.getElementById('liars-p2-hp').textContent = '❤️'.repeat(STATE.liarsdice.p2Hp) + '🖤'.repeat(Math.max(0, 3 - STATE.liarsdice.p2Hp));

      document.getElementById('dice-qty-val').textContent = STATE.liarsdice.selectedQty;

      const choices = document.querySelectorAll('.btn-val-choice');
      choices.forEach(c => {
        c.classList.toggle('active', parseInt(c.dataset.val) === STATE.liarsdice.selectedVal);
      });

      const bidText = document.getElementById('liars-curr-bid-text');
      const turnTip = document.getElementById('liars-turn-tip');
      const challengeBtn = document.getElementById('btn-dice-challenge');

      if (STATE.liarsdice.currentBid) {
        const b = STATE.liarsdice.currentBid;
        bidText.innerHTML = `🗣️ 【${b.by === 1 ? '🔴 玩家' : '🔵 对手'}】 叫出: <span style="color:#fbbf24; font-size:1.2rem;">${b.qty} 个 ${diceIcons[b.val]} (${b.val}点)</span>`;
        challengeBtn.style.display = 'block';
      } else {
        bidText.textContent = '当前无人叫牌 (起步首叫)';
        challengeBtn.style.display = 'none';
      }

      turnTip.textContent = STATE.turn === 1 ? '👉 轮到你行动：选择更高叫牌或直接开！' : '🤖 对手思考叫牌中...';
    }

    function stepDiceQty(delta) {
      AUDIO.play('click');
      const minQty = STATE.liarsdice.currentBid ? STATE.liarsdice.currentBid.qty : 2;
      STATE.liarsdice.selectedQty = Math.max(minQty, Math.min(10, STATE.liarsdice.selectedQty + delta));
      document.getElementById('dice-qty-val').textContent = STATE.liarsdice.selectedQty;
    }

    function selectDiceVal(val) {
      AUDIO.play('click');
      STATE.liarsdice.selectedVal = val;
      updateLiarsDiceUI();
    }

    function submitDiceBid() {
      if (STATE.turn !== 1 && STATE.gameMode === 'AI') return;
      const qty = STATE.liarsdice.selectedQty;
      const val = STATE.liarsdice.selectedVal;

      if (STATE.liarsdice.currentBid) {
        const cur = STATE.liarsdice.currentBid;
        if (qty < cur.qty || (qty === cur.qty && val <= cur.val)) {
          showToast('⚠️ 叫牌必须比当前更大（数量更多，或数量相同点数更大）！');
          return;
        }
      }

      if (val === 1) STATE.liarsdice.onesCalled = true;
      STATE.liarsdice.currentBid = { qty, val, by: 1 };
      AUDIO.play('bid');

      STATE.turn = 2;
      updateLiarsDiceUI();

      if (STATE.gameMode === 'AI') {
        setTimeout(runLiarsDiceAI, 1200);
      }
    }

    function challengeDiceBid() {
      if (!STATE.liarsdice.currentBid) return;
      STATE.liarsdice.revealed = true;
      AUDIO.play('reveal');
      renderLiarsDiceTrays();

      const targetVal = STATE.liarsdice.currentBid.val;
      const targetQty = STATE.liarsdice.currentBid.qty;
      const caller = STATE.liarsdice.currentBid.by;

      let totalMatches = 0;
      [...STATE.liarsdice.p1Dice, ...STATE.liarsdice.p2Dice].forEach(d => {
        if (d === targetVal || (!STATE.liarsdice.onesCalled && d === 1 && targetVal !== 1)) {
          totalMatches++;
        }
      });

      const diceIcons = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
      const pass = totalMatches >= targetQty;

      let loser = null;
      if (pass) {
        loser = caller === 1 ? 2 : 1;
        showToast(`🚨 开牌验骰！场上一共有 <b>${totalMatches}</b> 个 ${diceIcons[targetVal]}！叫牌成立！质疑者扣血！`, 3500);
      } else {
        loser = caller;
        showToast(`🚨 开牌验骰！场上只有 <b>${totalMatches}</b> 个 ${diceIcons[targetVal]}！吹牛被抓！叫牌者扣血！`, 3500);
      }

      if (loser === 1) STATE.liarsdice.p1Hp--;
      else STATE.liarsdice.p2Hp--;

      updateLiarsDiceUI();

      if (STATE.liarsdice.p1Hp <= 0 || STATE.liarsdice.p2Hp <= 0) {
        setTimeout(() => {
          showModal('大话骰 终局', STATE.liarsdice.p1Hp > 0 ? '🏆 心理博弈拉满！你成功将对手的筹码全部蚕食！' : '💀 吹牛被对手彻底看穿，生命值归零！');
        }, 1500);
      } else {
        setTimeout(resetLiarsDiceRound, 3600);
      }
    }

    function runLiarsDiceAI() {
      if (STATE.turn !== 2 || !STATE.liarsdice.currentBid) return;
      const cur = STATE.liarsdice.currentBid;

      let myMatches = 0;
      STATE.liarsdice.p2Dice.forEach(d => {
        if (d === cur.val || (!STATE.liarsdice.onesCalled && d === 1 && cur.val !== 1)) myMatches++;
      });

      const pMatch = (!STATE.liarsdice.onesCalled && cur.val !== 1) ? 0.333 : 0.166;
      const expectedTotal = myMatches + 5 * pMatch;

      if (cur.qty >= expectedTotal + 1.6 || cur.qty >= 7) {
        document.getElementById('liars-turn-tip').textContent = '🚨 对手高喊「开！」当场验骰！';
        setTimeout(challengeDiceBid, 600);
      } else {
        let nextQty = cur.qty;
        let nextVal = cur.val;
        if (nextVal < 6) {
          nextVal += 1;
        } else {
          nextQty += 1;
          nextVal = Math.floor(Math.random() * 4) + 2;
        }
        if (nextVal === 1) STATE.liarsdice.onesCalled = true;
        STATE.liarsdice.currentBid = { qty: nextQty, val: nextVal, by: 2 };
        AUDIO.play('bid');
        STATE.turn = 1;
        updateLiarsDiceUI();
      }
    }

    function resetLiarsDiceMatch() {
      initLiarsDiceGame();
    }

    // ==========================================================================
    

    function resetCurrentGame() {
      initLiarsDiceGame();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("皇家大话骰 规则", `<p><strong>叫牌规则：</strong>双方暗摇5颗骰子，轮流报点。下一个人的叫牌必须【个数更多】或【点数更大】！</p><br>
          <p><strong>万能1点：</strong>1点可代表任意点数（除非场上有人叫过1点）。</p><br>
          <p><strong>当场质疑：</strong>觉得对方在吹牛虚报？直接喊「开」！算错者扣1点生命，扣完淘汰！</p>`, resetCurrentGame);
      initLiarsDiceGame();
    });
  </script>
</body>
</html>
