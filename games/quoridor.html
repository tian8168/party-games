<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>步步为营 (Quoridor 4P) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <script src="../mqtt.min.js" defer></script>
  <style>
    /* 步步为营 2P/4P 切换栏 */
    .quoridor-mode-bar {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 2px;
    }
    .btn-q-mode {
      flex: 1;
      padding: 6px 0;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-q-mode.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .player-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(8px);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .player-card.active {
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    }
    .player-card.p1.active {
      border-color: var(--p1-color);
      box-shadow: 0 0 12px var(--p1-glow);
    }
    .player-card.p2.active {
      border-color: var(--p2-color);
      box-shadow: 0 0 12px var(--p2-glow);
    }
    .player-card.p2-yellow-active.active {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .player-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.4);
    }
    .p1 .player-avatar { background: radial-gradient(circle at 35% 35%, #ff7f8e, var(--p1-color) 70%, #b32d3a); }
    .p2 .player-avatar { background: radial-gradient(circle at 35% 35%, #7bed9f, var(--p2-color) 70%, #1e824c); }
    .p2.yellow-theme .player-avatar { background: radial-gradient(circle at 35% 35%, #fef08a, #eab308 70%, #a16207); }

    .player-info {
      flex: 1;
      min-width: 0;
    }
    .player-name {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-subinfo {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .wall-bars { display: flex; gap: 2px; margin-top: 2px; }
    .wall-pip { width: 5px; height: 7px; background: #eccc68; border-radius: 1px; }
    .wall-pip.used { background: #475569; opacity: 0.3; }

    
  </style>
</head>
<body>
  <div class="container in-game">
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">🧱 步步为营 (Quoridor 4P)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 规则</button>
        <button class="btn-icon" id="restart-btn">🔄 重置</button>
      </div>
    </div>

    
      <div class="mode-nav">
        <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对弈</div>
  <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 双人同屏</div>
<div class="mode-tab" id="tab-online" onclick="switchGameMode('ONLINE')">🌐 好友联机</div>
</div>
      <div class="online-panel" id="online-panel">
        <div class="online-info">
          <span>房间号: <b id="display-room-id" style="color:var(--neon-cyan)">未连接</b></span>
          <span id="display-role-info">你是 <b style="color:var(--p1-color)">🔴 房主</b></span>
        </div>
        <div class="online-actions">
          <button class="btn-small" onclick="ONLINE_NETWORK.createRoom(STATE.currentGame)">创建新房</button>
          <button class="btn-small" onclick="ONLINE_NETWORK.copyLink()">复制邀请链接</button>
          <button class="btn-small" onclick="ONLINE_NETWORK.joinRoom(null, STATE.currentGame)">加入房间</button>
        </div>
      </div>
    
    
      <div class="generic-scoreboard" id="generic-scoreboard">
        <div class="player-card p2" id="card-p2">
          <div class="player-meta">
            <span class="player-name" id="name-p2">🟢 玩家 2 (客)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p2" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p2">10</span>
            <div id="wall-bars-p2" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>

        <div class="player-card p1 active-turn" id="card-p1">
          <div class="player-meta">
            <span class="player-name" id="name-p1">🔴 玩家 1 (主)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p1" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p1">10</span>
            <div id="wall-bars-p1" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>

        <div class="player-card p3" id="card-p3" style="display:none;">
          <div class="player-meta">
            <span class="player-name" id="name-p3">🔵 玩家 3 (西)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p3" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p3">5</span>
            <div id="wall-bars-p3" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>

        <div class="player-card p4" id="card-p4" style="display:none;">
          <div class="player-meta">
            <span class="player-name" id="name-p4">🟡 玩家 4 (东)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p4" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p4">5</span>
            <div id="wall-bars-p4" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>
      </div>

    <div id="quoridor-player-toggle" class="quoridor-mode-bar" style="display:flex;">
        <button class="btn-q-mode active" id="btn-q-2p" onclick="setQuoridorPlayerCount(2)">👥 经典双人 (10板)</button>
        <button class="btn-q-mode" id="btn-q-4p" onclick="setQuoridorPlayerCount(4)">👥👥 四人大乱斗 (5板)</button>
      </div>

    <div class="stage-wrapper">
      <canvas id="board-canvas"></canvas>
    </div>

    <div class="toolbar-quoridor" id="toolbar-quoridor">
        <button class="tool-btn active" id="tool-move" onclick="setQuoridorTool('MOVE')">
          <span>🚶 移动棋子</span>
        </button>
        <button class="tool-btn" id="tool-wall-h" onclick="setQuoridorTool('WALL_H')">
          <span>━ 横向挡板</span>
        </button>
        <button class="tool-btn" id="tool-wall-v" onclick="setQuoridorTool('WALL_V')">
          <span>┃ 纵向挡板</span>
        </button>
      </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script src="../common/network.js"></script>
  <script>
    
    // 基础游戏运行时状态
    const STATE = {
      currentView: 'GAME',
      currentGame: 'QUORIDOR',
      gameMode: 'AI',
      turn: 1,
      winner: null,
      animating: false,
      scores: { 1: 0, 2: 0, 3: 0, 4: 0 },
      online: {
        connected: false,
        roomId: null,
        myRole: 'host',
        opponentJoined: false,
        mqttClient: null
      },
      quoridor: {
        playerCount: 2,
        p1: { r: 8, c: 4, walls: 10 },
        p2: { r: 0, c: 4, walls: 10 },
        p3: { r: 4, c: 0, walls: 5 },
        p4: { r: 4, c: 8, walls: 5 },
        wallsH: new Set(),
        wallsV: new Set(),
        tool: 'MOVE',
        hoverPos: null,
        lastMove: null
      }
    };

    function checkIsMyTurn() {
      if (STATE.gameMode === 'LOCAL') return true;
      if (STATE.gameMode === 'AI') return STATE.turn === 1;
      if (STATE.gameMode === 'ONLINE') {
        if (STATE.online.myRole === 'host' && STATE.turn === 1) return true;
        if (STATE.online.myRole === 'guest' && STATE.turn === 2) return true;
        return false;
      }
      return true;
    }

    function updateScoreboard() {
      const cardP1 = document.getElementById('card-p1');
      const cardP2 = document.getElementById('card-p2');
      const cardP3 = document.getElementById('card-p3');
      const cardP4 = document.getElementById('card-p4');
      if (cardP1) {
        cardP1.classList.toggle('active-turn', STATE.turn === 1);
        const n1 = document.getElementById('name-p1');
        if (n1) n1.innerHTML = '🔴 玩家 1 (主)' + (STATE.scores[1] !== undefined ? ' <small>('+STATE.scores[1]+')</small>' : '');
      }
      if (cardP2) {
        cardP2.classList.toggle('active-turn', STATE.turn === 2);
        const n2 = document.getElementById('name-p2');
        if (n2) {
          const p2Label = STATE.gameMode === 'AI' ? '🤖 电脑 (AI)' : (STATE.gameMode === 'ONLINE' ? '🟢 好友 (客)' : '🟢 玩家 2');
          n2.innerHTML = p2Label + (STATE.scores[2] !== undefined ? ' <small>('+STATE.scores[2]+')</small>' : '');
        }
      }
      if (cardP3) cardP3.classList.toggle('active-turn', STATE.turn === 3);
      if (cardP4) cardP4.classList.toggle('active-turn', STATE.turn === 4);
    }

    function switchGameMode(mode, doReset = true) {
      STATE.gameMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab-' + mode.toLowerCase());
      if (activeTab) activeTab.classList.add('active');

      const onlinePanel = document.getElementById('online-panel');
      if (onlinePanel) {
        onlinePanel.style.display = mode === 'ONLINE' ? 'flex' : 'none';
        if (mode === 'ONLINE' && window.ONLINE_NETWORK) {
          ONLINE_NETWORK.createRoom(STATE.currentGame);
        }
      }
      updateScoreboard();
      if (doReset && typeof resetCurrentGame === 'function') {
        resetCurrentGame();
      }
    }

    function sendOnlineAction(data) {
      if (window.ONLINE_NETWORK) {
        window.ONLINE_NETWORK.sendAction(data);
      }
    }
  

    
    function renderWallBars(elemId, count, maxWalls) {
      const el = document.getElementById(elemId);
      if (!el) return;
      el.innerHTML = '';
      for (let i = 0; i < maxWalls; i++) {
        const pip = document.createElement('div');
        pip.className = 'wall-pip' + (i < count ? '' : ' used');
        el.appendChild(pip);
      }
    }
  

    // 2. 步步为营逻辑 (QUORIDOR)
    // ==========================================================================
    const canvas2D = document.getElementById('board-canvas');
    const ctx2D = canvas2D ? canvas2D.getContext('2d') : null;
    let cellSize = 0, grooveSize = 0, offset = 0;

    function resizeCanvas2D() {
      if (!canvas2D || !ctx2D) return;
      const rect = canvas2D.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas2D.width = rect.width * dpr;
      canvas2D.height = rect.height * dpr;
      ctx2D.resetTransform();
      ctx2D.scale(dpr, dpr);

      const cols = 9;
      grooveSize = rect.width / (cols * 4.5 + (cols - 1));
      cellSize = grooveSize * 4.5;
      offset = grooveSize / 2;
      render2D();
    }

    function getCellPos(r, c) {
      return { x: offset + c * (cellSize + grooveSize), y: offset + r * (cellSize + grooveSize) };
    }
    function getIntersectionPos(r, c) {
      return { x: offset + (c + 1) * cellSize + c * grooveSize, y: offset + (r + 1) * cellSize + r * grooveSize };
    }

    function render2D() {
      if (!canvas2D || !ctx2D) return;
      const w = canvas2D.getBoundingClientRect().width;
      const h = canvas2D.getBoundingClientRect().height;
      ctx2D.clearRect(0, 0, w, h);
      renderQuoridor();
    }

    function renderQuoridor() {
      const is4P = STATE.quoridor.playerCount === 4;
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const { x, y } = getCellPos(r, c);
          let bg = '#263346';
          if (r === 0) bg = 'rgba(255, 71, 87, 0.15)';
          else if (r === 8) bg = 'rgba(46, 213, 115, 0.15)';
          else if (is4P && c === 8) bg = 'rgba(56, 189, 248, 0.15)';
          else if (is4P && c === 0) bg = 'rgba(234, 179, 8, 0.15)';

          ctx2D.fillStyle = bg;
          ctx2D.beginPath();
          ctx2D.roundRect(x, y, cellSize, cellSize, 6);
          ctx2D.fill();
        }
      }

      const isMyTurn = checkIsMyTurn();
      if (!STATE.winner && STATE.quoridor.tool === 'MOVE' && isMyTurn) {
        const moves = getValidPawnMoves(STATE.turn);
        const colors = {
          1: 'rgba(255, 71, 87, 0.55)',
          2: 'rgba(46, 213, 115, 0.55)',
          3: 'rgba(56, 189, 248, 0.55)',
          4: 'rgba(234, 179, 8, 0.55)'
        };
        const moveColor = colors[STATE.turn] || colors[1];
        for (const m of moves) {
          const { x, y } = getCellPos(m.r, m.c);
          ctx2D.beginPath();
          ctx2D.arc(x + cellSize / 2, y + cellSize / 2, cellSize * 0.18, 0, Math.PI * 2);
          ctx2D.fillStyle = moveColor;
          ctx2D.fill();
          ctx2D.strokeStyle = '#fff';
          ctx2D.lineWidth = 1.5;
          ctx2D.stroke();
        }
      }

      const wallHWidth = cellSize * 2 + grooveSize;
      const wallThickness = grooveSize;

      for (const key of STATE.quoridor.wallsH) {
        const [r, c] = key.split(',').map(Number);
        const { x, y } = getIntersectionPos(r, c);
        ctx2D.fillStyle = '#eccc68';
        ctx2D.beginPath();
        ctx2D.roundRect(x - cellSize, y, wallHWidth, wallThickness, 3);
        ctx2D.fill();
      }
      for (const key of STATE.quoridor.wallsV) {
        const [r, c] = key.split(',').map(Number);
        const { x, y } = getIntersectionPos(r, c);
        ctx2D.fillStyle = '#eccc68';
        ctx2D.beginPath();
        ctx2D.roundRect(x, y - cellSize, wallThickness, wallHWidth, 3);
        ctx2D.fill();
      }

      if (STATE.quoridor.hoverPos && !STATE.winner && isMyTurn) {
        const hp = STATE.quoridor.hoverPos;
        const { x, y } = getIntersectionPos(hp.r, hp.c);
        ctx2D.fillStyle = hp.valid ? 'rgba(46, 213, 115, 0.7)' : 'rgba(255, 71, 87, 0.7)';
        if (hp.type === 'wallH') {
          ctx2D.beginPath(); ctx2D.roundRect(x - cellSize, y, wallHWidth, wallThickness, 3); ctx2D.fill();
        } else {
          ctx2D.beginPath(); ctx2D.roundRect(x, y - cellSize, wallThickness, wallHWidth, 3); ctx2D.fill();
        }
      }

      drawSphere2D(STATE.quoridor.p1.r, STATE.quoridor.p1.c, 1);
      drawSphere2D(STATE.quoridor.p2.r, STATE.quoridor.p2.c, 2);
      if (is4P) {
        drawSphere2D(STATE.quoridor.p3.r, STATE.quoridor.p3.c, 3);
        drawSphere2D(STATE.quoridor.p4.r, STATE.quoridor.p4.c, 4);
      }
    }

    function drawSphere2D(r, c, player) {
      const { x, y } = getCellPos(r, c);
      const cx = x + cellSize / 2, cy = y + cellSize / 2, radius = cellSize * 0.38;
      const grad = ctx2D.createRadialGradient(cx - radius * 0.3, cy - radius * 0.35, radius * 0.1, cx, cy, radius);
      if (player === 1) {
        grad.addColorStop(0, '#ff9fa8'); grad.addColorStop(0.3, '#ff4757'); grad.addColorStop(1, '#8b0015');
      } else if (player === 2) {
        grad.addColorStop(0, '#a8ffca'); grad.addColorStop(0.3, '#2ed573'); grad.addColorStop(1, '#0e6231');
      } else if (player === 3) {
        grad.addColorStop(0, '#bae6fd'); grad.addColorStop(0.3, '#38bdf8'); grad.addColorStop(1, '#0369a1');
      } else if (player === 4) {
        grad.addColorStop(0, '#fef08a'); grad.addColorStop(0.3, '#eab308'); grad.addColorStop(1, '#854d0e');
      }
      ctx2D.beginPath(); ctx2D.arc(cx, cy, radius, 0, Math.PI * 2); ctx2D.fillStyle = grad; ctx2D.fill();
      ctx2D.beginPath(); ctx2D.arc(cx - radius * 0.25, cy - radius * 0.3, radius * 0.18, 0, Math.PI * 2);
      ctx2D.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx2D.fill();
    }

    function endTurn() {
      if (STATE.quoridor.playerCount === 4) {
        const order = { 1: 3, 3: 2, 2: 4, 4: 1 };
        STATE.turn = order[STATE.turn] || 1;
      } else {
        STATE.turn = STATE.turn === 1 ? 2 : 1;
      }
      updateScoreboard();

      if (!STATE.winner && STATE.gameMode === 'AI' && STATE.turn !== 1) {
        STATE.animating = true;
        setTimeout(() => {
          runQuoridorAI();
          STATE.animating = false;
          render2D();
        }, 400);
      }
    }

    function initQuoridor() {
      STATE.winner = null;
      STATE.turn = 1;
      STATE.animating = false;
      const is4P = STATE.quoridor.playerCount === 4;
      const initialWalls = is4P ? 5 : 10;
      STATE.quoridor.p1 = { r: 8, c: 4, walls: initialWalls };
      STATE.quoridor.p2 = { r: 0, c: 4, walls: initialWalls };
      STATE.quoridor.p3 = { r: 4, c: 0, walls: initialWalls };
      STATE.quoridor.p4 = { r: 4, c: 8, walls: initialWalls };
      STATE.quoridor.wallsH.clear();
      STATE.quoridor.wallsV.clear();
      STATE.quoridor.hoverPos = null;
      STATE.quoridor.lastMove = null;
      setQuoridorTool('MOVE');
      updateScoreboard();
      resizeCanvas2D();
      render2D();
    }

    function isBlockedByWall(r1, c1, r2, c2, wallsH, wallsV) {
      if (r1 === r2) {
        const minC = Math.min(c1, c2);
        if (wallsV.has(`${r1},${minC}`) || wallsV.has(`${r1 - 1},${minC}`)) return true;
      } else if (c1 === c2) {
        const minR = Math.min(r1, r2);
        if (wallsH.has(`${minR},${c1}`) || wallsH.has(`${minR},${c1 - 1}`)) return true;
      }
      return false;
    }

    function getValidPawnMoves(player) {
      const is4P = STATE.quoridor.playerCount === 4;
      const players = {
        1: STATE.quoridor.p1,
        2: STATE.quoridor.p2,
        3: STATE.quoridor.p3,
        4: STATE.quoridor.p4
      };
      const cur = players[player];
      const allActive = is4P ? [STATE.quoridor.p1, STATE.quoridor.p2, STATE.quoridor.p3, STATE.quoridor.p4] : [STATE.quoridor.p1, STATE.quoridor.p2];
      const others = allActive.filter(p => p !== cur);

      const wallsH = STATE.quoridor.wallsH;
      const wallsV = STATE.quoridor.wallsV;
      const moves = [];
      const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];

      for (const d of dirs) {
        const nr = cur.r + d.dr;
        const nc = cur.c + d.dc;
        if (nr < 0 || nr >= 9 || nc < 0 || nc >= 9) continue;
        if (isBlockedByWall(cur.r, cur.c, nr, nc, wallsH, wallsV)) continue;

        const opp = others.find(p => p.r === nr && p.c === nc);
        if (opp) {
          // 直线跳跃
          const jumpR = nr + d.dr;
          const jumpC = nc + d.dc;
          const jumpOccupied = others.some(p => p.r === jumpR && p.c === jumpC);
          const canStraight = jumpR >= 0 && jumpR < 9 && jumpC >= 0 && jumpC < 9 &&
                              !jumpOccupied &&
                              !isBlockedByWall(opp.r, opp.c, jumpR, jumpC, wallsH, wallsV);

          if (canStraight) {
            moves.push({ r: jumpR, c: jumpC });
          } else {
            // 斜向跳跃 (当正向被阻挡、出界或有第三方子)
            const sideDirs = d.dr !== 0 ? [{ dr: 0, dc: -1 }, { dr: 0, dc: 1 }] : [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }];
            for (const sd of sideDirs) {
              const diagR = opp.r + sd.dr;
              const diagC = opp.c + sd.dc;
              if (diagR >= 0 && diagR < 9 && diagC >= 0 && diagC < 9) {
                const diagOccupied = others.some(p => p.r === diagR && p.c === diagC);
                if (!diagOccupied && !isBlockedByWall(opp.r, opp.c, diagR, diagC, wallsH, wallsV)) {
                  moves.push({ r: diagR, c: diagC });
                }
              }
            }
          }
        } else {
          moves.push({ r: nr, c: nc });
        }
      }
      return moves;
    }

    function hasPath(startR, startC, targetType, targetVal, wallsH, wallsV) {
      const queue = [{ r: startR, c: startC }];
      const visited = new Uint8Array(81);
      visited[startR * 9 + startC] = 1;
      const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];

      while (queue.length > 0) {
        const { r, c } = queue.shift();
        if (targetType === 'ROW' && r === targetVal) return true;
        if (targetType === 'COL' && c === targetVal) return true;

        for (const d of dirs) {
          const nr = r + d.dr, nc = c + d.dc;
          if (nr < 0 || nr >= 9 || nc < 0 || nc >= 9) continue;
          if (visited[nr * 9 + nc]) continue;
          if (isBlockedByWall(r, c, nr, nc, wallsH, wallsV)) continue;
          visited[nr * 9 + nc] = 1;
          queue.push({ r: nr, c: nc });
        }
      }
      return false;
    }

    function getShortestDistance(startR, startC, targetType, targetVal, wallsH, wallsV) {
      const queue = [{ r: startR, c: startC, dist: 0 }];
      const visited = new Uint8Array(81);
      visited[startR * 9 + startC] = 1;
      const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];

      while (queue.length > 0) {
        const { r, c, dist } = queue.shift();
        if (targetType === 'ROW' && r === targetVal) return dist;
        if (targetType === 'COL' && c === targetVal) return dist;

        for (const d of dirs) {
          const nr = r + d.dr, nc = c + d.dc;
          if (nr < 0 || nr >= 9 || nc < 0 || nc >= 9) continue;
          if (visited[nr * 9 + nc]) continue;
          if (isBlockedByWall(r, c, nr, nc, wallsH, wallsV)) continue;
          visited[nr * 9 + nc] = 1;
          queue.push({ r: nr, c: nc, dist: dist + 1 });
        }
      }
      return Infinity;
    }

    function canPlaceWall(type, r, c) {
      if (r < 0 || r >= 8 || c < 0 || c >= 8) return false;
      const wallsH = STATE.quoridor.wallsH;
      const wallsV = STATE.quoridor.wallsV;
      if (type === 'H' && wallsV.has(`${r},${c}`)) return false;
      if (type === 'V' && wallsH.has(`${r},${c}`)) return false;

      if (type === 'H') {
        if (wallsH.has(`${r},${c}`) || wallsH.has(`${r},${c - 1}`) || wallsH.has(`${r},${c + 1}`)) return false;
      } else {
        if (wallsV.has(`${r},${c}`) || wallsV.has(`${r - 1},${c}`) || wallsV.has(`${r + 1},${c}`)) return false;
      }

      const testH = new Set(wallsH);
      const testV = new Set(wallsV);
      if (type === 'H') testH.add(`${r},${c}`);
      else testV.add(`${r},${c}`);

      // 必须确保所有在场玩家均有活路
      const p1 = STATE.quoridor.p1;
      const p2 = STATE.quoridor.p2;
      if (!hasPath(p1.r, p1.c, 'ROW', 0, testH, testV)) return false;
      if (!hasPath(p2.r, p2.c, 'ROW', 8, testH, testV)) return false;

      if (STATE.quoridor.playerCount === 4) {
        const p3 = STATE.quoridor.p3;
        const p4 = STATE.quoridor.p4;
        if (!hasPath(p3.r, p3.c, 'COL', 8, testH, testV)) return false;
        if (!hasPath(p4.r, p4.c, 'COL', 0, testH, testV)) return false;
      }
      return true;
    }

    function setQuoridorTool(tool) {
      AUDIO.play('click');
      STATE.quoridor.tool = tool;
      document.getElementById('tool-move').classList.toggle('active', tool === 'MOVE');
      document.getElementById('tool-wall-h').classList.toggle('active', tool === 'WALL_H');
      document.getElementById('tool-wall-v').classList.toggle('active', tool === 'WALL_V');
      STATE.quoridor.hoverPos = null;
      render2D();
    }

    function executeQuoridorMove(r, c) {
      AUDIO.play('drop');
      const players = {
        1: STATE.quoridor.p1,
        2: STATE.quoridor.p2,
        3: STATE.quoridor.p3,
        4: STATE.quoridor.p4
      };
      const cur = players[STATE.turn];
      const fromR = cur.r, fromC = cur.c;
      cur.r = r; cur.c = c;
      STATE.quoridor.lastMove = { type: 'MOVE', player: STATE.turn, fromR, fromC, r, c };

      let winner = null;
      if (STATE.quoridor.p1.r === 0) winner = 1;
      else if (STATE.quoridor.p2.r === 8) winner = 2;
      else if (STATE.quoridor.playerCount === 4 && STATE.quoridor.p3.c === 8) winner = 3;
      else if (STATE.quoridor.playerCount === 4 && STATE.quoridor.p4.c === 0) winner = 4;

      if (winner !== null) {
        AUDIO.play('win');
        STATE.winner = winner;
        const names = {
          1: '🔴 红方 (南门)',
          2: '🟢 绿方 (北门)',
          3: '🔵 蓝方 (西门)',
          4: '🟡 黄方 (东门)'
        };
        showModal('🎉 游戏结束', `<strong>${names[winner]} 成功抵达终点线，斩获胜利！</strong>`);
      } else {
        endTurn();
      }
      render2D();
    }

    function executeQuoridorWall(type, r, c) {
      AUDIO.play('drop');
      if (type === 'H') STATE.quoridor.wallsH.add(`${r},${c}`);
      else STATE.quoridor.wallsV.add(`${r},${c}`);
      const players = {
        1: STATE.quoridor.p1,
        2: STATE.quoridor.p2,
        3: STATE.quoridor.p3,
        4: STATE.quoridor.p4
      };
      const cur = players[STATE.turn];
      cur.walls--;
      STATE.quoridor.lastMove = { type: 'WALL', player: STATE.turn, wallType: type, r, c };
      STATE.quoridor.hoverPos = null;
      endTurn();
      render2D();
    }

    function runQuoridorAI() {
      if (STATE.winner) return;
      const goals = {
        2: { type: 'ROW', val: 8 },
        3: { type: 'COL', val: 8 },
        4: { type: 'COL', val: 0 }
      };
      const goal = goals[STATE.turn] || { type: 'ROW', val: 8 };
      const moves = getValidPawnMoves(STATE.turn);

      if (moves.length > 0) {
        moves.sort((a, b) => {
          const da = getShortestDistance(a.r, a.c, goal.type, goal.val, STATE.quoridor.wallsH, STATE.quoridor.wallsV);
          const db = getShortestDistance(b.r, b.c, goal.type, goal.val, STATE.quoridor.wallsH, STATE.quoridor.wallsV);
          return da - db;
        });
        executeQuoridorMove(moves[0].r, moves[0].c);
      }
      STATE.animating = false;
      render2D();
    }

    // ==========================================================================
    

    function resetCurrentGame() {
      initQuoridor();
    }

    function setQuoridorPlayerCount(count) {
      STATE.quoridor.playerCount = count;
      document.getElementById('btn-q-2p').classList.toggle('active', count === 2);
      document.getElementById('btn-q-4p').classList.toggle('active', count === 4);
      document.getElementById('card-p3').style.display = count === 4 ? 'flex' : 'none';
      document.getElementById('card-p4').style.display = count === 4 ? 'flex' : 'none';
      initQuoridor();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("步步为营 (Quoridor 4P) 规则", `<p><strong>胜利目标：</strong>率先到达自己对向的胜利线（🔴南冲北、🟢北冲南、🔵西冲东、🟡东冲西）！</p><br>
          <p><strong>挡板分配：</strong>双人局各 10 块；四人局各 5 块！放板必须为所有玩家至少留一条活路！</p><br>
          <p><strong>跳跃规则：</strong>面对邻格棋子可直线跳过；若正向受阻或有墙，可向侧方斜跳！</p><br>
          <p><strong>轮替顺序：</strong>顺时针依次行动（🔴P1 -> 🔵P3 -> 🟢P2 -> 🟡P4）！</p>`, resetCurrentGame);
      setQuoridorPlayerCount(2);
      initQuoridor();
    });
    window.addEventListener('resize', resizeCanvas2D);
  </script>
