<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>极光炸弹人大乱斗 (Neon Bomberman 4P) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-color: #f8fafc;
      --p1-color: #ff4757;
      --p2-color: #2ed573;
      --p3-color: #1e90ff;
      --p4-color: #ffa502;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      overflow: hidden;
      touch-action: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: rgba(30, 41, 59, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .app-header button {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .bm-wrapper {
      max-width: 820px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      gap: 10px;
    }

    .bm-hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .bm-card {
      background-color: var(--panel-bg);
      border-radius: 8px;
      padding: 10px;
      border: 2px solid;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .bm-card.dead {
      opacity: 0.4;
      filter: grayscale(100%);
    }

    .bm-card-header {
      font-weight: bold;
      text-align: center;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .bm-stats {
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
    }

    #bm-card-p1 { border-color: var(--p1-color); box-shadow: 0 0 10px var(--p1-color); }
    #bm-card-p2 { border-color: var(--p2-color); box-shadow: 0 0 10px var(--p2-color); }
    #bm-card-p3 { border-color: var(--p3-color); box-shadow: 0 0 10px var(--p3-color); }
    #bm-card-p4 { border-color: var(--p4-color); box-shadow: 0 0 10px var(--p4-color); }

    .bm-canvas-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    #bm-canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .controls-setup {
      display: flex;
      justify-content: space-between;
      background-color: var(--panel-bg);
      padding: 10px;
      border-radius: 8px;
    }

    .btn-group {
      display: flex;
      gap: 5px;
    }

    .btn-group button {
      background-color: #334155;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-group button.active {
      background-color: #3b82f6;
    }

    .key-hints {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      padding: 5px;
      background-color: var(--panel-bg);
      border-radius: 8px;
    }

    .key-hints span { margin: 0 5px; }

    #bm-victory-overlay, #bm-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      display: none;
    }

    .overlay-content {
      text-align: center;
      animation: bm-neon-pulse 2s infinite;
    }

    .overlay-content h1 { font-size: 3rem; margin: 0; }
    .overlay-content button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1.2rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    @keyframes bm-neon-pulse {
      0% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00de, 0 0 40px #ff00de; }
      50% { text-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 10px #ff00de, 0 0 20px #ff00de; }
      100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00de, 0 0 40px #ff00de; }
    }
    
    @keyframes bm-explosion-ring {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Mobile Controls */
    .mobile-controls {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 50;
    }

    .dpad, .action-btns {
      pointer-events: auto;
      display: grid;
      gap: 5px;
    }

    .dpad {
      grid-template-areas: 
        ". up ."
        "left center right"
        ". down .";
    }

    .action-btns {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .ctrl-btn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      color: white;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
    }
    
    .ctrl-btn:active { background: rgba(255,255,255,0.5); }

    .d-up { grid-area: up; }
    .d-down { grid-area: down; }
    .d-left { grid-area: left; }
    .d-right { grid-area: right; }

    @media (max-width: 768px) {
      .bm-hud { grid-template-columns: 1fr 1fr; }
      .mobile-controls { display: flex; }
      .key-hints { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-header">
      <button onclick="window.location.href='../index.html'">🏠 首页</button>
      <div style="font-weight: bold;">极光炸弹人大乱斗</div>
      <div>
        <button id="btn-sound">🔊</button>
        <button id="btn-rules">❓</button>
      </div>
    </div>

    <div class="bm-wrapper">
      <div class="controls-setup">
        <div class="btn-group" id="player-select">
          <span>玩家数: </span>
          <button id="bm-btn-p1" class="bm-player-toggle">1P</button>
          <button id="bm-btn-p2" class="bm-player-toggle active">2P</button>
          <button id="bm-btn-p3" class="bm-player-toggle">3P</button>
          <button id="bm-btn-p4" class="bm-player-toggle">4P</button>
        </div>
        <div class="btn-group" id="round-select">
          <span>赛制: </span>
          <button id="bm-btn-r3" class="active">BO3</button>
          <button id="bm-btn-r5">BO5</button>
          <button id="bm-btn-r7">BO7</button>
        </div>
        <button id="bm-btn-start" style="background:#22c55e; color:white; border:none; padding:5px 15px; border-radius:4px; cursor:pointer;">开始游戏</button>
      </div>

      <div class="bm-hud">
        <div class="bm-card" id="bm-card-p1">
          <div class="bm-card-header" style="color: var(--p1-color);">P1 (🔴)</div>
          <div class="bm-stats">
            <span>得分: <span id="bm-score-p1">0</span></span>
          </div>
          <div class="bm-stats">
            <span id="bm-bombs-p1">💣</span>
            <span id="bm-fire-p1">🔥</span>
            <span id="bm-speed-p1">🐢</span>
          </div>
        </div>
        <div class="bm-card" id="bm-card-p2">
          <div class="bm-card-header" style="color: var(--p2-color);">P2 (🟢)</div>
          <div class="bm-stats">
            <span>得分: <span id="bm-score-p2">0</span></span>
          </div>
          <div class="bm-stats">
            <span id="bm-bombs-p2">💣</span>
            <span id="bm-fire-p2">🔥</span>
            <span id="bm-speed-p2">🐢</span>
          </div>
        </div>
        <div class="bm-card" id="bm-card-p3">
          <div class="bm-card-header" style="color: var(--p3-color);">P3 (🔵)</div>
          <div class="bm-stats">
            <span>得分: <span id="bm-score-p3">0</span></span>
          </div>
          <div class="bm-stats">
            <span id="bm-bombs-p3">💣</span>
            <span id="bm-fire-p3">🔥</span>
            <span id="bm-speed-p3">🐢</span>
          </div>
        </div>
        <div class="bm-card" id="bm-card-p4">
          <div class="bm-card-header" style="color: var(--p4-color);">P4 (🟡)</div>
          <div class="bm-stats">
            <span>得分: <span id="bm-score-p4">0</span></span>
          </div>
          <div class="bm-stats">
            <span id="bm-bombs-p4">💣</span>
            <span id="bm-fire-p4">🔥</span>
            <span id="bm-speed-p4">🐢</span>
          </div>
        </div>
      </div>

      <div class="bm-canvas-wrapper" id="bm-stage">
        <canvas id="bm-canvas"></canvas>
        <div id="bm-overlay">
          <div class="overlay-content">
            <h1 id="bm-overlay-text">ROUND 1</h1>
          </div>
        </div>
        <div id="bm-victory-overlay">
          <div class="overlay-content">
            <h1 id="bm-victory-text">P1 WINS!</h1>
            <button onclick="restartBombermanGame()">再来一局</button>
          </div>
        </div>
        
        <!-- Mobile Controls Overlay -->
        <div class="mobile-controls">
          <div class="dpad">
            <div class="ctrl-btn d-up" data-key="up">▲</div>
            <div class="ctrl-btn d-left" data-key="left">◀</div>
            <div class="ctrl-btn d-right" data-key="right">▶</div>
            <div class="ctrl-btn d-down" data-key="down">▼</div>
          </div>
          <div class="action-btns">
            <div class="ctrl-btn" data-key="bomb" style="background: rgba(239, 68, 68, 0.4); width: 50px; height: 50px;">💣</div>
            <div class="ctrl-btn" data-key="kick" style="background: rgba(59, 130, 246, 0.4);">👟</div>
          </div>
        </div>
      </div>

      <div class="key-hints">
        <span>🔴 WASD/Space/E</span>
        <span>🟢 ↑↓←→/Enter/\</span>
        <span>🔵 IJKL/O/P</span>
        <span>🟡 8456/Num+/Num0</span>
      </div>
    </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script src="./js/bomberman.js"></script>
</body>
</html>
