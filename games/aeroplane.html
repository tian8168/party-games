<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✈️ 四人飞行棋 (Aeroplane Chess) · Party Arcade</title>
  <script src="../three.min.js"></script>
  <script src="../OrbitControls.js"></script>
  <script src="../mqtt.min.js"></script>
  <style>

    :root {
      --bg-gradient: radial-gradient(circle at center, #151d2a 0%, #080c14 100%);
      --panel-bg: rgba(22, 32, 48, 0.85);
      --card-bg: rgba(30, 41, 59, 0.7);
      --p1-color: #ff4757;
      --p1-glow: rgba(255, 71, 87, 0.5);
      --p2-color: #2ed573;
      --p2-glow: rgba(46, 213, 115, 0.5);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --neon-cyan: #38bdf8;
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 10px 12px 24px;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: max-width 0.3s ease;
    }

    .container.in-game {
      max-width: 680px;
    }

    /* 顶部通用导航栏 */
    .app-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .brand-title .badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      font-weight: 600;
      -webkit-text-fill-color: #93c5fd;
    }

    .header-tools {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-icon {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: #334155;
      border-color: #64748b;
    }

    /* ==========================================================================
       游戏房间视图 (GAME VIEW)
       ========================================================================== */
    #game-view {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .game-nav-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-back-lobby {
      background: #1e293b;
      border: 1px solid #475569;
      color: #38bdf8;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-back-lobby:hover {
      background: #334155;
      border-color: #38bdf8;
    }

    .current-game-badge {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f2f6;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 模式切换选项卡 */
    .mode-nav {
      width: 100%;
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 3px;
      border: 1px solid #334155;
    }

    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.25s;
    }

    .mode-tab.active {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* 联机房间面板 */
    .online-panel {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .online-panel.hidden { display: none; }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }

    .room-id-badge {
      background: #0f172a;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      color: #38bdf8;
      border: 1px solid #1e293b;
    }

    .online-actions {
      display: flex;
      gap: 6px;
    }

    .btn-action-primary {
      flex: 1;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-action-secondary {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* 计分与角色状态栏 */
    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .scoreboard.scoreboard-4p {
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .player-card.p3.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .player-card.p4.active {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .p3 .player-avatar { background: radial-gradient(circle at 35% 35%, #7dd3fc, var(--neon-cyan) 70%, #0369a1); }
    .p4 .player-avatar { background: radial-gradient(circle at 35% 35%, #fef08a, var(--gold) 70%, #a16207); }

    /* 步步为营 2P/4P 切换栏 */
    .quoridor-mode-bar {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 2px;
    }
    .btn-q-mode {
      flex: 1;
      padding: 6px 0;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-q-mode.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .player-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(8px);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .player-card.active {
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    }
    .player-card.p1.active {
      border-color: var(--p1-color);
      box-shadow: 0 0 12px var(--p1-glow);
    }
    .player-card.p2.active {
      border-color: var(--p2-color);
      box-shadow: 0 0 12px var(--p2-glow);
    }
    .player-card.p2-yellow-active.active {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .player-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.4);
    }
    .p1 .player-avatar { background: radial-gradient(circle at 35% 35%, #ff7f8e, var(--p1-color) 70%, #b32d3a); }
    .p2 .player-avatar { background: radial-gradient(circle at 35% 35%, #7bed9f, var(--p2-color) 70%, #1e824c); }
    .p2.yellow-theme .player-avatar { background: radial-gradient(circle at 35% 35%, #fef08a, #eab308 70%, #a16207); }

    .player-info {
      flex: 1;
      min-width: 0;
    }
    .player-name {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-subinfo {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .wall-bars { display: flex; gap: 2px; margin-top: 2px; }
    .wall-pip { width: 5px; height: 7px; background: #eccc68; border-radius: 1px; }
    .wall-pip.used { background: #475569; opacity: 0.3; }

    /* 舞台主容器 (480x480 max) */
    .stage-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 480px;
      max-height: 480px;
      background: #131d2c;
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.05);
      border: 1px solid #334155;
      position: relative;
      overflow: hidden;
    }

    /* 魂斗罗动作模式自适应样式 */
    .stage-wrapper.contra-mode {
      aspect-ratio: auto;
      height: auto;
      max-height: none;
      max-width: 520px;
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
      overflow: visible;
    }

    #board-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
    }

    /* 3D 舞台 */
    #board-3d-wrapper {
      width: 100%;
      height: 100%;
      display: none;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }
    #board-3d-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #board-3d-canvas:active { cursor: grabbing; }

    .btn-reset-cam {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .btn-reset-cam:hover { background: #334155; color: #38bdf8; border-color: #38bdf8; }

    .tip-3d-overlay {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 12px;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.1);
    }

      border: 1px solid #334155;
    }
    .gravity-col-btn {
      flex: 1;
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 0;
      border-radius: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .gravity-col-btn:hover { background: #3b82f6; color: #fff; }

    /* Toast 浮窗 */
    .toast {
      position: fixed;
      top: 20px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #f0f9ff;
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 200;
      display: none;
      align-items: center;
      gap: 6px;
      animation: fadeInDown 0.3s ease;
      max-width: 90%;
      text-align: center;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 通用弹窗 */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      color: #e2e8f0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
    .modal-body { font-size: 0.85rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 18px; text-align: left; }
    .modal-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }
  
    /* --- 新增分类标签与通用舞台美化 --- */
    .tag-reflex { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

    /* ==========================================================================
       飞行棋专属样式 (AEROPLANE CHESS 4P)
       ========================================================================== */
    .aeroplane-hud {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 2px;
    }
    @media (max-width: 480px) {
      .aeroplane-hud {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
    }
    .aero-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .aero-card:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: #475569;
    }
    .aero-p0.active {
      border-color: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.55);
      background: rgba(239, 68, 68, 0.12);
    }
    .aero-p1.active {
      border-color: #f59e0b;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.12);
    }
    .aero-p2.active {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.12);
    }
    .aero-p3.active {
      border-color: #22c55e;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.55);
      background: rgba(34, 197, 94, 0.12);
    }
    .aero-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .aero-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .aero-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: space-between;
    }
    .aero-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: #f8fafc;
      white-space: nowrap;
    }
    .aero-role-badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-weight: 600;
    }
    .aero-card.active .aero-role-badge {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .aero-stats {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* 舞台包装与Canvas */
    #aeroplane-stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: none;
    }
    #aeroplane-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 12px;
      cursor: pointer;
    }

    /* 飞行棋底部控制台 */
    .aeroplane-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .aero-ctrl-top {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .aero-dice-wrap {
      cursor: pointer;
      flex-shrink: 0;
      perspective: 400px;
    }
    .aero-dice {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #ffffff, #e2e8f0);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45), inset 0 2px 3px rgba(255, 255, 255, 0.9);
      border: 2px solid #cbd5e1;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none;
    }
    .aero-dice:hover {
      transform: scale(1.06);
    }
    .aero-dice.rolling {
      animation: aero-dice-spin 0.4s ease-in-out infinite;
    }
    @keyframes aero-dice-spin {
      0% { transform: rotate(0deg) rotateX(0deg) scale(0.9); }
      25% { transform: rotate(90deg) rotateX(40deg) scale(1.08); }
      50% { transform: rotate(180deg) rotateX(0deg) scale(0.95); }
      75% { transform: rotate(270deg) rotateX(-40deg) scale(1.08); }
      100% { transform: rotate(360deg) rotateX(0deg) scale(1); }
    }
    .dice-pip-text {
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      color: #1e293b;
    }
    .aero-action-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .aero-prompt {
      font-size: 0.82rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-aero-roll {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: 1px solid #60a5fa;
      color: #fff;
      padding: 7px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
    }
    .btn-aero-roll:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
    .btn-aero-roll:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }
    .aero-plane-picker {
      background: rgba(30, 41, 59, 0.9);
      border: 1px dashed #64748b;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: aero-fade-in 0.25s ease-out;
    }
    @keyframes aero-fade-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .aero-picker-title {
      font-size: 0.76rem;
      color: #38bdf8;
      font-weight: 700;
    }
    .aero-picker-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-plane-choice {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-plane-choice:hover {
      background: #2563eb;

  <script>

    // Canvas roundRect 跨端安全兼容垫片
    (function() {
      function polyfill(proto) {
        if (!proto || proto.roundRect) return;
        proto.roundRect = function(x, y, w, h, radii) {
          let r = Array.isArray(radii) ? radii[0] : (radii || 0);
          r = Math.min(r, w / 2, h / 2);
          this.beginPath();
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          this.closePath();
          return this;
        };
      }
      if (typeof CanvasRenderingContext2D !== 'undefined') polyfill(CanvasRenderingContext2D.prototype);
      if (typeof HTMLCanvasElement !== 'undefined') {
        const origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, ...args) {
          const ctx = origGetContext.apply(this, [type, ...args]);
          if (ctx && !ctx.roundRect) polyfill(ctx);
          return ctx;
        };
      }
    })();

    // ==========================================================================
    // 0. 原生 Web Audio 纯合成音效系统 (0 体积无外链依赖)
    // ==========================================================================
    const AUDIO = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      },
      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      },
      play(type) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        try {
          if (type === 'click') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(150, t + 0.05);
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.05);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.05);
          } else if (type === 'drop') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, t);
            osc.frequency.exponentialRampToValueAtTime(110, t + 0.09);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.09);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.09);
          } else if (type === 'shot') { // 霰弹枪炸鸣
            const bufferSize = this.ctx.sampleRate * 0.35;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, t);
            filter.frequency.linearRampToValueAtTime(150, t + 0.3);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.65, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(t);
          } else if (type === 'blank') { // 空枪撞针清脆咔哒
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1500, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.035);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.035);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.035);
          } else if (type === 'rack') { // 机械上膛声
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, t);
            osc.frequency.exponentialRampToValueAtTime(480, t + 0.08);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.08);
          } else if (type === 'hit') { // 冰球撞击
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(700, t);
            osc.frequency.exponentialRampToValueAtTime(260, t + 0.06);
            gain.gain.setValueAtTime(0.28, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.06);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.06);
          } else if (type === 'goal') { // 进球庆祝
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, t + i * 0.07);
              gain.gain.setValueAtTime(0.2, t + i * 0.07);
              gain.gain.linearRampToValueAtTime(0.01, t + i * 0.07 + 0.22);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.22);
            });
          
          
          } else if (type === 'contra_shoot') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.exponentialRampToValueAtTime(180, t + 0.06);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.06);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.06);
          } else if (type === 'contra_spread') {
            [480, 640, 780].forEach((f, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(f, t + idx * 0.01);
              osc.frequency.exponentialRampToValueAtTime(160, t + idx * 0.01 + 0.08);
              gain.gain.setValueAtTime(0.18, t + idx * 0.01);
              gain.gain.linearRampToValueAtTime(0.01, t + idx * 0.01 + 0.08);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(t + idx * 0.01); osc.stop(t + idx * 0.01 + 0.08);
            });
          } else if (type === 'contra_jump') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.linearRampToValueAtTime(460, t + 0.12);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.12);
          } else if (type === 'contra_explode') {
            const bufferSize = this.ctx.sampleRate * 0.28;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.18));
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, t); filter.frequency.linearRampToValueAtTime(80, t + 0.28);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.65, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(t);
          } else if (type === 'contra_30') {
            // 经典 Konami 秘籍 1-UP 升调和弦
            [330, 392, 659, 523, 587, 784].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(f, t + i * 0.07);
              gain.gain.setValueAtTime(0.25, t + i * 0.07);
              gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.18);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.18);
            });

          } else if (type === 'heartbeat') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(65, t);
            osc.frequency.exponentialRampToValueAtTime(35, t + 0.12);
            gain.gain.setValueAtTime(0.35, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.12);
          } else if (type === 'draw_signal') {
            [880, 1760].forEach((freq) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, t);
              gain.gain.setValueAtTime(0.3, t);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(t); osc.stop(t + 0.25);
            });
          } else if (type === 'slash') {
            const bufferSize = this.ctx.sampleRate * 0.18;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2400, t);
            filter.frequency.exponentialRampToValueAtTime(300, t + 0.18);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.7, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(t);
          } else if (type === 'false_start') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.setValueAtTime(110, t + 0.1);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.25);
          } else if (type === 'dice_shake') {
            for (let i = 0; i < 4; i++) {
              const dt = t + i * 0.04;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(300 + Math.random() * 200, dt);
              gain.gain.setValueAtTime(0.18, dt);
              gain.gain.exponentialRampToValueAtTime(0.01, dt + 0.035);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(dt); osc.stop(dt + 0.035);
            }
          } else if (type === 'cup_slam') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.1);
          } else if (type === 'bid') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, t);
            osc.frequency.exponentialRampToValueAtTime(659.25, t + 0.08);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.08);
          } else if (type === 'reveal') {
            [440, 659.25, 880, 1174.66].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, t + i * 0.06);
              gain.gain.setValueAtTime(0.2, t + i * 0.06);
              gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.06 + 0.25);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.25);
            });
          } else if (type === 'bonk') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(280, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.07);
            gain.gain.setValueAtTime(0.35, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.07);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.07);
          } else if (type === 'fall') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(350, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.4);
          } else if (type === 'tank_fire') {
            const bufferSize = this.ctx.sampleRate * 0.2;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, t); filter.frequency.linearRampToValueAtTime(100, t + 0.2);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.55, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(t);
          } else if (type === 'tank_explosion') {
            const bufferSize = this.ctx.sampleRate * 0.35;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, t); filter.frequency.linearRampToValueAtTime(60, t + 0.35);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.65, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(t);
          } else if (type === 'slice') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(900, t);
            osc.frequency.exponentialRampToValueAtTime(250, t + 0.04);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.04);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.04);
          } else if (type === 'perfect') {
            const scaleNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
            const noteIdx = Math.min((arguments[1] || 0), scaleNotes.length - 1);
            const freq = scaleNotes[noteIdx];
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.28, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.45);

          } else if (type === 'win') {
            [440, 554.37, 659.25, 880].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, t + i * 0.09);
              gain.gain.setValueAtTime(0.22, t + i * 0.09);
              gain.linearRampToValueAtTime(0.01, t + i * 0.09 + 0.3);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(t + i * 0.09); osc.stop(t + i * 0.09 + 0.3);
            });
          } else if (type === 'plane_hop') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.exponentialRampToValueAtTime(880, t + 0.06);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.06);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.06);
          } else if (type === 'plane_takeoff') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.exponentialRampToValueAtTime(950, t + 0.28);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.28);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.28);
          } else if (type === 'plane_fly') {
            const bufferSize = Math.floor(this.ctx.sampleRate * 0.3);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(800, t);
            filter.frequency.exponentialRampToValueAtTime(2200, t + 0.15);
            filter.frequency.exponentialRampToValueAtTime(600, t + 0.3);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.28, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(t);
          } else if (type === 'plane_crash') {
            const bufferSize = Math.floor(this.ctx.sampleRate * 0.4);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, t);
            filter.frequency.linearRampToValueAtTime(80, t + 0.4);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.55, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start(t);
          } else if (type === 'plane_win') {
            [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, t + i * 0.08);
              gain.gain.setValueAtTime(0.25, t + i * 0.08);
              gain.gain.linearRampToValueAtTime(0.01, t + i * 0.08 + 0.28);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.28);
            });
          }
        } catch(e) {}
      }
    };

    function recordRecentGame(gameKey) {
      try {
        let recents = JSON.parse(localStorage.getItem('arcade_recent_games') || '[]');
        recents = recents.filter(k => k !== gameKey);
        recents.unshift(gameKey);
        if (recents.length > 4) recents.length = 4;
        localStorage.setItem('arcade_recent_games', JSON.stringify(recents));
        renderRecentGames();
      } catch(e) {}
    }

    function checkIsMyTurn() {
      if (STATE.gameMode === 'LOCAL') return true;
      if (STATE.gameMode === 'AI') return STATE.turn === 1;
      if (STATE.gameMode === 'ONLINE') {
        if (!STATE.online.opponentJoined) return false;
        if (STATE.online.myRole === 'host' && STATE.turn === 1) return true;
        if (STATE.online.myRole === 'guest' && STATE.turn === 2) return true;
        return false;
      }
      return false;
    }

    function endTurn() {
      if (STATE.currentGame === 'QUORIDOR') {
        if (STATE.quoridor.playerCount === 4) {
          // 顺时针流转：1(南门) -> 3(西门) -> 2(北门) -> 4(东门) -> 1
          const order = { 1: 3, 3: 2, 2: 4, 4: 1 };
          STATE.turn = order[STATE.turn] || 1;
        } else {
          STATE.turn = STATE.turn === 1 ? 2 : 1;
        }
      } else {
        STATE.turn = STATE.turn === 1 ? 2 : 1;
      }
      updateScoreboard();

      if (!STATE.winner && STATE.gameMode === 'AI' && STATE.turn !== 1) {
        STATE.animating = true;
        const botNames = {
          2: '🟢 绿方电脑',
          3: '🔵 蓝方电脑',
          4: '🟡 黄方电脑'
        };
        const bName = botNames[STATE.turn] || '🤖 电脑 AI';
        document.getElementById('status-text').textContent = `${bName} 正在深思熟虑...`;
        setTimeout(() => {
          if (STATE.currentGame === 'QUORIDOR') runQuoridorAI();
          else if (STATE.currentGame === 'GRAVITY') runGravity2DAI();
          else if (STATE.currentGame === 'GRAVITY4') runGravity4AI();
          else if (STATE.currentGame === 'GRAVITY3D') runGravity3DAI();
          else if (STATE.currentGame === 'GRAVITY3D4') runGravity3D4AI();
          else if (STATE.currentGame === 'ROULETTE') runRouletteAI();
        }, 500);
      }
    }

    // ==========================================================================
    // 7. MQTT 在线联机通信中枢
    // ==========================================================================
    const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    let myClientId = 'client_' + Math.random().toString(36).substring(2, 9);

    function initMqtt(roomId, role) {
      if (STATE.online.mqttClient) {
        try { STATE.online.mqttClient.end(); } catch (e) {}
      }

      STATE.online.roomId = roomId;
      STATE.online.myRole = role;
      document.getElementById('display-room-id').textContent = roomId;
      document.getElementById('display-role-info').innerHTML = role === 'host' ? 
        '你是 <b style="color:var(--p1-color)">🔴 房主 (红方)</b>' : 
        '你是 <b style="color:var(--p2-color)">🟢 好友 (客方)</b>';

      showToast(`正在连接房间 ${roomId}...`);
      const client = mqtt.connect(MQTT_BROKER, { clientId: myClientId, keepalive: 30, clean: true });
      STATE.online.mqttClient = client;

      client.on('connect', () => {
        STATE.online.connected = true;
        const topic = `game_hall_v2/room/${roomId}`;
        client.subscribe(topic, () => {
          if (role === 'guest') {
            client.publish(topic, JSON.stringify({ type: 'JOIN', sender: myClientId, game: STATE.currentGame }));
            showToast('已进入房间，正在等待同步...');
          } else {
            showToast('房间已就绪！点击复制链接发给好友');
          }
        });
      });

      client.on('message', (topic, payload) => {
        try {
          const msg = JSON.parse(payload.toString());
          if (msg.sender === myClientId) return;

          if (msg.type === 'JOIN') {
            if (STATE.online.myRole === 'host') {
              STATE.online.opponentJoined = true;
              showToast('🎉 好友已进入房间！对战正式开始！');
              sendOnlineAction({ type: 'SYNC', game: STATE.currentGame, turn: STATE.turn });
              updateScoreboard();
            }
          } else if (msg.type === 'SYNC') {
            if (STATE.online.myRole === 'guest') {
              STATE.online.opponentJoined = true;
              if (msg.game && msg.game !== STATE.currentGame) {
                enterGame(msg.game, 'ONLINE');
              }
              showToast('🎮 同步成功，对战开始！');
              updateScoreboard();
            }
          } else if (msg.type === 'QUORIDOR_MOVE') {
            executeQuoridorMove(msg.r, msg.c);
          } else if (msg.type === 'QUORIDOR_WALL') {
            executeQuoridorWall(msg.wallType, msg.r, msg.c);
          } else if (msg.type === 'GRAVITY_DROP') {
            const tr = getGravityLandingRow(msg.col);
            if (tr !== -1) executeGravityDrop(msg.col, tr, STATE.turn, false);
          } else if (msg.type === 'GRAVITY3D_DROP') {
            const ty = get3DLandingHeight(msg.x, msg.z);
            if (ty !== -1) execute3DDrop(msg.x, msg.z, ty, STATE.turn, false);
          } else if (msg.type === 'ROULETTE_SHOOT') {
            executeRouletteShot(msg.target, false);
          } else if (msg.type === 'ROULETTE_ITEM') {
            // 对手使用了道具，弹出提示
            showToast(`对手使用了道具：${ROULETTE_ITEM_DEFS[msg.itemKey].name}`);
          } else if (msg.type === 'AEROPLANE_ROLL') {
            handleOnlineAeroplaneRoll(msg.player, msg.val);
          } else if (msg.type === 'AEROPLANE_MOVE') {
            executeAeroplaneMove(msg.player, msg.plane, msg.roll, false);
          } else if (msg.type === 'RESTART') {
            resetCurrentGame();
            showToast('🔄 对方重新开始了对局！');
          }
        } catch (e) {}
      });
    }

    function sendOnlineAction(data) {
      if (!STATE.online.mqttClient || !STATE.online.connected) return;
      data.sender = myClientId;
      data.game = STATE.currentGame;
      STATE.online.mqttClient.publish(`game_hall_v2/room/${STATE.online.roomId}`, JSON.stringify(data));
    }

    function createOnlineRoom() {
      AUDIO.play('click');
      const roomId = Math.floor(100000 + Math.random() * 900000).toString();
      const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?game=${STATE.currentGame.toLowerCase()}&room=${roomId}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);

      document.getElementById('btn-create-room').style.display = 'none';

      resetCurrentGame();
      initMqtt(roomId, 'host');
    }

    function copyInviteLink() {
      AUDIO.play('click');
      const url = `${window.location.protocol}//${window.location.host}${window.location.pathname}?game=${STATE.currentGame.toLowerCase()}&room=${STATE.online.roomId}`;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => showToast('✅ 邀请链接已复制！快发给微信好友吧！'));
      } else {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('✅ 邀请链接已复制！快发给微信好友吧！');
      }
    }

    function updateScoreboard() {
      if (STATE.currentGame === 'AEROPLANE') {
        updateAeroplaneHUD();
        return;
      }
      const is4P = STATE.quoridor.playerCount === 4;
      const genericScoreboard = document.getElementById('generic-scoreboard');

      document.getElementById('walls-count-p1').textContent = STATE.quoridor.p1.walls;
      document.getElementById('walls-count-p2').textContent = STATE.quoridor.p2.walls;
      if (is4P) {
        document.getElementById('walls-count-p3').textContent = STATE.quoridor.p3.walls;
        document.getElementById('walls-count-p4').textContent = STATE.quoridor.p4.walls;
      }

      function renderWallBars(elemId, count, maxWalls) {
        const el = document.getElementById(elemId);
        if (!el) return;
        el.innerHTML = '';
        for (let i = 0; i < maxWalls; i++) {
          const pip = document.createElement('div');
          pip.className = 'wall-pip' + (i < count ? '' : ' used');
          el.appendChild(pip);
        }
      }

      const maxWalls = is4P ? 5 : 10;
      renderWallBars('wall-bars-p1', STATE.quoridor.p1.walls, maxWalls);
      renderWallBars('wall-bars-p2', STATE.quoridor.p2.walls, maxWalls);
      if (is4P) {
        renderWallBars('wall-bars-p3', STATE.quoridor.p3.walls, maxWalls);
        renderWallBars('wall-bars-p4', STATE.quoridor.p4.walls, maxWalls);
      }

      const card1 = document.getElementById('card-p1');
      const card2 = document.getElementById('card-p2');
      const card3 = document.getElementById('card-p3');
      const card4 = document.getElementById('card-p4');

      card1.classList.toggle('active', STATE.turn === 1);
      card2.classList.toggle('active', STATE.turn === 2);
      if (card3) card3.classList.toggle('active', STATE.turn === 3);
      if (card4) card4.classList.toggle('active', STATE.turn === 4);

      if (STATE.currentGame === 'QUORIDOR' && is4P) {
        genericScoreboard.classList.add('scoreboard-4p');
        if (card3) card3.style.display = 'flex';
        if (card4) card4.style.display = 'flex';

        document.getElementById('walls-wrapper-p4').style.display = 'block';

        document.getElementById('wall-bars-p4').style.display = 'flex';

        document.getElementById('name-p3').textContent = STATE.gameMode === 'AI' ? '🔵 西门 (电脑)' : '🔵 西门 (玩家3)';
        document.getElementById('name-p2').textContent = STATE.gameMode === 'AI' ? '🟢 北门 (电脑)' : '🟢 北门 (玩家2)';
        document.getElementById('name-p4').textContent = STATE.gameMode === 'AI' ? '🟡 东门 (电脑)' : '🟡 东门 (玩家4)';
      } else {
        genericScoreboard.classList.remove('scoreboard-4p');
        if (card3) card3.style.display = 'none';
        if (card4) card4.style.display = 'none';

        const isYellow = ['GRAVITY', 'GRAVITY3D', 'GRAVITY4', 'GRAVITY3D4'].includes(STATE.currentGame);
        const nameP1 = document.getElementById('name-p1');
        const nameP2 = document.getElementById('name-p2');
        if (isYellow) {
          nameP1.textContent = '🔴 红方 (先手)';
          nameP2.textContent = STATE.gameMode === 'AI' ? '🟡 黄方 (电脑)' : (STATE.gameMode === 'ONLINE' ? '🟡 黄方 (客方)' : '🟡 黄方 (后手)');
        } else {
          nameP1.textContent = '🔴 红方 (先手)';
          nameP2.textContent = STATE.gameMode === 'AI' ? '🟢 绿方 (电脑)' : (STATE.gameMode === 'ONLINE' ? '🟢 绿方 (客方)' : '🟢 绿方 (后手)');
        }
      }

      const status = document.getElementById('status-text');

        status.style.display = ['QUORIDOR', 'GRAVITY', 'GRAVITY3D', 'GRAVITY4', 'GRAVITY3D4'].includes(STATE.currentGame) ? 'block' : 'none';
      }

    // ==========================================================================

    const AERO_CELL_SIZE = 32;
    const AERO_BOARD_SIZE = 15;
    const AERO_LAUNCH_TILES = [0, 13, 26, 39]; // 红、黄、蓝、绿
    const AERO_COLOR_NAMES = ['红方', '黄方', '蓝方', '绿方'];
    const AERO_COLOR_HEX = ['#ef4444', '#f59e0b', '#38bdf8', '#22c55e'];
    const AERO_COLOR_GLOWS = ['rgba(239,68,68,0.6)', 'rgba(245,158,11,0.6)', 'rgba(56,189,248,0.6)', 'rgba(34,197,94,0.6)'];

    // 52个外圈跑道坐标
    const AERO_TRACK_TILES = (function() {
      let q0 = [];
      for (let c = 5; c >= 0; c--) q0.push({ r: 8, c });
      q0.push({ r: 7, c: 0 });
      for (let c = 0; c <= 5; c++) q0.push({ r: 6, c });

      let q1 = [];
      for (let r = 5; r >= 0; r--) q1.push({ r, c: 6 });
      q1.push({ r: 0, c: 7 });
      for (let r = 0; r <= 5; r++) q1.push({ r, c: 8 });

      let q2 = [];
      for (let c = 9; c <= 14; c++) q2.push({ r: 6, c });
      q2.push({ r: 7, c: 14 });
      for (let c = 14; c >= 9; c--) q2.push({ r: 8, c });

      let q3 = [];
      for (let r = 9; r <= 14; r++) q3.push({ r, c: 8 });
      q3.push({ r: 14, c: 7 });
      for (let r = 14; r >= 9; r--) q3.push({ r, c: 6 });

      return [...q0, ...q1, ...q2, ...q3];
    })();

    // 4条终点直道 (5格跑道 + 1格中央胜利大本营)
    const AERO_HOME_PATHS = [
      [ { r: 13, c: 7 }, { r: 12, c: 7 }, { r: 11, c: 7 }, { r: 10, c: 7 }, { r: 9, c: 7 }, { r: 7, c: 7 } ],
      [ { r: 7, c: 1 }, { r: 7, c: 2 }, { r: 7, c: 3 }, { r: 7, c: 4 }, { r: 7, c: 5 }, { r: 7, c: 7 } ],
      [ { r: 1, c: 7 }, { r: 2, c: 7 }, { r: 3, c: 7 }, { r: 4, c: 7 }, { r: 5, c: 7 }, { r: 7, c: 7 } ],
      [ { r: 7, c: 13 }, { r: 7, c: 12 }, { r: 7, c: 11 }, { r: 7, c: 10 }, { r: 7, c: 9 }, { r: 7, c: 7 } ]

    // 停机坪4个机位坐标
    const AERO_HANGAR_BAYS = [
      [ { x: 68, y: 356 }, { x: 124, y: 356 }, { x: 68, y: 412 }, { x: 124, y: 412 } ],

    let aeroCanvasListenerBound = false;

    function getAeroGridPixel(r, c) {
      return {
        x: c * AERO_CELL_SIZE + AERO_CELL_SIZE / 2,
