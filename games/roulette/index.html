<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎲 恶魔轮盘赌 (Buckshot Roulette) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game-layout.css">
  <style>
恶魔轮盘赌专属舞台 (ROULETTE STAGE)
       ========================================================================== */
    #roulette-stage {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at center, #1e1114 0%, #0a0608 100%);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #5a1e28;
      position: relative;
      overflow: hidden;
    }

    .roulette-gun-bench {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .shotgun-svg {
      width: 220px;
      height: 90px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8));
      transition: transform 0.3s ease;
    }
    .shotgun-svg.aim-opponent { transform: rotate(0deg) scale(1); }
    .shotgun-svg.aim-self { transform: rotate(180deg) scale(1); }

    .roulette-flash-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ff2222;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
      z-index: 50;
    }

    .roulette-info-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #7f1d1d;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: #fca5a5;
      margin-top: 6px;
      font-weight: 600;
    }

    .roulette-status-hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 4px 6px;
    }

    .hp-hearts-box {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .hp-heart {
      font-size: 1.1rem;
      filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.6));
    }
    .hp-heart.empty {
      filter: grayscale(1);
      opacity: 0.3;
    }

    /* 道具栏 */
    .roulette-items-dock {
      width: 100%;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 6px;
      min-height: 52px;
      align-items: center;
      overflow-x: auto;
    }

    .roulette-item-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .roulette-item-btn:hover {
      background: #334155;
      border-color: #f59e0b;
    }

    .roulette-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 6px;
    }

    .btn-roulette-shoot {
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.2s;
    }
    .btn-shoot-opp {
      background: linear-gradient(135deg, #ef4444, #991b1b);
      color: #fff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }
    .btn-shoot-self {
      background: linear-gradient(135deg, #f59e0b, #b45309);
      color: #fff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }
    .btn-roulette-shoot span.sub {
      font-size: 0.66rem;
      font-weight: 400;
      opacity: 0.85;
    }

    /* ==========================================================================
       
  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部通用导航栏 -->
    <header class="app-header">
      <div class="brand-title" onclick="window.location.href='../../'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">返回大厅</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" id="btn-sound-toggle" onclick="toggleSound()">🔊</button>
        <button class="btn-icon" id="btn-rules-header" onclick="showCurrentRules()">规则</button>
      </div>
    </header>

    <!-- 游戏导航栏 -->
    <div class="game-nav-bar">
      <button class="btn-back-lobby" onclick="window.location.href='../../'">
        <span>◀ 返回大厅</span>
      </button>
      <div class="current-game-badge" id="current-game-title">🎲 恶魔轮盘赌 (Buckshot Roulette)</div>
      
      <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重开</button>
    </div>

    
    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对战</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 同屏双人</div>
      <div class="mode-tab" id="tab-online" onclick="switchGameMode('ONLINE')">🌐 好友联机</div>
    </div>
    <!-- 联机房间控制面板 -->
      <div class="online-panel" id="online-panel">
        <div class="room-header">
          <div>房间号: <span class="room-id-badge" id="display-room-id">未创建</span></div>
          <div id="display-role-info" style="font-size:0.8rem; color:#cbd5e1;">尚未进入房间</div>
        </div>
        <div class="online-actions">
          <button class="btn-action-primary" id="btn-create-room" onclick="createOnlineRoom()">
            <span>➕ 创建新房间</span>
          </button>
          <button class="btn-action-primary" id="btn-share-link" style="display:none;" onclick="copyInviteLink()">
            <span>📋 复制邀请链接发好友</span>
          </button>
          <button class="btn-action-secondary" id="btn-join-room" onclick="promptJoinRoom()">
            <span>加入房间</span>
          </button>
        </div>
      </div>

      
    

    <!-- 舞台容器 -->
    <div class="stage-wrapper">
<div id="roulette-stage">
          <div class="roulette-flash-overlay" id="roulette-flash"></div>
          <!-- 对手信息栏 -->
          <div class="roulette-status-hud">
            <div>
              <b id="roulette-opp-name" style="color:#f87171;">🤖 恶魔荷官</b>
              <div class="hp-hearts-box" id="roulette-opp-hp"></div>
            </div>
            <div id="roulette-cuffed-opp" style="display:none; color:#f59e0b; font-size:0.75rem; font-weight:700;">🔒 被拷住</div>
          </div>

          <!-- 枪台中央区 -->
          <div class="roulette-gun-bench">
            <svg class="shotgun-svg aim-opponent" id="shotgun-svg" viewBox="0 0 240 80">
              <defs>
                <linearGradient id="gunMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#64748b"/>
                  <stop offset="50%" stop-color="#334155"/>
                  <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>
                <linearGradient id="woodStock" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#b45309"/>
                  <stop offset="100%" stop-color="#78350f"/>
                </linearGradient>
              </defs>
              <!-- 枪托木柄 -->
              <path d="M 10 50 Q 30 55 60 45 L 75 35 L 75 52 L 20 62 Z" fill="url(#woodStock)" stroke="#451a03" stroke-width="2"/>
              <!-- 扳机与机匣 -->
              <rect x="75" y="32" width="45" height="20" rx="3" fill="url(#gunMetal)" stroke="#1e293b" stroke-width="2"/>
              <path d="M 90 52 Q 95 62 105 52" fill="none" stroke="#cbd5e1" stroke-width="3"/>
              <!-- 双管猎枪枪管 -->
              <rect x="120" y="30" width="105" height="11" rx="2" fill="url(#gunMetal)" stroke="#0f172a" stroke-width="2"/>
              <rect x="120" y="41" width="105" height="11" rx="2" fill="url(#gunMetal)" stroke="#0f172a" stroke-width="2"/>
              <!-- 枪口准星 -->
              <circle cx="222" cy="28" r="2.5" fill="#f59e0b"/>
            </svg>
            <div class="roulette-info-badge" id="roulette-round-info">装弹中...</div>
            <div id="roulette-saw-badge" style="display:none; color:#ef4444; font-size:0.75rem; font-weight:700; margin-top:4px;">🪚 双倍伤害已激活！</div>
          </div>

          <!-- 玩家道具与血量 -->
          <div class="roulette-status-hud">
            <div>
              <b id="roulette-player-name" style="color:#60a5fa;">👤 玩家</b>
              <div class="hp-hearts-box" id="roulette-player-hp"></div>
            </div>
            <div id="roulette-cuffed-player" style="display:none; color:#f59e0b; font-size:0.75rem; font-weight:700;">🔒 被拷住</div>
          </div>

          <!-- 道具架 -->
          <div class="roulette-items-dock" id="roulette-items-container"></div>

          <!-- 行动按键 -->
          <div class="roulette-actions">
            <button class="btn-roulette-shoot btn-shoot-opp" onclick="rouletteShoot('OPPONENT')">
              <span>💥 射击对方</span>
              <span class="sub">实弹扣对方血，空包弹换回合</span>
            </button>
            <button class="btn-roulette-shoot btn-shoot-self" onclick="rouletteShoot('SELF')">
              <span>🎯 射击自己</span>
              <span class="sub">若为空包弹可【再动一回合】</span>
            </button>
          </div>
        </div>

        <!-- 4. 极光桌上冰球舞台 -->
        
    </div>
  </div>


  <!-- Toast 提示 -->
  <div class="toast" id="toast-msg"></div>

  <!-- 规则与结算弹窗 -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">游戏规则</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-btn" id="modal-confirm-btn">我知道了</button>
    </div>
  </div>


  <script src="../../shared/js/audio.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../mqtt.min.js"></script>
  <script src="../../shared/js/network.js"></script>
  <script src="game.js"></script>
</body>
</html>
