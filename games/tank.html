<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎯 3D 坦克大战 (3D Tank War) · Party Arcade</title>
  <script src="../three.min.js"></script>
  <script src="../OrbitControls.js"></script>
  <script src="../mqtt.min.js"></script>
  <style>

    :root {
      --bg-gradient: radial-gradient(circle at center, #151d2a 0%, #080c14 100%);
      --panel-bg: rgba(22, 32, 48, 0.85);
      --card-bg: rgba(30, 41, 59, 0.7);
      --p1-color: #ff4757;
      --p1-glow: rgba(255, 71, 87, 0.5);
      --p2-color: #2ed573;
      --p2-glow: rgba(46, 213, 115, 0.5);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --neon-cyan: #38bdf8;
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 10px 12px 24px;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: max-width 0.3s ease;
    }

    .container.in-game {
      max-width: 680px;
    }

    /* 顶部通用导航栏 */
    .app-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .brand-title .badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      font-weight: 600;
      -webkit-text-fill-color: #93c5fd;
    }

    .header-tools {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-icon {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: #334155;
      border-color: #64748b;
    }

    /* ==========================================================================
       游戏房间视图 (GAME VIEW)
       ========================================================================== */
    #game-view {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .game-nav-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-back-lobby {
      background: #1e293b;
      border: 1px solid #475569;
      color: #38bdf8;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-back-lobby:hover {
      background: #334155;
      border-color: #38bdf8;
    }

    .current-game-badge {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f2f6;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 模式切换选项卡 */
    .mode-nav {
      width: 100%;
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 3px;
      border: 1px solid #334155;
    }

    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.25s;
    }

    .mode-tab.active {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* 联机房间面板 */
    .online-panel {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .online-panel.hidden { display: none; }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }

    .room-id-badge {
      background: #0f172a;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      color: #38bdf8;
      border: 1px solid #1e293b;
    }

    .online-actions {
      display: flex;
      gap: 6px;
    }

    .btn-action-primary {
      flex: 1;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-action-secondary {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* 计分与角色状态栏 */
    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .scoreboard.scoreboard-4p {
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .player-card.p3.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .player-card.p4.active {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .p3 .player-avatar { background: radial-gradient(circle at 35% 35%, #7dd3fc, var(--neon-cyan) 70%, #0369a1); }
    .p4 .player-avatar { background: radial-gradient(circle at 35% 35%, #fef08a, var(--gold) 70%, #a16207); }

    /* 步步为营 2P/4P 切换栏 */
    .quoridor-mode-bar {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 2px;
    }
    .btn-q-mode {
      flex: 1;
      padding: 6px 0;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-q-mode.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .player-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(8px);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .player-card.active {
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    }
    .player-card.p1.active {
      border-color: var(--p1-color);
      box-shadow: 0 0 12px var(--p1-glow);
    }
    .player-card.p2.active {
      border-color: var(--p2-color);
      box-shadow: 0 0 12px var(--p2-glow);
    }
    .player-card.p2-yellow-active.active {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .player-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.4);
    }
    .p1 .player-avatar { background: radial-gradient(circle at 35% 35%, #ff7f8e, var(--p1-color) 70%, #b32d3a); }
    .p2 .player-avatar { background: radial-gradient(circle at 35% 35%, #7bed9f, var(--p2-color) 70%, #1e824c); }
    .p2.yellow-theme .player-avatar { background: radial-gradient(circle at 35% 35%, #fef08a, #eab308 70%, #a16207); }

    .player-info {
      flex: 1;
      min-width: 0;
    }
    .player-name {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-subinfo {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .wall-bars { display: flex; gap: 2px; margin-top: 2px; }
    .wall-pip { width: 5px; height: 7px; background: #eccc68; border-radius: 1px; }
    .wall-pip.used { background: #475569; opacity: 0.3; }

    /* 舞台主容器 (480x480 max) */
    .stage-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 480px;
      max-height: 480px;
      background: #131d2c;
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.05);
      border: 1px solid #334155;
      position: relative;
      overflow: hidden;
    }

    /* 魂斗罗动作模式自适应样式 */
    .stage-wrapper.contra-mode {
      aspect-ratio: auto;
      height: auto;
      max-height: none;
      max-width: 520px;
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
      overflow: visible;
    }

    #board-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
    }

    /* 3D 舞台 */
    #board-3d-wrapper {
      width: 100%;
      height: 100%;
      display: none;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }
    #board-3d-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #board-3d-canvas:active { cursor: grabbing; }

    .btn-reset-cam {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .btn-reset-cam:hover { background: #334155; color: #38bdf8; border-color: #38bdf8; }

    .tip-3d-overlay {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 12px;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.1);
    }

      border: 1px solid #334155;
    }
    .gravity-col-btn {
      flex: 1;
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 0;
      border-radius: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .gravity-col-btn:hover { background: #3b82f6; color: #fff; }

    /* Toast 浮窗 */
    .toast {
      position: fixed;
      top: 20px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #f0f9ff;
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 200;
      display: none;
      align-items: center;
      gap: 6px;
      animation: fadeInDown 0.3s ease;
      max-width: 90%;
      text-align: center;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 通用弹窗 */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      color: #e2e8f0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
    .modal-body { font-size: 0.85rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 18px; text-align: left; }
    .modal-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }
  
    /* --- 新增分类标签与通用舞台美化 --- */
    .tag-reflex { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

    /* ==========================================================================
       4. 极限抛物线弹道 (TANK) 样式
       ========================================================================== */
    #tank-stage {
      width: 100%;
      min-height: 440px;
      position: relative;
      background: linear-gradient(180deg, #0b1329 0%, #172554 60%, #1e293b 100%);
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    #tank-canvas {
      width: 100%;
      height: 290px;
      display: block;
    }

    .tank-hud-top {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .tank-hp-bar {
      width: 90px;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .tank-hp-fill {
      height: 100%;
      transition: width 0.3s ease;
    }
    .tank-hp-p1 { background: #ef4444; width: 100%; }
    .tank-hp-p2 { background: #22c55e; width: 100%; }

    .tank-wind-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .tank-controls-dock {
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #334155;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tank-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .tank-slider-row input[type=range] {
      flex: 1;
      accent-color: #3b82f6;
    }

    .btn-tank-fire {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 1px solid #fbbf24;
      color: #000;
      font-weight: 900;
      font-size: 1rem;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
    }

  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="brand-title" onclick="location.href='../index.html'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">Party Hub</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" onclick="location.href='../index.html'">🏠 返回大厅</button>
      </div>
    </header>

    <!-- 游戏视图 -->
    <div id="game-view" style="display: flex;">
      <div class="game-nav-bar">
        <button class="btn-back-lobby" onclick="location.href='../index.html'">← 返回大厅</button>
        <div id="current-game-title" class="current-game-badge">🎯 3D 坦克大战 (3D Tank War)</div>
        <div></div>
      </div>

      <!-- 模式切换 -->
      <div class="mode-nav">
        <div id="tab-ai" class="mode-tab active" onclick="switchGameMode('AI')">🤖 人工智能 (AI)</div>
        <div id="tab-local" class="mode-tab" onclick="switchGameMode('LOCAL')">👥 同屏双人 (Local)</div>
        <div id="tab-online" class="mode-tab" onclick="switchGameMode('ONLINE')">🌐 局域网/在线</div>
      </div>

      <!-- 联机面板 -->
      <div id="online-panel" class="online-panel hidden">
        <div class="room-header">
          <span>房间号: <span id="room-id-display" class="room-id-badge">------</span></span>
          <span id="mqtt-status" style="font-size:0.75rem; color:#94a3b8;">未连接</span>
        </div>
        <div class="online-actions">
          <button class="btn-action-primary" onclick="createOnlineRoom()">➕ 创建新房间</button>
          <button class="btn-action-secondary" onclick="joinOnlineRoomPrompt()">🔑 加入已有房间</button>
        </div>
      </div>

      <!-- 计分栏 -->
      <div id="scoreboard" class="scoreboard">
        <div id="p1-card" class="player-card p1 active">
          <div class="player-avatar"></div>
          <div class="player-info">
            <div class="player-name" id="p1-name">玩家 1 (P1)</div>
            <div class="player-subinfo" id="p1-sub">得分: <span id="p1-score">0</span></div>
          </div>
        </div>
        <div id="p2-card" class="player-card p2">
          <div class="player-avatar"></div>
          <div class="player-info">
            <div class="player-name" id="p2-name">玩家 2 (AI)</div>
            <div class="player-subinfo" id="p2-sub">得分: <span id="p2-score">0</span></div>
          </div>
        </div>
      </div>

      <!-- 专属舞台 -->

          <div class="stage-wrapper" style="max-width:520px;">
            <div id="tank-stage" style="display:block;">
              <canvas id="tank-canvas" width="480" height="400"></canvas>
            </div>
          </div>
          <div id="game-status" class="game-status">准备就绪</div>
    
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal">
    <div class="modal-content">
      <div id="modal-title" class="modal-title">游戏提示</div>
      <div id="modal-body" class="modal-body"></div>
      <button class="modal-btn" onclick="closeModal()">确定</button>
    </div>
  </div>

  <script>

    // Canvas roundRect 跨端安全兼容垫片
    (function() {
      function polyfill(proto) {
        if (!proto || proto.roundRect) return;
        proto.roundRect = function(x, y, w, h, radii) {
          let r = Array.isArray(radii) ? radii[0] : (radii || 0);
          r = Math.min(r, w / 2, h / 2);
          this.beginPath();
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          this.closePath();
          return this;
        };
      }
      if (typeof CanvasRenderingContext2D !== 'undefined') polyfill(CanvasRenderingContext2D.prototype);
      if (typeof HTMLCanvasElement !== 'undefined') {
        const origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, ...args) {
          const ctx = origGetContext.apply(this, [type, ...args]);
          if (ctx && !ctx.roundRect) polyfill(ctx);
          return ctx;
        };
      }
    })();

    // ==========================================================================
    // 0. 原生 Web Audio 纯合成音效系统 (0 体积无外链依赖)
    // ==========================================================================
    const AUDIO = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      },
      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      },
      play(type) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

          if (type === 'click') {

            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(150, t + 0.05);
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.05);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.05);

            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();

            osc.frequency.setValueAtTime(280, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.07);
            gain.gain.setValueAtTime(0.35, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.07);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 0.07);
          } else if (type === 'fall') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(350, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
            gain.gain.setValueAtTime(0.2, t);

    function recordRecentGame(gameKey) {
      try {
        let recents = JSON.parse(localStorage.getItem('arcade_recent_games') || '[]');
        recents = recents.filter(k => k !== gameKey);
        recents.unshift(gameKey);
        if (recents.length > 4) recents.length = 4;
        localStorage.setItem('arcade_recent_games', JSON.stringify(recents));
        renderRecentGames();
      } catch(e) {}
    }

    function renderRecentGames() {
      try {
        const recents = JSON.parse(localStorage.getItem('arcade_recent_games') || '[]');
        const bar = document.getElementById('recent-games-bar');
        const list = document.getElementById('recent-pills-list');
        if (!bar || !list) return;
        if (!recents || recents.length === 0) {
          bar.style.display = 'none';
          return;
        }
        bar.style.display = 'flex';
        list.innerHTML = '';
        const names = {
          'CONTRA': '💥 魂斗罗', 'QUORIDOR': '🧱 步步为营', 'AEROPLANE': '✈️ 飞行棋', 'ROULETTE': '🔫 轮盘赌',
          'HOCKEY': '🏒 冰球', 'GRAVITY': '⬇️ 重力五子棋', 'GRAVITY4': '🟡 重力四子棋',
          'GRAVITY3D': '🧊 3D五子棋', 'GRAVITY3D4': '💜 3D四子棋',
          'IAIDO': '⚡ 拔刀斩', 'LIARSDICE': '🎲 大话骰', 'SUMO': '🚗 飞车相扑',
          'TANK': '🎯 抛物线', 'STACK': '🥞 叠叠高', 'TANKTROUBLE': '🛡️ 坦克震荡'
        };
        recents.forEach(k => {
          if (names[k]) {
            const pill = document.createElement('div');
            pill.className = 'recent-pill';
            pill.textContent = names[k];
            pill.onclick = (e) => { e.stopPropagation(); enterGame(k); };
            list.appendChild(pill);
          }
        });
      } catch(e) {}
    }

    function returnToLobby() {
      const c = document.querySelector('.container'); if (c) c.classList.remove('in-game');
      const modeTabs = document.querySelector('.mode-nav');
      if (modeTabs) modeTabs.style.display = 'flex';
      AUDIO.play('click');
      STATE.currentView = 'LOBBY';
      document.getElementById('lobby-view').style.display = 'flex';
      document.getElementById('game-view').style.display = 'none';
      const stageWrapper = document.querySelector('.stage-wrapper');
      if (stageWrapper) {
        stageWrapper.classList.remove('contra-mode');
        stageWrapper.classList.remove('tanktrouble-mode');
      }
      renderRecentGames();

      // 停止所有游戏的动画循环与定时器
      if (STATE.hockey.animId) { cancelAnimationFrame(STATE.hockey.animId); STATE.hockey.animId = null; }
      if (STATE.sumo.animId) { cancelAnimationFrame(STATE.sumo.animId); STATE.sumo.animId = null; }
      if (STATE.tank.animId) { cancelAnimationFrame(STATE.tank.animId); STATE.tank.animId = null; }
      if (STATE.stack.animId) { cancelAnimationFrame(STATE.stack.animId); STATE.stack.animId = null; }
      if (STATE.contra.animId) { cancelAnimationFrame(STATE.contra.animId); STATE.contra.animId = null; }
      if (STATE.iaido.timer) { clearTimeout(STATE.iaido.timer); STATE.iaido.timer = null; }
      if (STATE.tanktrouble.animId) { cancelAnimationFrame(STATE.tanktrouble.animId); STATE.tanktrouble.animId = null; }
      if (STATE.tanktrouble.nextRoundTimer) { clearTimeout(STATE.tanktrouble.nextRoundTimer); STATE.tanktrouble.nextRoundTimer = null; }
      if (STATE.tanktrouble.crateTimer) { clearInterval(STATE.tanktrouble.crateTimer); STATE.tanktrouble.crateTimer = null; }
      if (STATE.aeroplane && STATE.aeroplane.animId) { cancelAnimationFrame(STATE.aeroplane.animId); STATE.aeroplane.animId = null; }
      if (STATE.aeroplane && STATE.aeroplane.aiTimer) { clearTimeout(STATE.aeroplane.aiTimer); STATE.aeroplane.aiTimer = null; }

      // 更新浏览器 URL
      const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);
    }

      const c = document.querySelector('.container'); if (c) c.classList.add('in-game');
      AUDIO.play('click');
      recordRecentGame(gameKey);
      STATE.currentView = 'GAME';
      STATE.currentGame = gameKey;
      STATE.gameMode = mode;

      document.getElementById('lobby-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'flex';

      const gameTitles = {
        'QUORIDOR': '🧱 步步为营',

        'GRAVITY': '⬇️ 重力五子棋',
        'GRAVITY4': '🟡 重力四子棋 (Connect Four)',
        'GRAVITY3D': '🧊 3D 立体五子棋',
        'GRAVITY3D4': '💜 3D 立体四子棋',
        'ROULETTE': '🔫 恶魔轮盘赌',
        'HOCKEY': '🏒 极光空气冰球',
        'IAIDO': '⚡ 拔刀居合斩',
        'LIARSDICE': '🎲 皇家大话骰',
        'SUMO': '🚗 物理飞车相扑',
        'TANK': '🎯 极限抛物线',
        'STACK': '🥞 极光叠叠高',
        'CONTRA': '💥 魂斗罗 (Contra)',
        'TANKTROUBLE': '🛡️ 坦克震荡 (Tank Trouble)'
      };
      document.getElementById('current-game-title').textContent = gameTitles[gameKey] || '双人对战';

      // 针对不支持联机模式的游戏隐藏联机Tab
      const tabOnline = document.getElementById('tab-online');
      if (['HOCKEY', 'SUMO', 'STACK', 'CONTRA', 'TANKTROUBLE'].includes(gameKey)) {
        tabOnline.style.display = 'none';
        if (STATE.gameMode === 'ONLINE') STATE.gameMode = 'AI';
      } else {
        tabOnline.style.display = 'block';
      }

      switchGameMode(STATE.gameMode, false);
      setupStageForGame(gameKey);
      resetCurrentGame();
      updateScoreboard();

      // 更新浏览器 URL
      const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?game=${gameKey.toLowerCase()}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);

    function filterLobby(category) {
      AUDIO.play('click');
      const pills = document.querySelectorAll('.category-pill');
      pills.forEach(p => p.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');

      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        if (category === 'ALL') {
          card.style.display = 'flex';
        } else if (category === '4PLAYER') {
          card.style.display = card.dataset.players === '4' ? 'flex' : 'none';
        } else {
          card.style.display = card.dataset.cat === category ? 'flex' : 'none';
        }
      });
    }

    function setupStageForGame(gameKey) {
      const modeTabs = document.querySelector('.mode-nav');
      if (modeTabs) modeTabs.style.display = (gameKey === 'CONTRA' || gameKey === 'STACK') ? 'none' : 'flex';
      const stageWrapper = document.querySelector('.stage-wrapper');
      if (stageWrapper) {
        stageWrapper.classList.toggle('contra-mode', gameKey === 'CONTRA');
        stageWrapper.classList.toggle('tanktrouble-mode', gameKey === 'TANKTROUBLE');
      }
      const canvas2D = document.getElementById('board-canvas');
      const wrapper3D = document.getElementById('board-3d-wrapper');

      const hockeyStage = document.getElementById('hockey-stage');
      const genericScoreboard = document.getElementById('generic-scoreboard');

      const toolQuoridor = document.getElementById('toolbar-quoridor');
      const toolGravity = document.getElementById('toolbar-gravity');
      const toolGravity4 = document.getElementById('toolbar-gravity4');

      const iaidoStage = document.getElementById('iaido-stage');
      const liarsStage = document.getElementById('liarsdice-stage');
      const sumoStage = document.getElementById('sumo-stage');
      const tankStage = document.getElementById('tank-stage');
      const stackStage = document.getElementById('stack-stage');
      const contraStage = document.getElementById('contra-stage');
      const tanktroubleStage = document.getElementById('tanktrouble-stage');
      const aeroplaneStage = document.getElementById('aeroplane-stage');
      const aeroplaneHud = document.getElementById('aeroplane-hud');
      const aeroplaneControls = document.getElementById('aeroplane-controls');

      // 隐藏所有舞台
      canvas2D.style.display = 'none';
      wrapper3D.style.display = 'none';
      rouletteStage.style.display = 'none';
      hockeyStage.style.display = 'none';
      iaidoStage.style.display = 'none';
      liarsStage.style.display = 'none';
      sumoStage.style.display = 'none';
      tankStage.style.display = 'none';
      stackStage.style.display = 'none';
      contraStage.style.display = 'none';
      if (tanktroubleStage) tanktroubleStage.style.display = 'none';
      if (aeroplaneStage) aeroplaneStage.style.display = 'none';
      if (aeroplaneHud) aeroplaneHud.style.display = 'none';
      if (aeroplaneControls) aeroplaneControls.style.display = 'none';
      genericScoreboard.style.display = 'grid';

      toolQuoridor.style.display = 'none';
      toolGravity.style.display = 'none';
      if (toolGravity4) toolGravity4.style.display = 'none';

      document.getElementById('walls-wrapper-p1').style.display = 'none';
      document.getElementById('walls-wrapper-p2').style.display = 'none';
      document.getElementById('wall-bars-p1').style.display = 'none';
      document.getElementById('wall-bars-p2').style.display = 'none';

      const card2 = document.getElementById('card-p2');
      card2.classList.remove('yellow-theme', 'p2-yellow-active');

      const qToggle = document.getElementById('quoridor-player-toggle');

        canvas2D.style.display = 'block';
        toolQuoridor.style.display = 'grid';
        document.getElementById('walls-wrapper-p1').style.display = 'block';
        document.getElementById('walls-wrapper-p2').style.display = 'block';
        document.getElementById('wall-bars-p1').style.display = 'flex';
        document.getElementById('wall-bars-p2').style.display = 'flex';
        resizeCanvas2D();
      } else if (gameKey === 'GRAVITY') {
        canvas2D.style.display = 'block';
        toolGravity.style.display = 'flex';
        card2.classList.add('yellow-theme', 'p2-yellow-active');
        resizeCanvas2D();
      } else if (gameKey === 'GRAVITY4') {
        canvas2D.style.display = 'block';
        if (toolGravity4) toolGravity4.style.display = 'flex';
        card2.classList.add('yellow-theme', 'p2-yellow-active');
        resizeCanvas2D();
      } else if (gameKey === 'GRAVITY3D') {
        wrapper3D.style.display = 'block';
        card2.classList.add('yellow-theme', 'p2-yellow-active');
        init3DSceneIfNeeded();
        if (typeof window.build3DBoard === 'function') window.build3DBoard(5);
        resize3D();
        update3DScene();
      } else if (gameKey === 'GRAVITY3D4') {
        wrapper3D.style.display = 'block';
        card2.classList.add('yellow-theme', 'p2-yellow-active');
        init3DSceneIfNeeded();
        if (typeof window.build3DBoard === 'function') window.build3DBoard(4);
        resize3D();
        update3DScene();
      } else if (gameKey === 'ROULETTE') {
        rouletteStage.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initRouletteGame();
      } else if (gameKey === 'HOCKEY') {
        hockeyStage.style.display = 'block';
        genericScoreboard.style.display = 'none';
        initHockeyGame();
      } else if (gameKey === 'IAIDO') {
        iaidoStage.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initIaidoGame();
      } else if (gameKey === 'LIARSDICE') {
        liarsStage.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initLiarsDiceGame();
      } else if (gameKey === 'SUMO') {
        sumoStage.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initSumoGame();
        requestAnimationFrame(() => {
          resizeSumoCanvas();
          renderSumo();
        });
      } else if (gameKey === 'TANK') {
        tankStage.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initTankGame();
      } else if (gameKey === 'STACK') {
        stackStage.style.display = 'block';
        genericScoreboard.style.display = 'none';
        initStackGame();
      } else if (gameKey === 'CONTRA') {
        contraStage.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initContraGame();
        requestAnimationFrame(() => {
          resizeContraCanvas();
          renderContra();
        });
      } else if (gameKey === 'TANKTROUBLE') {
        if (tanktroubleStage) tanktroubleStage.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initTankTroubleGame();
        requestAnimationFrame(() => {
          resizeTankTroubleCanvas();
          renderTankTrouble();
        });
      } else if (gameKey === 'AEROPLANE') {
        if (aeroplaneStage) aeroplaneStage.style.display = 'block';
        if (aeroplaneHud) aeroplaneHud.style.display = 'grid';
        if (aeroplaneControls) aeroplaneControls.style.display = 'flex';
        genericScoreboard.style.display = 'none';
        initAeroplaneGame();
        requestAnimationFrame(() => {
          resizeAeroplaneCanvas();
          renderAeroplane();
        });
      }
    }

    function switchGameMode(mode, doReset = true) {
      AUDIO.play('click');
      STATE.gameMode = mode;
      document.getElementById('tab-online').classList.toggle('active', mode === 'ONLINE');
      document.getElementById('tab-ai').classList.toggle('active', mode === 'AI');
      document.getElementById('tab-local').classList.toggle('active', mode === 'LOCAL');
      document.getElementById('online-panel').classList.toggle('hidden', mode !== 'ONLINE');

      if (doReset) {
        resetCurrentGame();
        updateScoreboard();
      }
    }

    function resetCurrentGame() {
      STATE.winner = null;
      STATE.turn = 1;
      STATE.animating = false;

      if (STATE.currentGame === 'QUORIDOR') {
        const is4P = STATE.quoridor.playerCount === 4;
        const initialWalls = is4P ? 5 : 10;
        STATE.quoridor.p1 = { r: 8, c: 4, walls: initialWalls };
        STATE.quoridor.p2 = { r: 0, c: 4, walls: initialWalls };
        STATE.quoridor.p3 = { r: 4, c: 0, walls: initialWalls };
        STATE.quoridor.p4 = { r: 4, c: 8, walls: initialWalls };
        STATE.quoridor.wallsH.clear();
        STATE.quoridor.wallsV.clear();
        STATE.quoridor.hoverPos = null;
        STATE.quoridor.lastMove = null;
        setQuoridorTool('MOVE');
        render2D();
      } else if (STATE.currentGame === 'GRAVITY') {
        STATE.gravity.board = Array.from({ length: 9 }, () => new Array(9).fill(0));
        STATE.gravity.hoverCol = null;

    function checkIsMyTurn() {
      if (STATE.gameMode === 'LOCAL') return true;
      if (STATE.gameMode === 'AI') return STATE.turn === 1;
      if (STATE.gameMode === 'ONLINE') {
        if (!STATE.online.opponentJoined) return false;
        if (STATE.online.myRole === 'host' && STATE.turn === 1) return true;
        if (STATE.online.myRole === 'guest' && STATE.turn === 2) return true;
        return false;
      }
      return false;
    }

    function endTurn() {
      if (STATE.currentGame === 'QUORIDOR') {
        if (STATE.quoridor.playerCount === 4) {
          // 顺时针流转：1(南门) -> 3(西门) -> 2(北门) -> 4(东门) -> 1
          const order = { 1: 3, 3: 2, 2: 4, 4: 1 };
          STATE.turn = order[STATE.turn] || 1;
        } else {
          STATE.turn = STATE.turn === 1 ? 2 : 1;
        }
      } else {
        STATE.turn = STATE.turn === 1 ? 2 : 1;
      }
      updateScoreboard();

      if (!STATE.winner && STATE.gameMode === 'AI' && STATE.turn !== 1) {
        STATE.animating = true;
        const botNames = {
          2: '🟢 绿方电脑',
          3: '🔵 蓝方电脑',
          4: '🟡 黄方电脑'
        };
        const bName = botNames[STATE.turn] || '🤖 电脑 AI';
        document.getElementById('status-text').textContent = `${bName} 正在深思熟虑...`;
        setTimeout(() => {
          if (STATE.currentGame === 'QUORIDOR') runQuoridorAI();
          else if (STATE.currentGame === 'GRAVITY') runGravity2DAI();
          else if (STATE.currentGame === 'GRAVITY4') runGravity4AI();
          else if (STATE.currentGame === 'GRAVITY3D') runGravity3DAI();
          else if (STATE.currentGame === 'GRAVITY3D4') runGravity3D4AI();
          else if (STATE.currentGame === 'ROULETTE') runRouletteAI();
        }, 500);
      }
    }

    // ==========================================================================
    // 7. MQTT 在线联机通信中枢
    // ==========================================================================
    const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    let myClientId = 'client_' + Math.random().toString(36).substring(2, 9);

    function initMqtt(roomId, role) {
      if (STATE.online.mqttClient) {
        try { STATE.online.mqttClient.end(); } catch (e) {}
      }

      STATE.online.roomId = roomId;
      STATE.online.myRole = role;
      document.getElementById('display-room-id').textContent = roomId;
      document.getElementById('display-role-info').innerHTML = role === 'host' ? 
        '你是 <b style="color:var(--p1-color)">🔴 房主 (红方)</b>' : 
        '你是 <b style="color:var(--p2-color)">🟢 好友 (客方)</b>';

      showToast(`正在连接房间 ${roomId}...`);
      const client = mqtt.connect(MQTT_BROKER, { clientId: myClientId, keepalive: 30, clean: true });
      STATE.online.mqttClient = client;

      client.on('connect', () => {
        STATE.online.connected = true;
        const topic = `game_hall_v2/room/${roomId}`;
        client.subscribe(topic, () => {
          if (role === 'guest') {
            client.publish(topic, JSON.stringify({ type: 'JOIN', sender: myClientId, game: STATE.currentGame }));
            showToast('已进入房间，正在等待同步...');
          } else {
            showToast('房间已就绪！点击复制链接发给好友');
          }
        });
      });

      client.on('message', (topic, payload) => {
        try {
          const msg = JSON.parse(payload.toString());
          if (msg.sender === myClientId) return;

          if (msg.type === 'JOIN') {
            if (STATE.online.myRole === 'host') {
              STATE.online.opponentJoined = true;
              showToast('🎉 好友已进入房间！对战正式开始！');
              sendOnlineAction({ type: 'SYNC', game: STATE.currentGame, turn: STATE.turn });
              updateScoreboard();
            }
          } else if (msg.type === 'SYNC') {
            if (STATE.online.myRole === 'guest') {
              STATE.online.opponentJoined = true;
              if (msg.game && msg.game !== STATE.currentGame) {
                enterGame(msg.game, 'ONLINE');
              }
              showToast('🎮 同步成功，对战开始！');
              updateScoreboard();
            }
          } else if (msg.type === 'QUORIDOR_MOVE') {
            executeQuoridorMove(msg.r, msg.c);
          } else if (msg.type === 'QUORIDOR_WALL') {
            executeQuoridorWall(msg.wallType, msg.r, msg.c);
          } else if (msg.type === 'GRAVITY_DROP') {
            const tr = getGravityLandingRow(msg.col);
            if (tr !== -1) executeGravityDrop(msg.col, tr, STATE.turn, false);
          } else if (msg.type === 'GRAVITY3D_DROP') {
            const ty = get3DLandingHeight(msg.x, msg.z);
            if (ty !== -1) execute3DDrop(msg.x, msg.z, ty, STATE.turn, false);
          } else if (msg.type === 'ROULETTE_SHOOT') {
            executeRouletteShot(msg.target, false);
          } else if (msg.type === 'ROULETTE_ITEM') {
            // 对手使用了道具，弹出提示
            showToast(`对手使用了道具：${ROULETTE_ITEM_DEFS[msg.itemKey].name}`);
          } else if (msg.type === 'AEROPLANE_ROLL') {
            handleOnlineAeroplaneRoll(msg.player, msg.val);
          } else if (msg.type === 'AEROPLANE_MOVE') {
            executeAeroplaneMove(msg.player, msg.plane, msg.roll, false);
          } else if (msg.type === 'RESTART') {
            resetCurrentGame();
            showToast('🔄 对方重新开始了对局！');
          }
        } catch (e) {}
      });
    }

    function sendOnlineAction(data) {
      if (!STATE.online.mqttClient || !STATE.online.connected) return;
      data.sender = myClientId;
      data.game = STATE.currentGame;
      STATE.online.mqttClient.publish(`game_hall_v2/room/${STATE.online.roomId}`, JSON.stringify(data));
    }

    function createOnlineRoom() {
      AUDIO.play('click');
      const roomId = Math.floor(100000 + Math.random() * 900000).toString();
      const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?game=${STATE.currentGame.toLowerCase()}&room=${roomId}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);

      document.getElementById('btn-create-room').style.display = 'none';
      document.getElementById('btn-share-link').style.display = 'flex';
      resetCurrentGame();
      initMqtt(roomId, 'host');
    }

    function copyInviteLink() {
      AUDIO.play('click');
      const url = `${window.location.protocol}//${window.location.host}${window.location.pathname}?game=${STATE.currentGame.toLowerCase()}&room=${STATE.online.roomId}`;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => showToast('✅ 邀请链接已复制！快发给微信好友吧！'));
      } else {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('✅ 邀请链接已复制！快发给微信好友吧！');
      }
    }

        const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?game=${STATE.currentGame.toLowerCase()}&room=${cleanId}`;

    // ==========================================================================
    // 10. 极限抛物线弹道核心逻辑 (TANK)
    // ==========================================================================
    function initTankGame() {
      STATE.tank.p1Hp = 100;
      STATE.tank.p2Hp = 100;
      STATE.tank.bullet = null;
      STATE.turn = 1;
      resizeTankCanvas();
      generateTankTerrain();
      updateTankWind();
      updateTankAimHUD();
      renderTank();
    }

    function resizeTankCanvas() {
      const c = document.getElementById('tank-canvas');
      if (!c) return;
      const rect = c.parentElement ? c.parentElement.getBoundingClientRect() : null;
      c.width = (rect && rect.width > 50) ? rect.width : (c.offsetWidth || 480);
      c.height = 290;
    }

    function generateTankTerrain() {
      const c = document.getElementById('tank-canvas');
      const w = c.width;
      const h = c.height;
      STATE.tank.terrain = [];

      for (let x = 0; x < w; x++) {
        const y = h * 0.7 + Math.sin(x * 0.015) * 35 + Math.sin(x * 0.04) * 15;
        STATE.tank.terrain.push(y);
      }

      STATE.tank.tank1.x = 55;
      STATE.tank.tank1.y = STATE.tank.terrain[55] - 8;
      STATE.tank.tank2.x = w - 55;
      STATE.tank.tank2.y = STATE.tank.terrain[w - 55] - 8;
    }

    function updateTankWind() {
      STATE.tank.wind = (Math.random() * 8 - 4).toFixed(1);
      const badge = document.getElementById('tank-wind-badge');
      const dir = STATE.tank.wind > 0 ? '➡️' : '⬅️';
      badge.textContent = `💨 风向: ${dir} ${Math.abs(STATE.tank.wind)} m/s`;
    }

    function updateTankAimHUD() {
      const angle = document.getElementById('tank-angle-slider').value;
      const power = document.getElementById('tank-power-slider').value;
      document.getElementById('tank-angle-val').textContent = `${angle}°`;
      document.getElementById('tank-power-val').textContent = `${power}%`;

      if (STATE.turn === 1) {
        STATE.tank.tank1.angle = parseInt(angle);
        STATE.tank.tank1.power = parseInt(power);
      }
      renderTank();
    }

    function fireTankPlayer() {
      if (STATE.turn !== 1 || STATE.tank.bullet) return;
      const t1 = STATE.tank.tank1;
      fireTankBullet(t1.x, t1.y - 6, t1.angle, t1.power, 1);
    }

    function fireTankBullet(startX, startY, angleDeg, powerVal, shooter) {
      AUDIO.play('tank_fire');
      const rad = (angleDeg * Math.PI) / 180;
      const speed = powerVal * 0.18;
      const vx = Math.cos(rad) * speed * (shooter === 1 ? 1 : -1);
      const vy = -Math.sin(rad) * speed;

      STATE.tank.bullet = {
        x: startX,
        y: startY,
        vx: vx,
        vy: vy,
        trail: [],
        shooter: shooter
      };

      startTankBulletLoop();
    }

    function startTankBulletLoop() {
      if (STATE.tank.animId) cancelAnimationFrame(STATE.tank.animId);

      let lastTime = performance.now();
      let accumulator = 0;
      const FIXED_STEP = 1000 / 60;

      function step(now) {
        if (!STATE.tank.bullet || STATE.currentGame !== 'TANK') return;
        if (!now) now = performance.now();
        let elapsed = now - lastTime;
        lastTime = now;
        if (elapsed > 100) elapsed = 100;
        accumulator += elapsed;

        const c = document.getElementById('tank-canvas');

        while (accumulator >= FIXED_STEP) {
          accumulator -= FIXED_STEP;
          const b = STATE.tank.bullet;
          if (!b) break;

          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 25) b.trail.shift();

          b.vx += parseFloat(STATE.tank.wind) * 0.012;
          b.vy += 0.28;
          b.x += b.vx;
          b.y += b.vy;

          const xInt = Math.floor(b.x);
          if (b.x < 0 || b.x >= c.width || b.y > c.height + 20) {
            explodeTankShell(b.x, b.y, false);
            return;
          }

          if (xInt >= 0 && xInt < c.width && b.y >= STATE.tank.terrain[xInt]) {
            explodeTankShell(b.x, b.y, true);
            return;
          }
        }

        renderTank();
        if (STATE.tank.bullet) {
          STATE.tank.animId = requestAnimationFrame(step);
        }
      }

      STATE.tank.animId = requestAnimationFrame(step);
    }

    function explodeTankShell(bx, by, carve) {
      STATE.tank.bullet = null;
      AUDIO.play('tank_explosion');

      const c = document.getElementById('tank-canvas');
      const blastR = 24;

      if (carve) {
        for (let x = Math.max(0, Math.floor(bx - blastR)); x < Math.min(c.width, Math.ceil(bx + blastR)); x++) {
          const dx = x - bx;
          const dyMax = Math.sqrt(blastR * blastR - dx * dx);
          if (STATE.tank.terrain[x] < by + dyMax) {
            STATE.tank.terrain[x] = Math.min(c.height - 10, by + dyMax);
          }
        }
        STATE.tank.tank1.y = STATE.tank.terrain[Math.floor(STATE.tank.tank1.x)] - 8;
        STATE.tank.tank2.y = STATE.tank.terrain[Math.floor(STATE.tank.tank2.x)] - 8;
      }

      const d1 = Math.hypot(bx - STATE.tank.tank1.x, by - STATE.tank.tank1.y);
      const d2 = Math.hypot(bx - STATE.tank.tank2.x, by - STATE.tank.tank2.y);

      if (d1 < 36) {
        const dmg = Math.round(55 * (1 - d1 / 36));
        STATE.tank.p1Hp = Math.max(0, STATE.tank.p1Hp - dmg);
      }
      if (d2 < 36) {
        const dmg = Math.round(55 * (1 - d2 / 36));
        STATE.tank.p2Hp = Math.max(0, STATE.tank.p2Hp - dmg);
      }

      document.getElementById('tank-hp-p1').style.width = `${STATE.tank.p1Hp}%`;
      document.getElementById('tank-hp-p2').style.width = `${STATE.tank.p2Hp}%`;

      renderTank();

      if (STATE.tank.p1Hp <= 0 || STATE.tank.p2Hp <= 0) {
        setTimeout(() => {
          showModal('坦克大战 战报', STATE.tank.p1Hp > 0 ? '🏆 神级高抛！你成功轰平了对方的防御！' : '💀 战车装甲破损，敌方炮火更胜一筹！');
        }, 1000);
      } else {
        STATE.turn = STATE.turn === 1 ? 2 : 1;
        updateTankWind();
        if (STATE.turn === 2 && STATE.gameMode === 'AI') {
          setTimeout(runTankAI, 1400);
        }
      }
    }

    function runTankAI() {
      if (STATE.turn !== 2 || STATE.tank.bullet) return;
      const t2 = STATE.tank.tank2;
      const t1 = STATE.tank.tank1;

      const dx = t2.x - t1.x;
      const baseAngle = 45 + Math.random() * 15;
      const basePower = Math.min(95, Math.max(40, (dx * 0.17) - parseFloat(STATE.tank.wind) * 2.5 + (Math.random() * 8 - 4)));

      fireTankBullet(t2.x, t2.y - 6, baseAngle, basePower, 2);
    }

    function renderTank() {
      const c = document.getElementById('tank-canvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      const skyGrad = ctx.createLinearGradient(0, 0, 0, c.height);
      skyGrad.addColorStop(0, '#0b1329');
      skyGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, c.width, c.height);

      if (STATE.tank.terrain.length > 0) {
        ctx.beginPath();
        ctx.moveTo(0, c.height);
        for (let x = 0; x < c.width; x++) {
          ctx.lineTo(x, STATE.tank.terrain[x]);
        }
        ctx.lineTo(c.width, c.height);
        ctx.closePath();
        ctx.fillStyle = '#334155';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#22c55e';
        ctx.stroke();
      }

      const t1 = STATE.tank.tank1;
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(t1.x - 12, t1.y - 6, 24, 12);
      const rad1 = (t1.angle * Math.PI) / 180;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(t1.x, t1.y - 2);
      ctx.lineTo(t1.x + Math.cos(rad1) * 16, t1.y - 2 - Math.sin(rad1) * 16);
      ctx.stroke();

      const t2 = STATE.tank.tank2;
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(t2.x - 12, t2.y - 6, 24, 12);
      const rad2 = (t2.angle * Math.PI) / 180;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#22c55e';
      ctx.beginPath();
      ctx.moveTo(t2.x, t2.y - 2);
      ctx.lineTo(t2.x - Math.cos(rad2) * 16, t2.y - 2 - Math.sin(rad2) * 16);
      ctx.stroke();

      if (STATE.tank.bullet) {
        const b = STATE.tank.bullet;
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        b.trail.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24';
        ctx.fill();
      }
    }

    function resetCurrentGame() {
      STATE.winner = null;
      STATE.turn = 1;
      STATE.animating = false;

      if (STATE.currentGame === 'QUORIDOR') {
        const is4P = STATE.quoridor ? STATE.quoridor.playerCount === 4 : false;
        const initialWalls = is4P ? 5 : 10;
        if (!STATE.quoridor) STATE.quoridor = {};
        STATE.quoridor.p1 = { r: 8, c: 4, walls: initialWalls };
        STATE.quoridor.p2 = { r: 0, c: 4, walls: initialWalls };
        STATE.quoridor.p3 = { r: 4, c: 0, walls: initialWalls };
        STATE.quoridor.p4 = { r: 4, c: 8, walls: initialWalls };
        STATE.quoridor.wallsH = new Set();
        STATE.quoridor.wallsV = new Set();
        STATE.quoridor.hoverPos = null;
        STATE.quoridor.lastMove = null;
        if (typeof setQuoridorTool === 'function') setQuoridorTool('MOVE');
        render2D();
      } else if (STATE.currentGame === 'GRAVITY') {
        STATE.gravity.board = Array.from({ length: 9 }, () => new Array(9).fill(0));
        STATE.gravity.hoverCol = null;
        STATE.gravity.winningLine = null;
        STATE.gravity.animatingPiece = null;
        STATE.gravity.lastMove = null;
        render2D();

        STATE.gravity4.board = Array.from({ length: 6 }, () => new Array(7).fill(0));
        STATE.gravity4.hoverCol = null;
        STATE.gravity4.winningLine = null;

        STATE.gravity4.lastMove = null;

        if (typeof initRouletteGame === 'function') initRouletteGame();
      } else if (STATE.currentGame === 'HOCKEY') {
        if (typeof resetHockeyMatch === 'function') resetHockeyMatch();
      } else if (STATE.currentGame === 'IAIDO') {
        if (typeof resetIaidoMatch === 'function') resetIaidoMatch();
      } else if (STATE.currentGame === 'LIARSDICE') {
        if (typeof resetLiarsDiceMatch === 'function') resetLiarsDiceMatch();
      } else if (STATE.currentGame === 'SUMO') {
        if (typeof resetSumoMatch === 'function') resetSumoMatch();
      } else if (STATE.currentGame === 'TANK') {
        if (typeof resetTankMatch === 'function') resetTankMatch();
      } else if (STATE.currentGame === 'STACK') {
        if (typeof resetStackMatch === 'function') resetStackMatch();
      } else if (STATE.currentGame === 'CONTRA') {
        if (typeof resetContraMatch === 'function') resetContraMatch();
      } else if (STATE.currentGame === 'TANKTROUBLE') {
        if (typeof resetTankTroubleMatch === 'function') resetTankTroubleMatch();
      } else if (STATE.currentGame === 'AEROPLANE') {
        if (typeof resetAeroplaneGame === 'function') resetAeroplaneGame();
      }
      updateScoreboard();
    }

    function enterGame(gKey, mode = 'AI') {
      STATE.currentView = 'GAME';
      STATE.currentGame = gKey;
      STATE.gameMode = mode;
      setupStageForGame(gKey);
      resetCurrentGame();
      updateScoreboard();
    }
    

    window.addEventListener('DOMContentLoaded', () => {
      enterGame('TANK', 'AI');
    });
  </script>
</body>
</html>
