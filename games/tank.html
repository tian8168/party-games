<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>极限抛物线 (Tank Artillery) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    /* ==========================================================================
       4. 极限抛物线弹道 (TANK) 样式
       ========================================================================== */
    #tank-stage {
      width: 100%;
      min-height: 440px;
      position: relative;
      background: linear-gradient(180deg, #0b1329 0%, #172554 60%, #1e293b 100%);
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    #tank-canvas {
      width: 100%;
      height: 290px;
      display: block;
    }

    .tank-hud-top {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .tank-hp-bar {
      width: 90px;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .tank-hp-fill {
      height: 100%;
      transition: width 0.3s ease;
    }
    .tank-hp-p1 { background: #ef4444; width: 100%; }
    .tank-hp-p2 { background: #22c55e; width: 100%; }

    .tank-wind-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .tank-controls-dock {
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #334155;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tank-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .tank-slider-row input[type=range] {
      flex: 1;
      accent-color: #3b82f6;
    }

    .btn-tank-fire {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 1px solid #fbbf24;
      color: #000;
      font-weight: 900;
      font-size: 1rem;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
    }

    
  </style>
</head>
<body>
  <div class="container in-game">
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">🎯 极限抛物线 (Tank Artillery)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 规则</button>
        <button class="btn-icon" id="restart-btn">🔄 重置</button>
      </div>
    </div>

    
      <div class="mode-nav">
        <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对弈</div>
  <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 双人同屏</div>
</div>
    
      <div class="generic-scoreboard" id="generic-scoreboard">
        <div class="player-card p2" id="card-p2">
          <div class="player-meta">
            <span class="player-name" id="name-p2">🟢 玩家 2 (客)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p2" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p2">10</span>
            <div id="wall-bars-p2" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>

        <div class="player-card p1 active-turn" id="card-p1">
          <div class="player-meta">
            <span class="player-name" id="name-p1">🔴 玩家 1 (主)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p1" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p1">10</span>
            <div id="wall-bars-p1" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>

        <div class="player-card p3" id="card-p3" style="display:none;">
          <div class="player-meta">
            <span class="player-name" id="name-p3">🔵 玩家 3 (西)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p3" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p3">5</span>
            <div id="wall-bars-p3" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>

        <div class="player-card p4" id="card-p4" style="display:none;">
          <div class="player-meta">
            <span class="player-name" id="name-p4">🟡 玩家 4 (东)</span>
            <span class="turn-badge">行动中</span>
          </div>
          <div id="walls-wrapper-p4" style="display:none; font-size:0.75rem; margin-top:2px;">
            余墙: <span id="walls-count-p4">5</span>
            <div id="wall-bars-p4" style="display:flex; gap:2px; height:4px; margin-top:2px;"></div>
          </div>
        </div>
      </div>


    <div class="stage-wrapper">
      <div id="tank-stage">
          <canvas id="tank-canvas"></canvas>
          <div class="tank-hud-top">
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:0.75rem; color:#ef4444; font-weight:700;" id="tank-p1-label">🔴 玩家坦克</span>
              <div class="tank-hp-bar"><div class="tank-hp-fill tank-hp-p1" id="tank-hp-p1"></div></div>
            </div>
            <div class="tank-wind-badge" id="tank-wind-badge">💨 0 m/s</div>
            <div style="display:flex; flex-direction:column; gap:2px; align-items:flex-end;">
              <span style="font-size:0.75rem; color:#22c55e; font-weight:700;" id="tank-p2-label">🟢 电脑坦克</span>
              <div class="tank-hp-bar"><div class="tank-hp-fill tank-hp-p2" id="tank-hp-p2"></div></div>
            </div>
          </div>
          <div class="tank-controls-dock" id="tank-controls-dock">
            <div class="tank-slider-row">
              <span>角度: <b id="tank-angle-val" style="color:#38bdf8;">45°</b></span>
              <input type="range" id="tank-angle-slider" min="10" max="85" value="45" oninput="updateTankAimHUD()">
              <span>力度: <b id="tank-power-val" style="color:#f59e0b;">60%</b></span>
              <input type="range" id="tank-power-slider" min="20" max="100" value="60" oninput="updateTankAimHUD()">
            </div>
            <button class="btn-tank-fire" id="btn-tank-fire" onclick="fireTankPlayer()">🔥 发射炮弹！</button>
          </div>
        </div>
    </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script>
    
    // 基础游戏运行时状态
    const STATE = {
      currentView: 'GAME',
      currentGame: 'TANK',
      gameMode: 'AI',
      turn: 1,
      scores: { 1: 0, 2: 0, 3: 0, 4: 0 },
      online: {
        connected: false,
        roomId: null,
        myRole: 'host',
        opponentJoined: false,
        mqttClient: null
      }
    };

    function checkIsMyTurn() {
      if (STATE.gameMode === 'LOCAL') return true;
      if (STATE.gameMode === 'AI') return STATE.turn === 1;
      if (STATE.gameMode === 'ONLINE') {
        if (STATE.online.myRole === 'host' && STATE.turn === 1) return true;
        if (STATE.online.myRole === 'guest' && STATE.turn === 2) return true;
        return false;
      }
      return true;
    }

    function updateScoreboard() {
      const cardP1 = document.getElementById('card-p1');
      const cardP2 = document.getElementById('card-p2');
      const cardP3 = document.getElementById('card-p3');
      const cardP4 = document.getElementById('card-p4');
      if (cardP1) {
        cardP1.classList.toggle('active-turn', STATE.turn === 1);
        const n1 = document.getElementById('name-p1');
        if (n1) n1.innerHTML = '🔴 玩家 1 (主)' + (STATE.scores[1] !== undefined ? ' <small>('+STATE.scores[1]+')</small>' : '');
      }
      if (cardP2) {
        cardP2.classList.toggle('active-turn', STATE.turn === 2);
        const n2 = document.getElementById('name-p2');
        if (n2) {
          const p2Label = STATE.gameMode === 'AI' ? '🤖 电脑 (AI)' : (STATE.gameMode === 'ONLINE' ? '🟢 好友 (客)' : '🟢 玩家 2');
          n2.innerHTML = p2Label + (STATE.scores[2] !== undefined ? ' <small>('+STATE.scores[2]+')</small>' : '');
        }
      }
      if (cardP3) cardP3.classList.toggle('active-turn', STATE.turn === 3);
      if (cardP4) cardP4.classList.toggle('active-turn', STATE.turn === 4);
    }

    function switchGameMode(mode, doReset = true) {
      STATE.gameMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab-' + mode.toLowerCase());
      if (activeTab) activeTab.classList.add('active');

      const onlinePanel = document.getElementById('online-panel');
      if (onlinePanel) {
        onlinePanel.style.display = mode === 'ONLINE' ? 'flex' : 'none';
        if (mode === 'ONLINE' && window.ONLINE_NETWORK) {
          ONLINE_NETWORK.createRoom(STATE.currentGame);
        }
      }
      updateScoreboard();
      if (doReset && typeof resetCurrentGame === 'function') {
        resetCurrentGame();
      }
    }

    function sendOnlineAction(data) {
      if (window.ONLINE_NETWORK) {
        window.ONLINE_NETWORK.sendAction(data);
      }
    }
  

    // 10. 极限抛物线弹道核心逻辑 (TANK)
    // ==========================================================================
    function initTankGame() {
      STATE.tank.p1Hp = 100;
      STATE.tank.p2Hp = 100;
      STATE.tank.bullet = null;
      STATE.turn = 1;
      resizeTankCanvas();
      generateTankTerrain();
      updateTankWind();
      updateTankAimHUD();
      renderTank();
    }

    function resizeTankCanvas() {
      const c = document.getElementById('tank-canvas');
      if (!c) return;
      const rect = c.parentElement ? c.parentElement.getBoundingClientRect() : null;
      c.width = (rect && rect.width > 50) ? rect.width : (c.offsetWidth || 480);
      c.height = 290;
    }

    function generateTankTerrain() {
      const c = document.getElementById('tank-canvas');
      const w = c.width;
      const h = c.height;
      STATE.tank.terrain = [];

      for (let x = 0; x < w; x++) {
        const y = h * 0.7 + Math.sin(x * 0.015) * 35 + Math.sin(x * 0.04) * 15;
        STATE.tank.terrain.push(y);
      }

      STATE.tank.tank1.x = 55;
      STATE.tank.tank1.y = STATE.tank.terrain[55] - 8;
      STATE.tank.tank2.x = w - 55;
      STATE.tank.tank2.y = STATE.tank.terrain[w - 55] - 8;
    }

    function updateTankWind() {
      STATE.tank.wind = (Math.random() * 8 - 4).toFixed(1);
      const badge = document.getElementById('tank-wind-badge');
      const dir = STATE.tank.wind > 0 ? '➡️' : '⬅️';
      badge.textContent = `💨 风向: ${dir} ${Math.abs(STATE.tank.wind)} m/s`;
    }

    function updateTankAimHUD() {
      const angle = document.getElementById('tank-angle-slider').value;
      const power = document.getElementById('tank-power-slider').value;
      document.getElementById('tank-angle-val').textContent = `${angle}°`;
      document.getElementById('tank-power-val').textContent = `${power}%`;

      if (STATE.turn === 1) {
        STATE.tank.tank1.angle = parseInt(angle);
        STATE.tank.tank1.power = parseInt(power);
      }
      renderTank();
    }

    function fireTankPlayer() {
      if (STATE.turn !== 1 || STATE.tank.bullet) return;
      const t1 = STATE.tank.tank1;
      fireTankBullet(t1.x, t1.y - 6, t1.angle, t1.power, 1);
    }

    function fireTankBullet(startX, startY, angleDeg, powerVal, shooter) {
      AUDIO.play('tank_fire');
      const rad = (angleDeg * Math.PI) / 180;
      const speed = powerVal * 0.18;
      const vx = Math.cos(rad) * speed * (shooter === 1 ? 1 : -1);
      const vy = -Math.sin(rad) * speed;

      STATE.tank.bullet = {
        x: startX,
        y: startY,
        vx: vx,
        vy: vy,
        trail: [],
        shooter: shooter
      };

      startTankBulletLoop();
    }

    function startTankBulletLoop() {
      if (STATE.tank.animId) cancelAnimationFrame(STATE.tank.animId);

      let lastTime = performance.now();
      let accumulator = 0;
      const FIXED_STEP = 1000 / 60;

      function step(now) {
        if (!STATE.tank.bullet || STATE.currentGame !== 'TANK') return;
        if (!now) now = performance.now();
        let elapsed = now - lastTime;
        lastTime = now;
        if (elapsed > 100) elapsed = 100;
        accumulator += elapsed;

        const c = document.getElementById('tank-canvas');

        while (accumulator >= FIXED_STEP) {
          accumulator -= FIXED_STEP;
          const b = STATE.tank.bullet;
          if (!b) break;

          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 25) b.trail.shift();

          b.vx += parseFloat(STATE.tank.wind) * 0.012;
          b.vy += 0.28;
          b.x += b.vx;
          b.y += b.vy;

          const xInt = Math.floor(b.x);
          if (b.x < 0 || b.x >= c.width || b.y > c.height + 20) {
            explodeTankShell(b.x, b.y, false);
            return;
          }

          if (xInt >= 0 && xInt < c.width && b.y >= STATE.tank.terrain[xInt]) {
            explodeTankShell(b.x, b.y, true);
            return;
          }
        }

        renderTank();
        if (STATE.tank.bullet) {
          STATE.tank.animId = requestAnimationFrame(step);
        }
      }

      STATE.tank.animId = requestAnimationFrame(step);
    }

    function explodeTankShell(bx, by, carve) {
      STATE.tank.bullet = null;
      AUDIO.play('tank_explosion');

      const c = document.getElementById('tank-canvas');
      const blastR = 24;

      if (carve) {
        for (let x = Math.max(0, Math.floor(bx - blastR)); x < Math.min(c.width, Math.ceil(bx + blastR)); x++) {
          const dx = x - bx;
          const dyMax = Math.sqrt(blastR * blastR - dx * dx);
          if (STATE.tank.terrain[x] < by + dyMax) {
            STATE.tank.terrain[x] = Math.min(c.height - 10, by + dyMax);
          }
        }
        STATE.tank.tank1.y = STATE.tank.terrain[Math.floor(STATE.tank.tank1.x)] - 8;
        STATE.tank.tank2.y = STATE.tank.terrain[Math.floor(STATE.tank.tank2.x)] - 8;
      }

      const d1 = Math.hypot(bx - STATE.tank.tank1.x, by - STATE.tank.tank1.y);
      const d2 = Math.hypot(bx - STATE.tank.tank2.x, by - STATE.tank.tank2.y);

      if (d1 < 36) {
        const dmg = Math.round(55 * (1 - d1 / 36));
        STATE.tank.p1Hp = Math.max(0, STATE.tank.p1Hp - dmg);
      }
      if (d2 < 36) {
        const dmg = Math.round(55 * (1 - d2 / 36));
        STATE.tank.p2Hp = Math.max(0, STATE.tank.p2Hp - dmg);
      }

      document.getElementById('tank-hp-p1').style.width = `${STATE.tank.p1Hp}%`;
      document.getElementById('tank-hp-p2').style.width = `${STATE.tank.p2Hp}%`;

      renderTank();

      if (STATE.tank.p1Hp <= 0 || STATE.tank.p2Hp <= 0) {
        setTimeout(() => {
          showModal('坦克大战 战报', STATE.tank.p1Hp > 0 ? '🏆 神级高抛！你成功轰平了对方的防御！' : '💀 战车装甲破损，敌方炮火更胜一筹！');
        }, 1000);
      } else {
        STATE.turn = STATE.turn === 1 ? 2 : 1;
        updateTankWind();
        if (STATE.turn === 2 && STATE.gameMode === 'AI') {
          setTimeout(runTankAI, 1400);
        }
      }
    }

    function runTankAI() {
      if (STATE.turn !== 2 || STATE.tank.bullet) return;
      const t2 = STATE.tank.tank2;
      const t1 = STATE.tank.tank1;

      const dx = t2.x - t1.x;
      const baseAngle = 45 + Math.random() * 15;
      const basePower = Math.min(95, Math.max(40, (dx * 0.17) - parseFloat(STATE.tank.wind) * 2.5 + (Math.random() * 8 - 4)));

      fireTankBullet(t2.x, t2.y - 6, baseAngle, basePower, 2);
    }

    function renderTank() {
      const c = document.getElementById('tank-canvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      const skyGrad = ctx.createLinearGradient(0, 0, 0, c.height);
      skyGrad.addColorStop(0, '#0b1329');
      skyGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, c.width, c.height);

      if (STATE.tank.terrain.length > 0) {
        ctx.beginPath();
        ctx.moveTo(0, c.height);
        for (let x = 0; x < c.width; x++) {
          ctx.lineTo(x, STATE.tank.terrain[x]);
        }
        ctx.lineTo(c.width, c.height);
        ctx.closePath();
        ctx.fillStyle = '#334155';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#22c55e';
        ctx.stroke();
      }

      const t1 = STATE.tank.tank1;
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(t1.x - 12, t1.y - 6, 24, 12);
      const rad1 = (t1.angle * Math.PI) / 180;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(t1.x, t1.y - 2);
      ctx.lineTo(t1.x + Math.cos(rad1) * 16, t1.y - 2 - Math.sin(rad1) * 16);
      ctx.stroke();

      const t2 = STATE.tank.tank2;
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(t2.x - 12, t2.y - 6, 24, 12);
      const rad2 = (t2.angle * Math.PI) / 180;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#22c55e';
      ctx.beginPath();
      ctx.moveTo(t2.x, t2.y - 2);
      ctx.lineTo(t2.x - Math.cos(rad2) * 16, t2.y - 2 - Math.sin(rad2) * 16);
      ctx.stroke();

      if (STATE.tank.bullet) {
        const b = STATE.tank.bullet;
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        b.trail.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24';
        ctx.fill();
      }
    }

    function resetTankMatch() {
      initTankGame();
    }

    // ==========================================================================
    

    function resetCurrentGame() {
      initTankGame();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("极限抛物线 规则", `<p><strong>弹道对轰：</strong>观察上方【实时风向与风速】，拖动滑杆调节发射【角度】与【力度】！</p><br>
          <p><strong>地形破坏：</strong>炮弹击中地面会炸出凹陷弹坑，直接命中或爆炸溅射直接扣除坦克生命！</p>`, resetCurrentGame);
      initTankGame();
    });
  </script>
</body>
