<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>玄素围棋 (Go / Weiqi) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <script src="../mqtt.min.js"></script>
  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script src="../common/network.js"></script>
  <style>
    /* ==========================================================================
       围棋专属样式体系 (GO / WEIQI ARCADE SUITE)
       ========================================================================== */
    body {
      overflow-x: hidden;
    }

    .container.in-game {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 12px 20px;
    }

    /* 顶栏定制 */
    .game-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-radius: 12px;
    }

    /* 核心布局框架 (双栏自适应体系) */
    .go-main-layout {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 12px;
      align-items: center;
    }

    /* 棋盘画板区域 */
    .go-board-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .board-container {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.12), inset 0 0 20px rgba(0, 0, 0, 0.25);
      background: #dfb173;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #board-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* 棋盘坐标 HUD 悬浮指示条 */
    .board-coord-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .board-coord-hud.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 侧边与控制面板 */
    .go-side-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 模式选择导航栏 */
    .mode-nav {
      display: flex;
      width: 100%;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
    }

    /* 联机面板 */
    .online-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 10px 14px;
      border-radius: 10px;
      animation: fadeIn 0.25s ease;
    }

    .online-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      flex-wrap: wrap;
      gap: 6px;
    }

    .online-status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      display: inline-block;
      transition: background 0.3s;
    }
    .online-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }
    .online-dot.waiting {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    .online-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      transition: all 0.2s;
    }

    .btn-small:hover {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    /* 配置组 */
    .go-toolbar-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .toolbar-sublabel {
      font-size: 0.76rem;
      font-weight: 700;
      color: #94a3b8;
      white-space: nowrap;
    }

    .pill-group {
      display: inline-flex;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .pill-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }

    .pill-btn:hover:not(.active) {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.08);
    }

    /* 计分板增强样式 */
    .generic-scoreboard {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .player-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      transition: all 0.25s ease;
    }

    .player-card.black-card {
      border-left: 4px solid #475569;
    }
    .player-card.white-card {
      border-left: 4px solid #f8fafc;
    }

    .player-card.active-turn {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
      background: rgba(20, 32, 54, 0.9);
    }

    .player-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: space-between;
    }

    .stone-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    .stone-badge.black {
      background: radial-gradient(circle at 35% 35%, #555f6d 0%, #0a0e14 100%);
      border: 1px solid #334155;
    }
    .stone-badge.white {
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #cbd5e1 100%);
      border: 1px solid #94a3b8;
    }

    .player-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f1f5f9;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .turn-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #64748b;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .active-turn .turn-badge {
      background: #0284c7;
      color: #ffffff;
      opacity: 1;
      box-shadow: 0 0 8px rgba(2, 132, 199, 0.5);
    }

    .captures-label {
      font-size: 0.74rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .captures-num {
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.88rem;
    }

    .ai-thinking-bar {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #38bdf8;
      font-weight: 700;
      margin-top: 2px;
    }
    .ai-thinking-bar.show {
      display: flex;
    }
    .pulse-spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* 状态提示横幅 */
    .game-status-banner {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .status-icon {
      font-size: 0.95rem;
    }
    .status-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 底部操作面板 */
    .go-controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-action-go {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 9px 6px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-action-go:hover:not(:disabled) {
      background: rgba(51, 65, 85, 0.95);
      border-color: #38bdf8;
      color: #38bdf8;
      transform: translateY(-1px);
    }

    .btn-action-go:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-action-go.active-toggle {
      background: rgba(14, 165, 233, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .btn-action-go:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* 提子飘字动画容器 */
    .capture-floating-text {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: 1.1rem;
      color: #f59e0b;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      animation: floatUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 10;
    }

    @keyframes floatUpFade {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
      20% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
      80% { transform: translate(-50%, -30px) scale(1); opacity: 0.9; }
      100% { transform: translate(-50%, -45px) scale(0.9); opacity: 0; }
    }

    /* ==========================================================================
       自适应视口断点响应规则 (16:9 桌面宽屏与移动竖屏精修)
       ========================================================================== */
    /* 移动端 / 竖屏模式 (< 960px) */
    @media (max-width: 959px) {
      .container.in-game {
        padding: 6px 8px 16px;
        gap: 6px;
      }
      .game-header {
        padding: 6px 12px;
      }
      .game-header h2 {
        font-size: 1.05rem;
      }
      .go-main-layout {
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .go-side-panel {
        display: contents;
      }
      .generic-scoreboard {
        order: 1;
        max-width: 520px;
        gap: 6px;
      }
      .player-card {
        padding: 6px 10px;
      }
      .player-name {
        font-size: 0.78rem;
      }
      .go-board-section {
        order: 2;
        width: 100%;
      }
      .board-container {
        width: min(calc(100vw - 16px), calc(100vh - 275px), 520px);
        height: min(calc(100vw - 16px), calc(100vh - 275px), 520px);
        margin: 0 auto;
      }
      .game-status-banner {
        order: 3;
        max-width: 520px;
        padding: 6px 10px;
        font-size: 0.78rem;
      }
      .go-controls-grid {
        order: 4;
        max-width: 520px;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .btn-action-go {
        padding: 7px 4px;
        font-size: 0.76rem;
      }
      .mode-nav {
        order: 5;
        max-width: 520px;
        padding: 4px;
      }
      .mode-tab {
        padding: 5px 8px;
        font-size: 0.75rem;
      }
      .online-panel {
        order: 6;
        max-width: 520px;
        padding: 8px 10px;
      }
      .go-toolbar-group {
        order: 7;
        max-width: 520px;
        padding: 5px 8px;
      }
    }

    /* 16:9 宽屏与大桌面模式 (>= 960px) */
    @media (min-width: 960px) {
      .container.in-game {
        height: 100vh;
        max-height: 100vh;
        padding: 8px 24px 12px;
        box-sizing: border-box;
        overflow: hidden;
      }
      .game-header {
        flex-shrink: 0;
        margin-bottom: 2px;
      }
      .go-main-layout {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 24px;
        flex: 1;
        min-height: 0;
      }
      .go-board-section {
        flex: 1;
        height: 100%;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .board-container {
        width: min(calc(100vh - 90px), calc(100vw - 420px), 760px);
        height: min(calc(100vh - 90px), calc(100vw - 420px), 760px);
      }
      .go-side-panel {
        width: 360px;
        flex-shrink: 0;
        height: min(calc(100vh - 90px), 760px);
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .go-controls-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-top: auto;
      }
      .btn-action-go {
        padding: 10px 8px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶栏导航 -->
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">⚪⚫ 玄素围棋 (Go / Weiqi)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 规则</button>
        <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重置</button>
      </div>
    </div>

    <!-- 核心布局体系 (左棋盘 / 右操作面板) -->
    <div class="go-main-layout">
      <!-- 左侧：棋盘主体区域 -->
      <div class="go-board-section">
        <div class="board-container" id="board-box">
          <canvas id="board-canvas"></canvas>
          <div class="board-coord-hud" id="board-coord-hud"></div>
        </div>
      </div>

      <!-- 右侧：侧边控制与状态面板 -->
      <div class="go-side-panel">
        <!-- 模式选择导航栏 -->
        <div class="mode-nav">
          <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对弈</div>
          <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 双人同屏</div>
          <div class="mode-tab" id="tab-online" onclick="switchGameMode('ONLINE')">🌐 好友联机</div>
        </div>

        <!-- 联机面板 -->
        <div class="online-panel" id="online-panel">
          <div class="online-info">
            <span>房间号: <b id="display-room-id" style="color:var(--neon-cyan)">未连接</b></span>
            <span id="display-role-info">你是 <b style="color:#38bdf8">⚫ 房主 (执黑·先手)</b></span>
          </div>
          <div class="online-status-row" id="online-status-row">
            <span class="online-dot" id="online-dot"></span>
            <span id="online-status-text">未就绪</span>
          </div>
          <div class="online-actions">
            <button class="btn-small" onclick="createOnlineRoom()">创建新房</button>
            <button class="btn-small" onclick="copyOnlineLink()">复制邀请链接</button>
            <button class="btn-small" onclick="joinOnlineRoomPrompt()">输入房间号</button>
          </div>
        </div>

        <!-- 棋盘路数配置 -->
        <div class="go-toolbar-group">
          <div class="toolbar-sublabel">棋盘路数</div>
          <div class="pill-group" title="选择棋盘路数">
            <button class="pill-btn active" id="size-9" onclick="changeBoardSize(9)">9×9 (聚会极速)</button>
            <button class="pill-btn" id="size-13" onclick="changeBoardSize(13)">13×13 (中盘)</button>
            <button class="pill-btn" id="size-19" onclick="changeBoardSize(19)">19×19 (标准)</button>
          </div>
        </div>

        <!-- AI难度配置 -->
        <div class="go-toolbar-group" id="ai-difficulty-wrapper">
          <div class="toolbar-sublabel">AI 强度</div>
          <div class="pill-group" id="ai-difficulty-group" title="AI 算力强度">
            <button class="pill-btn active" id="diff-easy" onclick="changeAiDifficulty('EASY')">🟢 入门</button>
            <button class="pill-btn" id="diff-tactical" onclick="changeAiDifficulty('TACTICAL')">🟡 进阶</button>
            <button class="pill-btn" id="diff-master" onclick="changeAiDifficulty('MASTER')">🔴 大师(MCTS)</button>
          </div>
        </div>

        <!-- 计分与状态卡片 -->
        <div class="generic-scoreboard" id="generic-scoreboard">
          <!-- 玩家 1：黑方 (先手) -->
          <div class="player-card black-card active-turn" id="card-p1">
            <div class="player-header-row">
              <div class="stone-badge black"></div>
              <span class="player-name" id="name-p1">玩家 1 (黑棋)</span>
              <span class="turn-badge" id="turn-badge-p1">落子中</span>
            </div>
            <div class="captures-label">提子: <span class="captures-num" id="caps-p1">0</span> 颗</div>
          </div>

          <!-- 玩家 2：白方 (后手 / AI) -->
          <div class="player-card white-card" id="card-p2">
            <div class="player-header-row">
              <div class="stone-badge white"></div>
              <span class="player-name" id="name-p2">电脑 (白棋)</span>
              <span class="turn-badge" id="turn-badge-p2">等待</span>
            </div>
            <div class="captures-label">提子: <span class="captures-num" id="caps-p2">0</span> 颗</div>
            <div class="ai-thinking-bar" id="ai-thinking-indicator"><span class="pulse-spin">⚙️</span> AI深度演算中...</div>
          </div>
        </div>

        <!-- 当前对局状态条 -->
        <div class="game-status-banner" id="game-status-banner">
          <span class="status-icon" id="status-icon">⚫</span>
          <span class="status-text" id="status-text">对局开始，执黑先行</span>
        </div>

        <!-- 战术工具栏 -->
        <div class="go-controls-grid">
          <button class="btn-action-go" id="btn-undo" onclick="undoMove()">
            <span>↩️</span>
            <span>悔棋</span>
          </button>
          <button class="btn-action-go" id="btn-pass" onclick="passTurn()">
            <span>✋</span>
            <span>停一手</span>
          </button>
          <button class="btn-action-go" id="btn-territory" onclick="toggleTerritoryView()">
            <span>🗺️</span>
            <span>目数估算</span>
          </button>
          <button class="btn-action-go" id="btn-resign" onclick="resignGame()">
            <span>🏳️</span>
            <span>认输</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 围棋核心逻辑脚本 -->
  <script>
    // ==========================================================================
    // 1. 围棋核心状态机 (GO ENGINE STATE)
    // ==========================================================================
    const GO_STATE = {
      boardSize: 9,              // 9, 13, 19
      board: Array(9).fill(0).map(() => Array(9).fill(0)), // 0: empty, 1: Black, 2: White
      turn: 1,                   // 1: Black, 2: White
      captures: { 1: 0, 2: 0 },  // 1: Black captures, 2: White captures
      gameMode: 'AI',            // 'AI', 'LOCAL', 'ONLINE'
      aiDifficulty: 'EASY',      // 'EASY', 'TACTICAL', 'MASTER'
      userColor: 1,              // In AI mode: 1 (Black), 2 (White)
      lastMove: null,            // { r, c }
      history: [],               // Snapshots for Undo
      koPoint: null,             // { r, c } - Single stone Ko point forbidden next turn
      passCount: 0,              // Consecutive passes
      gameOver: false,
      winner: null,
      showTerritory: false,
      hoverPoint: null,
      isAiComputing: false,
      territoryMap: null,
      online: {
        roomId: null,
        myRole: 'host',          // 'host' (Black / 1) | 'guest' (White / 2)
        myColor: 1,
        connected: false,
        opponentJoined: false
      }
    };

    const CANVAS = document.getElementById('board-canvas');
    const CTX = CANVAS.getContext('2d');
    let touchHandledTimestamp = 0;

    // ==========================================================================
    // 2. 规则算法：气、连通块、提子、禁着与打劫
    // ==========================================================================
    function getNeighbors(r, c, size = GO_STATE.boardSize) {
      const neighbors = [];
      if (r > 0) neighbors.push({ r: r - 1, c });
      if (r < size - 1) neighbors.push({ r: r + 1, c });
      if (c > 0) neighbors.push({ r, c: c - 1 });
      if (c < size - 1) neighbors.push({ r, c: c + 1 });
      return neighbors;
    }

    // 获取包含 (r, c) 的整块棋子连通块及其全部气的坐标集合
    function getGroupAndLiberties(r, c, board, size = GO_STATE.boardSize) {
      const color = board[r][c];
      if (color === 0) return { stones: [], liberties: new Set(), color: 0 };

      const stones = [];
      const visited = new Set();
      const liberties = new Set();
      const queue = [{ r, c }];
      visited.add(`${r},${c}`);

      while (queue.length > 0) {
        const curr = queue.shift();
        stones.push(curr);

        for (const n of getNeighbors(curr.r, curr.c, size)) {
          const nColor = board[n.r][n.c];
          const key = `${n.r},${n.c}`;
          if (nColor === 0) {
            liberties.add(key);
          } else if (nColor === color && !visited.has(key)) {
            visited.add(key);
            queue.push(n);
          }
        }
      }

      return { stones, liberties, color, libertyCount: liberties.size };
    }

    // 复制棋盘状态
    function cloneBoard(board) {
      return board.map(row => [...row]);
    }

    // 校验落子合法性（返回 { valid: boolean, captures: Array, newKo: Object|null, reason?: string }）
    function checkMoveLegality(r, c, player, board, koPoint) {
      const size = board.length;
      if (r < 0 || r >= size || c < 0 || c >= size) {
        return { valid: false, reason: '超出棋盘边界' };
      }
      if (board[r][c] !== 0) {
        return { valid: false, reason: '已有棋子' };
      }

      // 检查劫争禁着点 (Ko Rule)
      if (koPoint && koPoint.r === r && koPoint.c === c) {
        return { valid: false, reason: '打劫禁着点，请先寻劫' };
      }

      const opponent = player === 1 ? 2 : 1;
      const testBoard = cloneBoard(board);
      testBoard[r][c] = player;

      // 1. 检查是否提掉对方棋子
      const capturedStones = [];
      const checkedOpponentGroups = new Set();

      for (const n of getNeighbors(r, c, size)) {
        if (testBoard[n.r][n.c] === opponent) {
          const groupKey = `${n.r},${n.c}`;
          if (!checkedOpponentGroups.has(groupKey)) {
            const oppGroup = getGroupAndLiberties(n.r, n.c, testBoard, size);
            oppGroup.stones.forEach(s => checkedOpponentGroups.add(`${s.r},${s.c}`));
            if (oppGroup.liberties.size === 0) {
              capturedStones.push(...oppGroup.stones);
            }
          }
        }
      }

      // 2. 如果有提子，此手必定合法，绝非自杀
      if (capturedStones.length > 0) {
        // 判定新劫点：如果自己下的是单子，且正好只提了对方 1 颗子，并且自己这块棋下完后只有 1 气
        let newKo = null;
        capturedStones.forEach(s => testBoard[s.r][s.c] = 0);
        const myGroupAfter = getGroupAndLiberties(r, c, testBoard, size);
        if (capturedStones.length === 1 && myGroupAfter.stones.length === 1 && myGroupAfter.liberties.size === 1) {
          newKo = { r: capturedStones[0].r, c: capturedStones[0].c };
        }
        return { valid: true, captures: capturedStones, newKo };
      }

      // 3. 无提子时，检查落子后自身是否有气（自杀禁手检查）
      const myGroup = getGroupAndLiberties(r, c, testBoard, size);
      if (myGroup.liberties.size === 0) {
        return { valid: false, reason: '自杀禁着点，禁止无气落子' };
      }

      return { valid: true, captures: [], newKo: null };
    }

    // ==========================================================================
    // 3. 落子与回合轮转
    // ==========================================================================
    function playStone(r, c) {
      if (GO_STATE.gameOver || GO_STATE.isAiComputing) return;

      // 联机模式权限拦截
      if (GO_STATE.gameMode === 'ONLINE') {
        if (!GO_STATE.online.connected) {
          showToast('⚠️ 正在连接房间中，请稍候...');
          return;
        }
        if (!GO_STATE.online.opponentJoined && GO_STATE.online.myRole === 'host') {
          showToast('⏳ 请等待好友进入房间后再落子');
          return;
        }
        if (GO_STATE.turn !== GO_STATE.online.myColor) {
          showToast('⏳ 当前是对方回合，请等待对方落子');
          return;
        }
      } else if (GO_STATE.gameMode === 'AI') {
        // 人机模式下，如果当前不属于玩家回合则拦截
        if (GO_STATE.turn !== GO_STATE.userColor) return;
      }

      const legality = checkMoveLegality(r, c, GO_STATE.turn, GO_STATE.board, GO_STATE.koPoint);
      if (!legality.valid) {
        showToast(`⚠️ ${legality.reason}`);
        if (window.AUDIO) try { window.AUDIO.play('go_invalid'); } catch(e) {}
        return;
      }

      executeMove(r, c, legality.captures, legality.newKo, true);

      // 如果人机对弈且游戏未结束，调度 AI 走子
      if (GO_STATE.gameMode === 'AI' && !GO_STATE.gameOver && GO_STATE.turn !== GO_STATE.userColor) {
        scheduleAiMove();
      }
    }

    function executeMove(r, c, captures, newKo, broadcast = true) {
      // 记录历史快照以便悔棋
      GO_STATE.history.push({
        board: cloneBoard(GO_STATE.board),
        turn: GO_STATE.turn,
        captures: { ...GO_STATE.captures },
        lastMove: GO_STATE.lastMove,
        koPoint: GO_STATE.koPoint,
        passCount: GO_STATE.passCount
      });

      const currentTurn = GO_STATE.turn;
      GO_STATE.board[r][c] = currentTurn;

      // 执行提子
      if (captures && captures.length > 0) {
        for (const s of captures) {
          GO_STATE.board[s.r][s.c] = 0;
        }
        GO_STATE.captures[currentTurn] += captures.length;
        spawnCaptureText(r, c, `+${captures.length} 提子`);
        if (window.AUDIO) try { window.AUDIO.play('go_capture'); } catch(e) {}
      } else {
        if (window.AUDIO) try { window.AUDIO.play('go_stone'); } catch(e) {}
      }

      GO_STATE.lastMove = { r, c };
      GO_STATE.koPoint = newKo;
      GO_STATE.passCount = 0;
      GO_STATE.showTerritory = false;
      GO_STATE.hoverPoint = null; // 清除悬停瞄准，避免落子后在原位画出红色禁止警告

      const terrBtn = document.getElementById('btn-territory');
      if (terrBtn) terrBtn.classList.remove('active-toggle');

      // 广播给联机对手
      if (broadcast && GO_STATE.gameMode === 'ONLINE') {
        sendOnlineAction({
          type: 'GO_MOVE',
          r,
          c,
          player: currentTurn,
          boardSize: GO_STATE.boardSize
        });
      }

      // 切换走子方
      GO_STATE.turn = currentTurn === 1 ? 2 : 1;

      updateUI();
      renderBoard();
    }

    // 停一手 (Pass)
    function passTurn(broadcast = true, isUser = true) {
      if (GO_STATE.gameOver || GO_STATE.isAiComputing) return;

      if (isUser) {
        if (GO_STATE.gameMode === 'ONLINE' && broadcast) {
          if (!GO_STATE.online.opponentJoined) {
            showToast('⏳ 请等待好友进入房间');
            return;
          }
          if (GO_STATE.turn !== GO_STATE.online.myColor) {
            showToast('⏳ 当前是对方回合');
            return;
          }
        } else if (GO_STATE.gameMode === 'AI') {
          if (GO_STATE.turn !== GO_STATE.userColor) {
            showToast('⏳ 当前是电脑回合');
            return;
          }
        }
      }

      if (window.AUDIO) try { window.AUDIO.play('go_pass'); } catch(e) {}

      GO_STATE.history.push({
        board: cloneBoard(GO_STATE.board),
        turn: GO_STATE.turn,
        captures: { ...GO_STATE.captures },
        lastMove: GO_STATE.lastMove,
        koPoint: GO_STATE.koPoint,
        passCount: GO_STATE.passCount
      });

      const passerColor = GO_STATE.turn;
      GO_STATE.passCount++;
      const passer = passerColor === 1 ? '黑方' : '白方';
      showToast(`✋ ${passer} 选择了停一手 (Pass)`);

      GO_STATE.koPoint = null;
      GO_STATE.turn = passerColor === 1 ? 2 : 1;

      if (broadcast && GO_STATE.gameMode === 'ONLINE') {
        sendOnlineAction({
          type: 'GO_PASS',
          player: passerColor
        });
      }

      // 双方连续 Pass 触发终局数子
      if (GO_STATE.passCount >= 2) {
        finishGameByPass();
        return;
      }

      updateUI();
      renderBoard();

      // 仅当切换后轮到 AI 时调度
      if (GO_STATE.gameMode === 'AI' && !GO_STATE.gameOver && GO_STATE.turn !== GO_STATE.userColor) {
        scheduleAiMove();
      }
    }

    // 悔棋 (Undo)
    function undoMove() {
      if (GO_STATE.gameMode === 'ONLINE') {
        showToast('⚠️ 好友联机模式禁止悔棋');
        return;
      }
      if (GO_STATE.history.length === 0 || GO_STATE.isAiComputing || GO_STATE.gameOver) {
        showToast('无法继续悔棋');
        return;
      }

      // 人机对战模式需回退 2 步（回退 AI 与玩家的一手）
      const stepsToUndo = (GO_STATE.gameMode === 'AI' && GO_STATE.history.length >= 2) ? 2 : 1;

      for (let i = 0; i < stepsToUndo; i++) {
        const prev = GO_STATE.history.pop();
        if (prev) {
          GO_STATE.board = prev.board;
          GO_STATE.turn = prev.turn;
          GO_STATE.captures = prev.captures;
          GO_STATE.lastMove = prev.lastMove;
          GO_STATE.koPoint = prev.koPoint;
          GO_STATE.passCount = prev.passCount;
        }
      }

      GO_STATE.gameOver = false;
      GO_STATE.winner = null;
      GO_STATE.showTerritory = false;
      const terrBtn = document.getElementById('btn-territory');
      if (terrBtn) terrBtn.classList.remove('active-toggle');

      if (window.AUDIO) try { window.AUDIO.play('click'); } catch(e) {}
      showToast('↩️ 已悔棋');
      updateUI();
      renderBoard();
    }

    // 认输 (Resign)
    function resignGame(broadcast = true) {
      if (GO_STATE.gameOver) return;

      if (GO_STATE.gameMode === 'ONLINE' && broadcast) {
        if (!confirm('确定要认输吗？本局将裁定对方获胜。')) return;
      }

      let resigningColor;
      if (GO_STATE.gameMode === 'ONLINE') {
        resigningColor = broadcast ? GO_STATE.online.myColor : (GO_STATE.online.myColor === 1 ? 2 : 1);
      } else if (GO_STATE.gameMode === 'AI') {
        resigningColor = GO_STATE.userColor; // AI模式下始终为人类玩家认输
      } else {
        resigningColor = GO_STATE.turn; // 本地双人对弈下当前回合方认输
      }

      const resigningPlayer = resigningColor === 1 ? '黑棋' : '白棋';
      const winner = resigningColor === 1 ? '白棋' : '黑棋';

      GO_STATE.gameOver = true;
      GO_STATE.winner = winner;

      if (broadcast && GO_STATE.gameMode === 'ONLINE') {
        sendOnlineAction({
          type: 'GO_RESIGN',
          player: resigningColor
        });
      }

      if (window.AUDIO) try { window.AUDIO.play('win'); } catch(e) {}
      showModal('🏁 对局结束 (认输)', `
        <p style="font-size:1.1rem; text-align:center;"><b>${resigningPlayer} 中盘认输</b></p><br>
        <p style="text-align:center; color:#38bdf8; font-weight:800; font-size:1.25rem;">🏆 恭喜 ${winner} 不战而胜！</p><br>
        <p style="text-align:center; color:#94a3b8;">棋局已终了，可点击下方按钮重新开局或返回大厅。</p>
      `, { isGameOver: true });

      updateUI();
      renderBoard();
    }

    // 终局数子与胜负裁定
    function finishGameByPass() {
      GO_STATE.gameOver = true;
      const score = calculateTerritoryScore(GO_STATE.board, true);
      const komi = GO_STATE.boardSize === 9 ? 6.5 : 7.5; // 标准半目贴目消除和棋
      const blackTotal = score.black + GO_STATE.captures[1];
      const whiteTotal = score.white + GO_STATE.captures[2] + komi;
      const diff = Math.abs(blackTotal - whiteTotal).toFixed(1);
      const winnerName = blackTotal > whiteTotal ? '黑方 (执黑)' : '白方 (执白)';
      GO_STATE.winner = winnerName;

      if (window.AUDIO) try { window.AUDIO.play('win'); } catch(e) {}
      showModal('🏁 终局数子结算 (双停一手终盘)', `
        <div style="font-size:0.92rem; line-height:1.6;">
          <p>双方连续 Pass 确认终盘，进入围棋目数判定：</p><br>
          <div style="background:rgba(15,23,42,0.8); padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);">
            <p>⚫ <b>黑方</b>：围地 <b>${score.black}</b> 目 + 提子 <b>${GO_STATE.captures[1]}</b> 颗 = 总计 <b>${blackTotal}</b> 目</p>
            <p>⚪ <b>白方</b>：围地 <b>${score.white}</b> 目 + 提子 <b>${GO_STATE.captures[2]}</b> 颗 + 贴目 <b>${komi}</b> 目 = 总计 <b>${whiteTotal}</b> 目</p>
          </div><br>
          <p style="text-align:center; color:#22c55e; font-size:1.2rem; font-weight:800;">
            🏆 裁定胜者：${winnerName} 胜 <b>${diff}</b> 目！
          </p>
        </div>
      `, { isGameOver: true });

      GO_STATE.showTerritory = true;
      const terrBtn = document.getElementById('btn-territory');
      if (terrBtn) terrBtn.classList.add('active-toggle');
      updateUI();
      renderBoard();
    }

    // ==========================================================================
    // 4. 形式判断与目数染色算法 (Territory Evaluation)
    // ==========================================================================
    function calculateTerritoryScore(board, saveToGlobal = false) {
      const size = board.length;
      const visited = new Set();
      let blackTerritory = 0;
      let whiteTerritory = 0;
      const territoryMap = Array(size).fill(0).map(() => Array(size).fill(0));

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0 && !visited.has(`${r},${c}`)) {
            const emptyGroup = [];
            const queue = [{ r, c }];
            visited.add(`${r},${c}`);
            let touchesBlack = false;
            let touchesWhite = false;

            while (queue.length > 0) {
              const curr = queue.shift();
              emptyGroup.push(curr);

              for (const n of getNeighbors(curr.r, curr.c, size)) {
                const color = board[n.r][n.c];
                if (color === 1) touchesBlack = true;
                else if (color === 2) touchesWhite = true;
                else if (color === 0 && !visited.has(`${n.r},${n.c}`)) {
                  visited.add(`${n.r},${n.c}`);
                  queue.push(n);
                }
              }
            }

            // 仅被单一颜色包围的空地归属于该方
            if (touchesBlack && !touchesWhite) {
              blackTerritory += emptyGroup.length;
              emptyGroup.forEach(p => territoryMap[p.r][p.c] = 1);
            } else if (touchesWhite && !touchesBlack) {
              whiteTerritory += emptyGroup.length;
              emptyGroup.forEach(p => territoryMap[p.r][p.c] = 2);
            }
          }
        }
      }

      if (saveToGlobal) {
        GO_STATE.territoryMap = territoryMap;
      }
      return { black: blackTerritory, white: whiteTerritory, territoryMap };
    }

    function toggleTerritoryView() {
      GO_STATE.showTerritory = !GO_STATE.showTerritory;
      const terrBtn = document.getElementById('btn-territory');
      if (GO_STATE.showTerritory) {
        calculateTerritoryScore(GO_STATE.board, true);
        if (terrBtn) terrBtn.classList.add('active-toggle');
        showToast('🗺️ 开启地盘目数高亮');
      } else {
        if (terrBtn) terrBtn.classList.remove('active-toggle');
        showToast('已关闭目数高亮');
      }
      renderBoard();
    }

    // ==========================================================================
    // 5. 围棋多级 AI 智能对弈引擎 (GO ARTIFICIAL INTELLIGENCE)
    // ==========================================================================
    function scheduleAiMove() {
      GO_STATE.isAiComputing = true;
      const indicator = document.getElementById('ai-thinking-indicator');
      if (indicator) indicator.classList.add('show');

      const thinkTime = GO_STATE.aiDifficulty === 'MASTER' ? 500 : 350;

      setTimeout(() => {
        const move = computeBestAiMove(GO_STATE.board, GO_STATE.turn, GO_STATE.aiDifficulty, GO_STATE.koPoint);
        GO_STATE.isAiComputing = false;
        if (indicator) indicator.classList.remove('show');

        if (move && move.r !== undefined && move.c !== undefined) {
          const legality = checkMoveLegality(move.r, move.c, GO_STATE.turn, GO_STATE.board, GO_STATE.koPoint);
          if (legality.valid) {
            executeMove(move.r, move.c, legality.captures, legality.newKo, true);
          } else {
            passTurn(true, false);
          }
        } else {
          passTurn(true, false);
        }
      }, thinkTime);
    }

    function computeBestAiMove(board, aiColor, difficulty, koPoint) {
      const size = board.length;
      const oppColor = aiColor === 1 ? 2 : 1;
      const validMoves = [];

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) {
            const check = checkMoveLegality(r, c, aiColor, board, koPoint);
            if (check.valid) {
              validMoves.push({ r, c, captures: check.captures, newKo: check.newKo });
            }
          }
        }
      }

      if (validMoves.length === 0) return null;

      if (difficulty === 'EASY') {
        const captureMoves = validMoves.filter(m => m.captures.length > 0);
        if (captureMoves.length > 0) {
          captureMoves.sort((a, b) => b.captures.length - a.captures.length);
          return captureMoves[0];
        }

        const safeMoves = validMoves.filter(m => !isTrueEye(m.r, m.c, aiColor, board));
        const pool = safeMoves.length > 0 ? safeMoves : validMoves;

        const cornerStarMoves = pool.filter(m => isCornerOrStar(m.r, m.c, size));
        if (cornerStarMoves.length > 0 && Math.random() < 0.6) {
          return cornerStarMoves[Math.floor(Math.random() * cornerStarMoves.length)];
        }
        return pool[Math.floor(Math.random() * pool.length)];
      }

      if (difficulty === 'TACTICAL') {
        return evaluateTacticalMove(board, validMoves, aiColor, oppColor);
      }

      if (difficulty === 'MASTER') {
        if (size === 9) {
          return runMctsSearch(board, aiColor, oppColor, validMoves, koPoint, 250);
        } else {
          return evaluateTacticalMove(board, validMoves, aiColor, oppColor);
        }
      }

      return validMoves[0];
    }

    function evaluateTacticalMove(board, validMoves, aiColor, oppColor) {
      const size = board.length;
      let bestMove = validMoves[0];
      let bestScore = -999999;

      for (const m of validMoves) {
        let score = 0;

        if (m.captures.length > 0) {
          score += m.captures.length * 150;
        }

        const testBoard = cloneBoard(board);
        testBoard[m.r][m.c] = aiColor;
        m.captures.forEach(s => testBoard[s.r][s.c] = 0);

        const myGroup = getGroupAndLiberties(m.r, m.c, testBoard, size);

        if (myGroup.liberties.size === 1) {
          score -= 180;
        } else if (myGroup.liberties.size === 2) {
          score += 15;
        } else if (myGroup.liberties.size >= 3) {
          score += 35;
        }

        for (const n of getNeighbors(m.r, m.c, size)) {
          if (testBoard[n.r][n.c] === oppColor) {
            const oppGroup = getGroupAndLiberties(n.r, n.c, testBoard, size);
            if (oppGroup.liberties.size === 1) {
              score += 90;
            }
          }
        }

        for (const n of getNeighbors(m.r, m.c, size)) {
          if (board[n.r][n.c] === aiColor) {
            const origGroup = getGroupAndLiberties(n.r, n.c, board, size);
            if (origGroup.liberties.size === 1 && myGroup.liberties.size >= 2) {
              score += 140;
            }
          }
        }

        const distR = Math.min(m.r, size - 1 - m.r);
        const distC = Math.min(m.c, size - 1 - m.c);
        if (distR === 2 && distC === 2) score += 25;
        else if ((distR === 2 && distC === 3) || (distR === 3 && distC === 2)) score += 30;
        else if (distR === 0 || distC === 0) score -= 20;

        if (isTrueEye(m.r, m.c, aiColor, board)) {
          score -= 200;
        }

        score += Math.random() * 8;

        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }

      return bestMove;
    }

    function runMctsSearch(rootBoard, aiColor, oppColor, validMoves, koPoint, simulations = 200) {
      const size = rootBoard.length;
      const stats = new Map();

      validMoves.forEach(m => {
        stats.set(`${m.r},${m.c}`, { wins: 0, visits: 0, move: m });
      });

      for (let sim = 0; sim < simulations; sim++) {
        const firstMove = validMoves[sim % validMoves.length];
        const key = `${firstMove.r},${firstMove.c}`;
        const node = stats.get(key);

        const simBoard = cloneBoard(rootBoard);
        simBoard[firstMove.r][firstMove.c] = aiColor;
        firstMove.captures.forEach(s => simBoard[s.r][s.c] = 0);

        let turn = oppColor;
        let passes = 0;
        for (let step = 0; step < 16; step++) {
          const r = Math.floor(Math.random() * size);
          const c = Math.floor(Math.random() * size);
          if (simBoard[r][c] === 0) {
            const leg = checkMoveLegality(r, c, turn, simBoard, null);
            if (leg.valid) {
              simBoard[r][c] = turn;
              leg.captures.forEach(s => simBoard[s.r][s.c] = 0);
              turn = turn === 1 ? 2 : 1;
              passes = 0;
              continue;
            }
          }
          passes++;
          if (passes >= 4) break;
        }

        const sc = calculateTerritoryScore(simBoard, false);
        const myScore = aiColor === 1 ? sc.black : sc.white;
        const oppScore = aiColor === 1 ? sc.white : sc.black;
        const isWin = myScore >= oppScore;

        node.visits++;
        if (isWin) node.wins++;
      }

      let best = validMoves[0];
      let bestRate = -1;
      stats.forEach(s => {
        const rate = s.visits > 0 ? (s.wins / s.visits) : 0;
        if (rate > bestRate) {
          bestRate = rate;
          best = s.move;
        }
      });

      return best;
    }

    function isTrueEye(r, c, color, board) {
      const size = board.length;
      for (const n of getNeighbors(r, c, size)) {
        if (board[n.r][n.c] !== color) return false;
      }
      return true;
    }

    function isCornerOrStar(r, c, size) {
      if (size === 9) {
        return (r === 2 && c === 2) || (r === 2 && c === 6) || (r === 6 && c === 2) || (r === 6 && c === 6) || (r === 4 && c === 4);
      } else if (size === 13) {
        return (r === 3 && c === 3) || (r === 3 && c === 9) || (r === 9 && c === 3) || (r === 9 && c === 9) || (r === 6 && c === 6);
      } else if (size === 19) {
        const starIdx = [3, 9, 15];
        return starIdx.includes(r) && starIdx.includes(c);
      }
      return false;
    }

    function getCoordName(r, c) {
      const size = GO_STATE.boardSize;
      const colLabels = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R','S','T'];
      const colStr = colLabels[c] || '';
      const rowNum = size - r;
      let label = `${colStr}${rowNum}`;

      if (size === 9 && r === 4 && c === 4) label += ' (天元)';
      else if (size === 13 && r === 6 && c === 6) label += ' (天元)';
      else if (size === 19 && r === 9 && c === 9) label += ' (天元)';
      else if (isCornerOrStar(r, c, size)) label += ' (星位)';
      return label;
    }

    // ==========================================================================
    // 6. Canvas 绘制、高 DPI 变换与高精度坐标映射
    // ==========================================================================
    function getBoardStarPoints(size) {
      if (size === 9) {
        return [{ r: 2, c: 2 }, { r: 2, c: 6 }, { r: 6, c: 2 }, { r: 6, c: 6 }, { r: 4, c: 4 }];
      } else if (size === 13) {
        return [{ r: 3, c: 3 }, { r: 3, c: 9 }, { r: 9, c: 3 }, { r: 9, c: 9 }, { r: 6, c: 6 }];
      } else {
        return [
          { r: 3, c: 3 }, { r: 3, c: 9 }, { r: 3, c: 15 },
          { r: 9, c: 3 }, { r: 9, c: 9 }, { r: 9, c: 15 },
          { r: 15, c: 3 }, { r: 15, c: 9 }, { r: 15, c: 15 }
        ];
      }
    }

    function resizeCanvas() {
      const box = document.getElementById('board-box');
      if (!box) return;
      const rect = box.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(rect.width);
      const h = Math.round(rect.height);
      if (w <= 0 || h <= 0) return;

      CANVAS.width = Math.round(w * dpr);
      CANVAS.height = Math.round(h * dpr);
      CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderBoard();
    }

    function getGridMetrics() {
      const rect = CANVAS.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const side = Math.min(w, h);
      const size = GO_STATE.boardSize;

      // 根据路数微调边距比例，保证四周边注清晰
      const padRatio = size === 19 ? 0.055 : (size === 13 ? 0.065 : 0.075);
      const padding = side * padRatio;
      const gridSpan = side - padding * 2;
      const cellSize = gridSpan / (size - 1);
      const offsetX = (w - side) / 2;
      const offsetY = (h - side) / 2;

      return { padding, cellSize, size, width: w, height: h, side, offsetX, offsetY };
    }

    function getCoord(r, c, metrics) {
      return {
        x: metrics.offsetX + metrics.padding + c * metrics.cellSize,
        y: metrics.offsetY + metrics.padding + r * metrics.cellSize
      };
    }

    function renderBoard() {
      const m = getGridMetrics();
      CTX.clearRect(0, 0, m.width, m.height);

      // 1. 拟真日式榧木纹背景 (Wood Grain Base)
      const woodGrad = CTX.createLinearGradient(0, 0, m.width, m.height);
      woodGrad.addColorStop(0, '#e5be82');
      woodGrad.addColorStop(0.5, '#dcb274');
      woodGrad.addColorStop(1, '#cca062');
      CTX.fillStyle = woodGrad;
      CTX.fillRect(0, 0, m.width, m.height);

      // 细微木质年轮浅纹
      CTX.strokeStyle = 'rgba(160, 115, 55, 0.14)';
      CTX.lineWidth = 1;
      for (let i = 0; i < m.height; i += 8) {
        CTX.beginPath();
        CTX.moveTo(0, i);
        CTX.lineTo(m.width, i + Math.sin(i * 0.07) * 3.5);
        CTX.stroke();
      }

      // 2. 网格线绘制
      CTX.strokeStyle = '#3e2712';
      CTX.lineWidth = 1.2;

      for (let i = 0; i < m.size; i++) {
        // 横线
        const pStartH = getCoord(i, 0, m);
        const pEndH = getCoord(i, m.size - 1, m);
        CTX.beginPath();
        CTX.moveTo(pStartH.x, pStartH.y);
        CTX.lineTo(pEndH.x, pEndH.y);
        CTX.stroke();

        // 竖线
        const pStartV = getCoord(0, i, m);
        const pEndV = getCoord(m.size - 1, i, m);
        CTX.beginPath();
        CTX.moveTo(pStartV.x, pStartV.y);
        CTX.lineTo(pEndV.x, pEndV.y);
        CTX.stroke();
      }

      // 外边框加粗
      const topLeft = getCoord(0, 0, m);
      const botRight = getCoord(m.size - 1, m.size - 1, m);
      CTX.lineWidth = 2.4;
      CTX.strokeRect(topLeft.x, topLeft.y, botRight.x - topLeft.x, botRight.y - topLeft.y);

      // 3. 星位绘制 (Star Points)
      const starRadius = Math.max(3, m.cellSize * 0.095);
      CTX.fillStyle = '#3e2712';
      for (const sp of getBoardStarPoints(m.size)) {
        const pt = getCoord(sp.r, sp.c, m);
        CTX.beginPath();
        CTX.arc(pt.x, pt.y, starRadius, 0, Math.PI * 2);
        CTX.fill();
      }

      // 4. 棋盘外缘坐标标注 (Coordinates A-T, 1-19)
      CTX.fillStyle = '#5a3818';
      CTX.font = `bold ${Math.max(9, m.cellSize * 0.32)}px sans-serif`;
      CTX.textAlign = 'center';
      CTX.textBaseline = 'middle';
      const colLabels = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R','S','T'];

      for (let c = 0; c < m.size; c++) {
        const p = getCoord(0, c, m);
        const label = colLabels[c];
        CTX.fillText(label, p.x, m.offsetY + m.padding * 0.44);
        CTX.fillText(label, p.x, m.offsetY + m.side - m.padding * 0.44);
      }
      for (let r = 0; r < m.size; r++) {
        const p = getCoord(r, 0, m);
        const numLabel = m.size - r;
        CTX.fillText(numLabel, m.offsetX + m.padding * 0.44, p.y);
        CTX.fillText(numLabel, m.offsetX + m.side - m.padding * 0.44, p.y);
      }

      // 5. 目数估算高亮模式 (Territory Heatmap)
      if (GO_STATE.showTerritory && GO_STATE.territoryMap) {
        for (let r = 0; r < m.size; r++) {
          for (let c = 0; c < m.size; c++) {
            const terr = GO_STATE.territoryMap[r][c];
            if (terr !== 0 && GO_STATE.board[r][c] === 0) {
              const pt = getCoord(r, c, m);
              const squareSize = m.cellSize * 0.42;
              CTX.fillStyle = terr === 1 ? 'rgba(0, 0, 0, 0.58)' : 'rgba(255, 255, 255, 0.78)';
              CTX.fillRect(pt.x - squareSize / 2, pt.y - squareSize / 2, squareSize, squareSize);
            }
          }
        }
      }

      // 6. 棋子绘制 (Stones)
      const stoneRadius = m.cellSize * 0.45;

      for (let r = 0; r < m.size; r++) {
        for (let c = 0; c < m.size; c++) {
          const color = GO_STATE.board[r][c];
          if (color !== 0) {
            drawGoStone(r, c, color, stoneRadius, m, true);
          }
        }
      }

      // 7. 最后一手标记 (Last Move Marker)
      if (GO_STATE.lastMove) {
        const lm = getCoord(GO_STATE.lastMove.r, GO_STATE.lastMove.c, m);
        const isBlack = GO_STATE.board[GO_STATE.lastMove.r][GO_STATE.lastMove.c] === 1;
        CTX.beginPath();
        CTX.arc(lm.x, lm.y, stoneRadius * 0.36, 0, Math.PI * 2);
        CTX.strokeStyle = isBlack ? '#38bdf8' : '#e11d48';
        CTX.lineWidth = 2.4;
        CTX.stroke();
      }

      // 8. 十字准星与磁吸预览 (Laser Reticle & Snap Ghost Preview)
      if (GO_STATE.hoverPoint && !GO_STATE.gameOver) {
        drawTargetReticle(GO_STATE.hoverPoint.r, GO_STATE.hoverPoint.c, m);
      }

      // 9. 更新 HUD 坐标浮标
      updateCoordHud();
    }

    // 绘制高精十字准星、激光瞄准框与磁吸预览
    function drawTargetReticle(r, c, m) {
      if (GO_STATE.gameOver || GO_STATE.isAiComputing) return;
      if (GO_STATE.gameMode === 'AI' && GO_STATE.turn !== GO_STATE.userColor) return;
      if (GO_STATE.gameMode === 'ONLINE') {
        if (!GO_STATE.online.opponentJoined || GO_STATE.turn !== GO_STATE.online.myColor) return;
      }

      const pt = getCoord(r, c, m);
      const stoneRadius = m.cellSize * 0.45;
      const legality = checkMoveLegality(r, c, GO_STATE.turn, GO_STATE.board, GO_STATE.koPoint);

      CTX.save();
      if (legality.valid) {
        // 1. 水平与垂直激光准星辐射线
        CTX.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        CTX.lineWidth = 1.4;
        CTX.setLineDash([4, 4]);

        CTX.beginPath();
        CTX.moveTo(pt.x - m.cellSize * 1.5, pt.y);
        CTX.lineTo(pt.x + m.cellSize * 1.5, pt.y);
        CTX.stroke();

        CTX.beginPath();
        CTX.moveTo(pt.x, pt.y - m.cellSize * 1.5);
        CTX.lineTo(pt.x, pt.y + m.cellSize * 1.5);
        CTX.stroke();
        CTX.setLineDash([]);

        // 2. 四角锁定瞄准边框
        const bSize = m.cellSize * 0.38;
        const bGap = m.cellSize * 0.12;
        CTX.strokeStyle = '#38bdf8';
        CTX.lineWidth = 2;

        // 左上角
        CTX.beginPath();
        CTX.moveTo(pt.x - bSize, pt.y - bSize + bGap);
        CTX.lineTo(pt.x - bSize, pt.y - bSize);
        CTX.lineTo(pt.x - bSize + bGap, pt.y - bSize);
        CTX.stroke();
        // 右上角
        CTX.beginPath();
        CTX.moveTo(pt.x + bSize - bGap, pt.y - bSize);
        CTX.lineTo(pt.x + bSize, pt.y - bSize);
        CTX.lineTo(pt.x + bSize, pt.y - bSize + bGap);
        CTX.stroke();
        // 左下角
        CTX.beginPath();
        CTX.moveTo(pt.x - bSize, pt.y + bSize - bGap);
        CTX.lineTo(pt.x - bSize, pt.y + bSize);
        CTX.lineTo(pt.x - bSize + bGap, pt.y + bSize);
        CTX.stroke();
        // 右下角
        CTX.beginPath();
        CTX.moveTo(pt.x + bSize - bGap, pt.y + bSize);
        CTX.lineTo(pt.x + bSize, pt.y + bSize);
        CTX.lineTo(pt.x + bSize, pt.y + bSize - bGap);
        CTX.stroke();

        // 3. 悬浮半透明落子预览 (Ghost Stone)
        CTX.globalAlpha = 0.65;
        drawGoStone(r, c, GO_STATE.turn, stoneRadius, m, false);
        CTX.globalAlpha = 1.0;

        // 4. 提子预警高亮 (Highlight opponent stones about to be captured)
        if (legality.captures && legality.captures.length > 0) {
          for (const s of legality.captures) {
            const captPt = getCoord(s.r, s.c, m);
            CTX.beginPath();
            CTX.arc(captPt.x, captPt.y, stoneRadius * 1.08, 0, Math.PI * 2);
            CTX.strokeStyle = '#f59e0b';
            CTX.lineWidth = 2.6;
            CTX.stroke();
          }
        }
      } else {
        if (GO_STATE.board[r][c] !== 0) {
          // 已有子
          CTX.beginPath();
          CTX.arc(pt.x, pt.y, stoneRadius * 1.06, 0, Math.PI * 2);
          CTX.strokeStyle = 'rgba(239, 68, 68, 0.45)';
          CTX.lineWidth = 2;
          CTX.stroke();
        } else {
          // 自杀或打劫禁着点
          CTX.strokeStyle = '#ef4444';
          CTX.lineWidth = 2;
          const bSize = m.cellSize * 0.35;
          CTX.beginPath();
          CTX.arc(pt.x, pt.y, bSize, 0, Math.PI * 2);
          CTX.stroke();
          CTX.beginPath();
          CTX.moveTo(pt.x - bSize * 0.7, pt.y - bSize * 0.7);
          CTX.lineTo(pt.x + bSize * 0.7, pt.y + bSize * 0.7);
          CTX.stroke();
        }
      }
      CTX.restore();
    }

    // 逼真黑白棋子立体绘制 (Yunzi / Kaya 质感)
    function drawGoStone(r, c, color, radius, m, drawShadow = true) {
      const pt = getCoord(r, c, m);

      // 棋子立体柔和投影
      if (drawShadow) {
        CTX.save();
        CTX.beginPath();
        CTX.arc(pt.x + radius * 0.12, pt.y + radius * 0.14, radius, 0, Math.PI * 2);
        CTX.fillStyle = 'rgba(0, 0, 0, 0.4)';
        CTX.filter = 'blur(2px)';
        CTX.fill();
        CTX.restore();
      }

      // 棋子本体
      CTX.beginPath();
      CTX.arc(pt.x, pt.y, radius, 0, Math.PI * 2);

      if (color === 1) {
        // 墨玉黑棋 (细腻润泽光影)
        const grad = CTX.createRadialGradient(
          pt.x - radius * 0.32, pt.y - radius * 0.36, radius * 0.08,
          pt.x, pt.y, radius
        );
        grad.addColorStop(0, '#596575');
        grad.addColorStop(0.35, '#222831');
        grad.addColorStop(0.85, '#0b0f14');
        grad.addColorStop(1, '#05070a');
        CTX.fillStyle = grad;
        CTX.fill();
        CTX.strokeStyle = 'rgba(15, 23, 42, 0.9)';
        CTX.lineWidth = 0.8;
        CTX.stroke();
      } else {
        // 羊脂白玉棋子 (温润乳白)
        const grad = CTX.createRadialGradient(
          pt.x - radius * 0.32, pt.y - radius * 0.36, radius * 0.08,
          pt.x, pt.y, radius
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.6, '#f3f6f9');
        grad.addColorStop(0.9, '#cbd5e1');
        grad.addColorStop(1, '#94a3b8');
        CTX.fillStyle = grad;
        CTX.fill();
        CTX.strokeStyle = 'rgba(148, 163, 184, 0.8)';
        CTX.lineWidth = 0.8;
        CTX.stroke();
      }
    }

    // 提子飘字特效
    function spawnCaptureText(r, c, text) {
      const box = document.getElementById('board-box');
      if (!box) return;
      const m = getGridMetrics();
      const pt = getCoord(r, c, m);
      const el = document.createElement('div');
      el.className = 'capture-floating-text';
      el.textContent = text;
      el.style.left = `${pt.x}px`;
      el.style.top = `${pt.y}px`;
      box.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    function updateCoordHud() {
      const hud = document.getElementById('board-coord-hud');
      if (!hud) return;
      if (GO_STATE.hoverPoint && !GO_STATE.gameOver) {
        const { r, c } = GO_STATE.hoverPoint;
        const coord = getCoordName(r, c);
        const check = checkMoveLegality(r, c, GO_STATE.turn, GO_STATE.board, GO_STATE.koPoint);
        if (!check.valid) {
          hud.innerHTML = `<span style="color:#f87171">⛔ ${coord} (${check.reason || '禁着点'})</span>`;
        } else if (check.captures && check.captures.length > 0) {
          hud.innerHTML = `<span style="color:#f59e0b">⚔️ ${coord} (提吃 ${check.captures.length} 子)</span>`;
        } else {
          hud.innerHTML = `<span style="color:#38bdf8">🎯 ${coord}</span>`;
        }
        hud.classList.add('visible');
      } else if (GO_STATE.lastMove) {
        hud.innerHTML = `<span style="color:#94a3b8">最后一手: <b style="color:#f8fafc">${getCoordName(GO_STATE.lastMove.r, GO_STATE.lastMove.c)}</b></span>`;
        hud.classList.add('visible');
      } else {
        hud.classList.remove('visible');
      }
    }

    // ==========================================================================
    // 7. 触控与鼠标事件侦听 (高精度投影与磁吸判定)
    // ==========================================================================
    function getBoardPosFromEvent(e) {
      const rect = CANVAS.getBoundingClientRect();
      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const m = getGridMetrics();

      const col = Math.round((x - m.offsetX - m.padding) / m.cellSize);
      const row = Math.round((y - m.offsetY - m.padding) / m.cellSize);

      if (row >= 0 && row < m.size && col >= 0 && col < m.size) {
        const pt = getCoord(row, col, m);
        const dist = Math.hypot(x - pt.x, y - pt.y);
        // 磁吸吸附判定阈值：65% cell 宽度，触控与鼠标均极为灵敏
        if (dist <= m.cellSize * 0.65) {
          return { r: row, c: col, dist };
        }
      }
      return null;
    }

    CANVAS.addEventListener('touchstart', (e) => {
      touchHandledTimestamp = Date.now();
      const pos = getBoardPosFromEvent(e);
      GO_STATE.hoverPoint = pos;
      renderBoard();
      e.preventDefault();
    }, { passive: false });

    CANVAS.addEventListener('touchmove', (e) => {
      touchHandledTimestamp = Date.now();
      const pos = getBoardPosFromEvent(e);
      GO_STATE.hoverPoint = pos;
      renderBoard();
      e.preventDefault();
    }, { passive: false });

    CANVAS.addEventListener('touchend', (e) => {
      touchHandledTimestamp = Date.now();
      if (GO_STATE.hoverPoint) {
        const { r, c } = GO_STATE.hoverPoint;
        GO_STATE.hoverPoint = null;
        playStone(r, c);
      }
      e.preventDefault();
    }, { passive: false });

    CANVAS.addEventListener('touchcancel', () => {
      GO_STATE.hoverPoint = null;
      renderBoard();
    });

    CANVAS.addEventListener('mousemove', (e) => {
      if (Date.now() - touchHandledTimestamp < 600) return;
      const pos = getBoardPosFromEvent(e);
      GO_STATE.hoverPoint = pos;
      renderBoard();
    });

    CANVAS.addEventListener('mouseleave', () => {
      GO_STATE.hoverPoint = null;
      renderBoard();
    });

    CANVAS.addEventListener('click', (e) => {
      if (Date.now() - touchHandledTimestamp < 600) return;
      const pos = getBoardPosFromEvent(e);
      if (pos) {
        GO_STATE.hoverPoint = null;
        playStone(pos.r, pos.c);
      }
    });

    // ==========================================================================
    // 8. 交互控制与界面更新
    // ==========================================================================
    function updateUI() {
      const cardP1 = document.getElementById('card-p1');
      const cardP2 = document.getElementById('card-p2');
      const capsP1 = document.getElementById('caps-p1');
      const capsP2 = document.getElementById('caps-p2');
      const btnUndo = document.getElementById('btn-undo');
      const nameP1 = document.getElementById('name-p1');
      const nameP2 = document.getElementById('name-p2');
      const turnBadgeP1 = document.getElementById('turn-badge-p1');
      const turnBadgeP2 = document.getElementById('turn-badge-p2');
      const statusIcon = document.getElementById('status-icon');
      const statusText = document.getElementById('status-text');

      if (cardP1) cardP1.classList.toggle('active-turn', GO_STATE.turn === 1 && !GO_STATE.gameOver);
      if (cardP2) cardP2.classList.toggle('active-turn', GO_STATE.turn === 2 && !GO_STATE.gameOver);

      if (capsP1) capsP1.textContent = GO_STATE.captures[1];
      if (capsP2) capsP2.textContent = GO_STATE.captures[2];

      if (turnBadgeP1) turnBadgeP1.textContent = (GO_STATE.turn === 1 && !GO_STATE.gameOver) ? '落子中' : '等待';
      if (turnBadgeP2) turnBadgeP2.textContent = (GO_STATE.turn === 2 && !GO_STATE.gameOver) ? '落子中' : '等待';

      // 玩家角色与称号定制
      if (GO_STATE.gameMode === 'AI') {
        if (nameP1) nameP1.textContent = '玩家 (执黑)';
        if (nameP2) nameP2.textContent = '电脑 (AI · 执白)';
      } else if (GO_STATE.gameMode === 'ONLINE') {
        if (GO_STATE.online.myRole === 'host') {
          if (nameP1) nameP1.textContent = '房主 (执黑·你)';
          if (nameP2) nameP2.textContent = GO_STATE.online.opponentJoined ? '好友 (执白·在线)' : '好友 (执白·等待加入)';
        } else {
          if (nameP1) nameP1.textContent = '房主 (执黑·在线)';
          if (nameP2) nameP2.textContent = '客方 (执白·你)';
        }
      } else {
        if (nameP1) nameP1.textContent = '玩家 1 (黑棋)';
        if (nameP2) nameP2.textContent = '玩家 2 (白棋)';
      }

      // 状态横幅更新
      if (statusIcon && statusText) {
        if (GO_STATE.gameOver) {
          statusIcon.textContent = '🏁';
          statusText.textContent = `对局已结束 · ${GO_STATE.winner ? GO_STATE.winner + '胜出' : '终盘裁定'}`;
        } else if (GO_STATE.gameMode === 'ONLINE') {
          if (!GO_STATE.online.opponentJoined) {
            statusIcon.textContent = '⏳';
            statusText.textContent = '房间已创建，等待好友输入房间号或点击链接加入...';
          } else {
            const isMyTurn = GO_STATE.turn === GO_STATE.online.myColor;
            statusIcon.textContent = GO_STATE.turn === 1 ? '⚫' : '⚪';
            statusText.textContent = isMyTurn ?
              `轮到你落子 (${GO_STATE.online.myColor === 1 ? '黑棋' : '白棋'})` :
              `等待对方落子 (${GO_STATE.online.myColor === 1 ? '白方思考中' : '黑方思考中'})...`;
          }
        } else if (GO_STATE.gameMode === 'AI') {
          if (GO_STATE.turn === 1) {
            statusIcon.textContent = '⚫';
            statusText.textContent = '轮到你的回合 (执黑落子)';
          } else {
            statusIcon.textContent = '⚙️';
            statusText.textContent = 'AI 深度演算思考中...';
          }
        } else {
          statusIcon.textContent = GO_STATE.turn === 1 ? '⚫' : '⚪';
          statusText.textContent = `轮到 ${GO_STATE.turn === 1 ? '黑方' : '白方'} 落子`;
        }
      }

      if (btnUndo) {
        btnUndo.disabled = GO_STATE.gameMode === 'ONLINE' || GO_STATE.history.length === 0 || GO_STATE.isAiComputing || GO_STATE.gameOver;
      }
    }

    function changeBoardSize(size, broadcast = true) {
      if (GO_STATE.boardSize === size) return;
      if (GO_STATE.gameMode === 'ONLINE' && broadcast) {
        if (GO_STATE.online.myRole !== 'host') {
          showToast('⚠️ 联机模式下仅房主有权更改棋盘尺寸');
          return;
        }
      }

      GO_STATE.boardSize = size;
      updateBoardSizePill(size);

      if (window.AUDIO) try { window.AUDIO.play('click'); } catch(e) {}
      showToast(`🔲 已切换为 ${size}×${size} 棋盘`);
      resetCurrentGame(broadcast);
    }

    function updateBoardSizePill(size) {
      ['size-9', 'size-13', 'size-19'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active');
      });
      const activeBtn = document.getElementById(`size-${size}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function changeAiDifficulty(diff) {
      GO_STATE.aiDifficulty = diff;
      ['diff-easy', 'diff-tactical', 'diff-master'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active');
      });
      const map = { 'EASY': 'diff-easy', 'TACTICAL': 'diff-tactical', 'MASTER': 'diff-master' };
      const btn = document.getElementById(map[diff]);
      if (btn) btn.classList.add('active');

      if (window.AUDIO) try { window.AUDIO.play('click'); } catch(e) {}
      const labels = { 'EASY': '入门', 'TACTICAL': '进阶', 'MASTER': '大师(MCTS)' };
      showToast(`🤖 AI 难度切换为：【${labels[diff]}】`);
    }

    function switchGameMode(mode, autoCreateRoom = true) {
      GO_STATE.gameMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${mode.toLowerCase()}`);
      if (activeTab) activeTab.classList.add('active');

      const onlinePanel = document.getElementById('online-panel');
      const aiWrapper = document.getElementById('ai-difficulty-wrapper');

      if (onlinePanel) {
        onlinePanel.style.display = mode === 'ONLINE' ? 'flex' : 'none';
      }
      if (aiWrapper) {
        aiWrapper.style.display = mode === 'AI' ? 'flex' : 'none';
      }

      if (mode === 'ONLINE') {
        if (window.ONLINE_NETWORK && autoCreateRoom) {
          if (!ONLINE_NETWORK.state.roomId) {
            ONLINE_NETWORK.createRoom('GO');
            GO_STATE.online.myRole = 'host';
            GO_STATE.online.myColor = 1;
            GO_STATE.online.opponentJoined = false;
          }
        }
      }

      if (window.AUDIO) try { window.AUDIO.play('click'); } catch(e) {}
      resetCurrentGame(false);
    }

    function resetCurrentGame(broadcast = true) {
      const size = GO_STATE.boardSize;
      GO_STATE.board = Array(size).fill(0).map(() => Array(size).fill(0));
      GO_STATE.turn = 1; // 黑先
      GO_STATE.captures = { 1: 0, 2: 0 };
      GO_STATE.lastMove = null;
      GO_STATE.history = [];
      GO_STATE.koPoint = null;
      GO_STATE.passCount = 0;
      GO_STATE.gameOver = false;
      GO_STATE.winner = null;
      GO_STATE.showTerritory = false;
      GO_STATE.isAiComputing = false;
      GO_STATE.territoryMap = null;
      GO_STATE.hoverPoint = null;

      const ind = document.getElementById('ai-thinking-indicator');
      if (ind) ind.classList.remove('show');
      const terrBtn = document.getElementById('btn-territory');
      if (terrBtn) terrBtn.classList.remove('active-toggle');

      if (broadcast && GO_STATE.gameMode === 'ONLINE') {
        sendOnlineAction({
          type: 'GO_RESTART',
          boardSize: GO_STATE.boardSize
        });
      }

      updateUI();
      renderBoard();
    }

    // ==========================================================================
    // 9. 联机协同中枢 (MQTT MULTIPLAYER SUITE)
    // ==========================================================================
    function sendOnlineAction(data) {
      const net = (typeof window !== 'undefined' && window.ONLINE_NETWORK) ? window.ONLINE_NETWORK : (typeof ONLINE_NETWORK !== 'undefined' ? ONLINE_NETWORK : null);
      if (net && GO_STATE.gameMode === 'ONLINE') {
        net.sendAction(data);
      }
    }

    function createOnlineRoom() {
      if (window.ONLINE_NETWORK) {
        ONLINE_NETWORK.createRoom('GO');
        GO_STATE.online.myRole = 'host';
        GO_STATE.online.myColor = 1;
        GO_STATE.online.opponentJoined = false;
        resetCurrentGame(false);
      }
    }

    function copyOnlineLink() {
      if (window.ONLINE_NETWORK) {
        ONLINE_NETWORK.copyLink();
      }
    }

    function joinOnlineRoomPrompt() {
      showModal('🔗 输入房间号加入对局', `
        <div style="display:flex; flex-direction:column; gap:14px; align-items:center; padding:10px 0;">
          <p style="color:#94a3b8; font-size:0.92rem; text-align:center;">
            请输入好友分享的 4 位或 6 位房间号进入同一对局：
          </p>
          <input type="text" id="input-room-code" maxlength="8" placeholder="例如: 8848"
            style="width:200px; text-align:center; font-size:1.6rem; letter-spacing:4px; font-weight:800; padding:8px 12px; border-radius:8px; background:rgba(15,23,42,0.9); border:2px solid #38bdf8; color:#fff; outline:none;" />
          <button class="btn-small" style="padding:10px 24px; font-size:0.95rem; background:linear-gradient(135deg,#2563eb,#1d4ed8); border:none; border-radius:8px; font-weight:700; cursor:pointer;" onclick="submitJoinRoomFromModal()">
            🚀 进入对战
          </button>
        </div>
      `);
      setTimeout(() => {
        const input = document.getElementById('input-room-code');
        if (input) {
          input.focus();
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitJoinRoomFromModal();
          });
        }
      }, 100);
    }

    function submitJoinRoomFromModal() {
      const input = document.getElementById('input-room-code');
      if (!input) return;
      const code = input.value.trim();
      if (!code) {
        showToast('⚠️ 请输入有效的房间号');
        return;
      }
      closeModal();
      switchGameMode('ONLINE', false);
      if (window.ONLINE_NETWORK) {
        ONLINE_NETWORK.joinRoom(code, 'GO');
        GO_STATE.online.roomId = code;
        GO_STATE.online.myRole = 'guest';
        GO_STATE.online.myColor = 2; // 客方执白
      }
    }

    function initOnlineMultiplayer() {
      if (!window.ONLINE_NETWORK) return;

      ONLINE_NETWORK.setRoleChangeHandler((role) => {
        GO_STATE.online.myRole = role;
        GO_STATE.online.myColor = (role === 'host') ? 1 : 2; // 房主执黑(1)，客方执白(2)
        GO_STATE.online.connected = true;
        GO_STATE.online.roomId = ONLINE_NETWORK.state.roomId;

        const dot = document.getElementById('online-dot');
        const statusText = document.getElementById('online-status-text');
        if (dot) dot.className = 'online-dot ' + (GO_STATE.online.opponentJoined ? 'connected' : 'waiting');
        if (statusText) statusText.textContent = GO_STATE.online.opponentJoined ? '对战就绪' : '等待好友加入';

        if (role === 'guest') {
          // 客方进房后主动发送请求同步消息，确保房主即时全量推送盘面
          sendOnlineAction({ type: 'GO_REQUEST_SYNC' });
        }

        updateUI();
        renderBoard();
      });

      ONLINE_NETWORK.setOpponentJoinedHandler((msg) => {
        GO_STATE.online.opponentJoined = true;
        const dot = document.getElementById('online-dot');
        const statusText = document.getElementById('online-status-text');
        if (dot) dot.className = 'online-dot connected';
        if (statusText) statusText.textContent = '对战进行中';

        showToast('🎉 好友已进入房间！对战正式开始，你执黑先行！', 3000);
        updateUI();
        renderBoard();

        // 房主向客方全量广播当前盘面
        sendOnlineAction({
          type: 'GO_SYNC',
          boardSize: GO_STATE.boardSize,
          board: GO_STATE.board,
          turn: GO_STATE.turn,
          captures: GO_STATE.captures,
          koPoint: GO_STATE.koPoint,
          passCount: GO_STATE.passCount,
          gameOver: GO_STATE.gameOver,
          lastMove: GO_STATE.lastMove
        });
      });

      ONLINE_NETWORK.setMessageHandler((msg) => {
        if (!msg || !msg.type) return;

        if (msg.type === 'GO_MOVE') {
          if (msg.boardSize && msg.boardSize !== GO_STATE.boardSize) {
            GO_STATE.boardSize = msg.boardSize;
            updateBoardSizePill(msg.boardSize);
            resizeCanvas();
          }
          if (GO_STATE.turn === msg.player) {
            const check = checkMoveLegality(msg.r, msg.c, msg.player, GO_STATE.board, GO_STATE.koPoint);
            if (check.valid) {
              executeMove(msg.r, msg.c, check.captures, check.newKo, false);
              const coordName = getCoordName(msg.r, msg.c);
              showToast(`对方落子：${coordName}`);
            }
          }
        } else if (msg.type === 'GO_PASS') {
          if (GO_STATE.turn === msg.player) {
            passTurn(false, false);
          }
        } else if (msg.type === 'GO_RESIGN') {
          resignGame(false);
        } else if (msg.type === 'GO_RESTART') {
          if (msg.boardSize && msg.boardSize !== GO_STATE.boardSize) {
            GO_STATE.boardSize = msg.boardSize;
            updateBoardSizePill(msg.boardSize);
            resizeCanvas();
          }
          resetCurrentGame(false);
          showToast('🔄 对方重置了棋盘，新对局开始！');
        } else if (msg.type === 'GO_REQUEST_SYNC') {
          if (GO_STATE.online.myRole === 'host') {
            GO_STATE.online.opponentJoined = true;
            sendOnlineAction({
              type: 'GO_SYNC',
              boardSize: GO_STATE.boardSize,
              board: GO_STATE.board,
              turn: GO_STATE.turn,
              captures: GO_STATE.captures,
              koPoint: GO_STATE.koPoint,
              passCount: GO_STATE.passCount,
              gameOver: GO_STATE.gameOver,
              lastMove: GO_STATE.lastMove
            });
            updateUI();
            renderBoard();
          }
        } else if (msg.type === 'GO_SYNC') {
          if (msg.boardSize && msg.boardSize !== GO_STATE.boardSize) {
            GO_STATE.boardSize = msg.boardSize;
            updateBoardSizePill(msg.boardSize);
          }
          GO_STATE.board = msg.board;
          GO_STATE.turn = msg.turn;
          GO_STATE.captures = msg.captures || { 1: 0, 2: 0 };
          GO_STATE.koPoint = msg.koPoint;
          GO_STATE.passCount = msg.passCount || 0;
          GO_STATE.gameOver = !!msg.gameOver;
          GO_STATE.lastMove = msg.lastMove;
          GO_STATE.online.opponentJoined = true;

          const dot = document.getElementById('online-dot');
          const statusText = document.getElementById('online-status-text');
          if (dot) dot.className = 'online-dot connected';
          if (statusText) statusText.textContent = '已同步房主盘面';

          updateUI();
          resizeCanvas();
          showToast('🤝 已成功同步房主棋局！', 2000);
        }
      });
    }

    // ==========================================================================
    // 10. 初始化与生命周期
    // ==========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("⚪⚫ 玄素围棋对弈规则", `
        <p><strong>基本落子：</strong>黑先白后，双方轮流落子在棋盘网格交叉点上。</p><br>
        <p><strong>气与提子：</strong>与棋子紧邻的空交叉点为"气"。当某块棋的气被对方全部封堵（气数为 0）时，该棋块立即被提吃。</p><br>
        <p><strong>禁着点与打劫：</strong>禁止无气自杀；单子互提时触发"劫争（Ko Rule）"，禁止立即回提，必须先在别处落子（寻劫）。</p><br>
        <p><strong>胜负判定：</strong>双方连续"停一手"则终盘数子，占领交叉点与提子数多者获胜！</p>
      `, resetCurrentGame);

      initOnlineMultiplayer();

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      const modeParam = urlParams.get('mode');

      if (roomParam) {
        switchGameMode('ONLINE', false);
        if (window.ONLINE_NETWORK) {
          ONLINE_NETWORK.joinRoom(roomParam.trim(), 'GO');
          GO_STATE.online.roomId = roomParam.trim();
          GO_STATE.online.myRole = 'guest';
          GO_STATE.online.myColor = 2; // Guest is White
        }
      } else if (modeParam === 'ONLINE') {
        switchGameMode('ONLINE', true);
      } else {
        resetCurrentGame();
      }

      window.addEventListener('resize', resizeCanvas);
      setTimeout(resizeCanvas, 60);
    });
  </script>
</body>
</html>
