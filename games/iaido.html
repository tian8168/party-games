<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拔刀居合斩 (Iaido Slash) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    /* ==========================================================================
       1. 拔刀居合斩 (IAIDO) 样式
       ========================================================================== */
    #iaido-stage {
      width: 100%;
      height: 440px;
      position: relative;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #09090b 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      cursor: pointer;
    }

    .iaido-hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .iaido-life-box {
      display: flex;
      gap: 4px;
      font-size: 1.1rem;
    }

    .iaido-center-zone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    .iaido-moon {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.2) 0%, rgba(254, 240, 138, 0.02) 70%, transparent 100%);
      border: 1px solid rgba(254, 240, 138, 0.2);
      position: absolute;
      animation: moonPulse 3s infinite ease-in-out;
    }
    @keyframes moonPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    .iaido-state-text {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #cbd5e1;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      z-index: 6;
    }

    .iaido-sub-text {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      z-index: 6;
    }

    .iaido-duelists {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px 20px;
      position: relative;
      z-index: 4;
    }

    .duelist-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .duelist-svg {
      width: 90px;
      height: 110px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
      transition: transform 0.15s ease-out;
    }

    .duelist-name {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .iaido-slash-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(239, 68, 68, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }

    .iaido-kanji {
      font-size: 6.5rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 30px #ffffff, 0 0 60px #ff0000;
      animation: kanjiBlast 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    @keyframes kanjiBlast {
      0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .iaido-slash-line {
      position: absolute;
      top: 50%;
      left: -20%;
      width: 140%;
      height: 5px;
      background: linear-gradient(90deg, transparent, #fff, #ef4444, transparent);
      box-shadow: 0 0 25px #fff;
      transform: rotate(-25deg);
      display: none;
      z-index: 25;
      pointer-events: none;
    }

    /* 双人触控区与提示 */
    .iaido-touch-zones {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      z-index: 30;
    }
    .iaido-touch-half {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background 0.12s;
    }
    .iaido-touch-half:active {
      background: rgba(255, 255, 255, 0.08);
    }
    .touch-hint-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .iaido-touch-half.p1 .touch-hint-tag {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .iaido-touch-half.p2 .touch-hint-tag {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>
  <div class="container in-game">
    <div class="game-header">
      <a href="../index.html" class="nav-back">🔙 返回大厅</a>
      <h2 class="game-title">⚡ 拔刀居合斩 (Iaido Slash)</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-sound-toggle">🔊</button>
        <button class="btn-icon" id="btn-rules-header">📖 规则</button>
        <button class="btn-icon" id="restart-btn">🔄 重置</button>
      </div>
    </div>

    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对弈</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 双人同屏</div>
    </div>
    
    <div class="generic-scoreboard" id="generic-scoreboard">
      <div class="player-card p1 active-turn" id="card-p1">
        <div class="player-meta">
          <span class="player-name" id="name-p1">🔴 剑客 P1</span>
          <span class="turn-badge">准备出刀</span>
        </div>
      </div>
      <div class="player-card p2" id="card-p2">
        <div class="player-meta">
          <span class="player-name" id="name-p2">🔵 剑客 P2</span>
          <span class="turn-badge">准备出刀</span>
        </div>
      </div>
    </div>

    <div class="stage-wrapper">
      <div id="iaido-stage">
          <!-- 双人专属触控区 (移动端左半屏P1 / 右半屏P2) -->
          <div class="iaido-touch-zones" id="iaido-touch-zones">
            <div class="iaido-touch-half p1" id="iaido-touch-p1">
              <span class="touch-hint-tag" id="hint-p1-tag">🔴 P1 (按 A / 空格)</span>
            </div>
            <div class="iaido-touch-half p2" id="iaido-touch-p2">
              <span class="touch-hint-tag" id="hint-p2-tag">🔵 P2 (按 L / 回车)</span>
            </div>
          </div>
          <div class="iaido-hud-top">
            <div class="duelist-box">
              <span class="duelist-name" style="color:#ef4444;" id="iaido-p1-name">🔴 剑客P1</span>
              <div class="iaido-life-box" id="iaido-p1-life">⚔️⚔️⚔️</div>
            </div>
            <div style="font-size:0.8rem; color:#94a3b8;" id="iaido-round-badge">第 1 回合 (抢3胜)</div>
            <div class="duelist-box">
              <span class="duelist-name" style="color:#38bdf8;" id="iaido-p2-name">🔵 剑客P2</span>
              <div class="iaido-life-box" id="iaido-p2-life">⚔️⚔️⚔️</div>
            </div>
          </div>

          <div class="iaido-center-zone">
            <div class="iaido-moon"></div>
            <div class="iaido-state-text" id="iaido-prompt">心如止水... 伺机而动</div>
            <div class="iaido-sub-text" id="iaido-sub-prompt">出现「斬」字瞬间点击屏幕</div>
          </div>

          <div class="iaido-duelists">
            <svg class="duelist-svg" id="iaido-p1-svg" viewBox="0 0 100 120">
              <circle cx="50" cy="30" r="14" fill="#ef4444"/>
              <path d="M 50 44 L 50 90 L 35 115 M 50 90 L 65 115" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
              <path d="M 50 55 L 75 75 L 88 50" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
              <!-- 太刀 -->
              <line x1="88" y1="50" x2="105" y2="15" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <svg class="duelist-svg" id="iaido-p2-svg" viewBox="0 0 100 120" style="transform: scaleX(-1);">
              <circle cx="50" cy="30" r="14" fill="#38bdf8"/>
              <path d="M 50 44 L 50 90 L 35 115 M 50 90 L 65 115" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
              <path d="M 50 55 L 75 75 L 88 50" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
              <!-- 太刀 -->
              <line x1="88" y1="50" x2="105" y2="15" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="iaido-slash-overlay" id="iaido-slash-overlay">
            <div class="iaido-kanji">斬</div>
          </div>
          <div class="iaido-slash-line" id="iaido-slash-line"></div>
        </div>
    </div>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script>
    
    // 基础游戏运行时状态
    const STATE = {
      currentView: 'GAME',
      currentGame: 'IAIDO',
      gameMode: 'AI',
      turn: 1,
      scores: { 1: 0, 2: 0, 3: 0, 4: 0 },
      online: {
        connected: false,
        roomId: null,
        myRole: 'host',
        opponentJoined: false,
        mqttClient: null
      }
    };

    STATE.iaido = {
        state: 'IDLE', p1Wins: 0, p2Wins: 0, targetWins: 3, timer: null, aiTimer: null, roundTimer: null, modalTimer: null, signalTime: 0, roundNum: 1
      };

    function checkIsMyTurn() {
      if (STATE.gameMode === 'LOCAL') return true;
      if (STATE.gameMode === 'AI') return STATE.turn === 1;
      if (STATE.gameMode === 'ONLINE') {
        if (STATE.online.myRole === 'host' && STATE.turn === 1) return true;
        if (STATE.online.myRole === 'guest' && STATE.turn === 2) return true;
        return false;
      }
      return true;
    }

    function updateScoreboard() {
      const cardP1 = document.getElementById('card-p1');
      const cardP2 = document.getElementById('card-p2');
      if (cardP1) {
        const n1 = document.getElementById('name-p1');
        if (n1) n1.innerHTML = '🔴 剑客 P1' + (STATE.iaido ? ' <small>('+STATE.iaido.p1Wins+'胜)</small>' : '');
      }
      if (cardP2) {
        const n2 = document.getElementById('name-p2');
        if (n2) {
          const p2Label = STATE.gameMode === 'AI' ? '🤖 电脑 (AI)' : '🔵 剑客 P2';
          n2.innerHTML = p2Label + (STATE.iaido ? ' <small>('+STATE.iaido.p2Wins+'胜)</small>' : '');
        }
      }
    }

    function switchGameMode(mode, doReset = true) {
      STATE.gameMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab-' + mode.toLowerCase());
      if (activeTab) activeTab.classList.add('active');

      const onlinePanel = document.getElementById('online-panel');
      if (onlinePanel) {
        onlinePanel.style.display = mode === 'ONLINE' ? 'flex' : 'none';
        if (mode === 'ONLINE' && window.ONLINE_NETWORK) {
          ONLINE_NETWORK.createRoom(STATE.currentGame);
        }
      }
      updateScoreboard();
      if (doReset && typeof resetCurrentGame === 'function') {
        resetCurrentGame();
      }
    }

    function sendOnlineAction(data) {
      if (window.ONLINE_NETWORK) {
        window.ONLINE_NETWORK.sendAction(data);
      }
    }
  

    // 7. 拔刀居合斩核心逻辑 (IAIDO)
    // ==========================================================================
    function initIaidoGame() {
      if (STATE.iaido.modalTimer) clearTimeout(STATE.iaido.modalTimer);
      if (STATE.iaido.timer) clearTimeout(STATE.iaido.timer);
      if (STATE.iaido.aiTimer) clearTimeout(STATE.iaido.aiTimer);
      if (STATE.iaido.roundTimer) clearTimeout(STATE.iaido.roundTimer);
      STATE.iaido.p1Wins = 0;
      STATE.iaido.p2Wins = 0;
      STATE.iaido.roundNum = 1;
      STATE.iaido.state = 'IDLE';
      updateIaidoHUD();
      startIaidoRound();
    }

    function updateIaidoHUD() {
      const p1Hearts = '⚔️'.repeat(STATE.iaido.p1Wins) + '⚪'.repeat(Math.max(0, 3 - STATE.iaido.p1Wins));
      const p2Hearts = '⚔️'.repeat(STATE.iaido.p2Wins) + '⚪'.repeat(Math.max(0, 3 - STATE.iaido.p2Wins));
      document.getElementById('iaido-p1-life').textContent = p1Hearts;
      document.getElementById('iaido-p2-life').textContent = p2Hearts;
      document.getElementById('iaido-round-badge').textContent = `第 ${STATE.iaido.roundNum} 回合 (抢3胜)`;

      const p2Name = document.getElementById('iaido-p2-name');
      if (p2Name) {
        p2Name.textContent = STATE.gameMode === 'AI' ? '🔵 恶魔AI' : '🔵 剑客P2';
      }

      const hintP1 = document.getElementById('hint-p1-tag');
      const hintP2 = document.getElementById('hint-p2-tag');
      if (hintP1) {
        hintP1.textContent = STATE.gameMode === 'AI' ? '🔴 出刀区 (点击 / 空格)' : '🔴 P1 (按 A / 空格)';
      }
      if (hintP2) {
        hintP2.textContent = STATE.gameMode === 'AI' ? '🤖 电脑对手' : '🔵 P2 (按 L / 回车)';
      }

      updateScoreboard();
    }

    function startIaidoRound() {
      if (STATE.iaido.timer) clearTimeout(STATE.iaido.timer);
      if (STATE.iaido.aiTimer) clearTimeout(STATE.iaido.aiTimer);
      if (STATE.iaido.roundTimer) clearTimeout(STATE.iaido.roundTimer);
      STATE.iaido.state = 'WAITING';
      document.getElementById('iaido-slash-overlay').style.display = 'none';
      document.getElementById('iaido-slash-line').style.display = 'none';
      document.getElementById('iaido-prompt').textContent = '心如止水... 伺机而动';
      document.getElementById('iaido-sub-prompt').textContent = STATE.gameMode === 'AI'
        ? '屏息凝神！出现「斬」字瞬间触碰屏幕或按空格'
        : '屏息凝神！出现「斬」字瞬间出刀！P1: A/空格，P2: L/回车';

      AUDIO.play('heartbeat');

      const waitMs = 2200 + Math.random() * 3200;
      STATE.iaido.timer = setTimeout(() => {
        if (STATE.currentGame !== 'IAIDO' || STATE.iaido.state !== 'WAITING') return;
        STATE.iaido.state = 'SIGNAL';
        STATE.iaido.signalTime = performance.now();
        document.getElementById('iaido-slash-overlay').style.display = 'flex';
        AUDIO.play('draw_signal');

        if (STATE.gameMode === 'AI') {
          const aiReaction = 210 + Math.floor(Math.random() * 110);
          STATE.iaido.aiTimer = setTimeout(() => {
            if (STATE.iaido.state === 'SIGNAL') {
              resolveIaidoWinner('P2', aiReaction);
            }
          }, aiReaction);
        }
      }, waitMs);
    }

    function handleIaidoAction(player) {
      AUDIO.init();
      if (STATE.iaido.state === 'WAITING') {
        clearTimeout(STATE.iaido.timer);
        if (STATE.iaido.aiTimer) clearTimeout(STATE.iaido.aiTimer);
        STATE.iaido.state = 'RESOLVED';
        AUDIO.play('false_start');
        document.getElementById('iaido-prompt').textContent = '⚠️ 抢跑犯规！';

        if (player === 'P1') {
          STATE.iaido.p2Wins++;
          const p2Label = STATE.gameMode === 'AI' ? '🔵 恶魔AI' : '🔵 剑客P2';
          document.getElementById('iaido-sub-prompt').textContent = `太早拔刀！🔴 P1 抢跑犯规！${p2Label} 斩获 1 胜！`;
        } else {
          STATE.iaido.p1Wins++;
          document.getElementById('iaido-sub-prompt').textContent = '太早拔刀！🔵 P2 抢跑犯规！🔴 剑客P1 斩获 1 胜！';
        }
        finishIaidoRound();
      } else if (STATE.iaido.state === 'SIGNAL') {
        const reactionMs = Math.round(performance.now() - STATE.iaido.signalTime);
        if (STATE.iaido.aiTimer) clearTimeout(STATE.iaido.aiTimer);
        STATE.iaido.state = 'RESOLVED';
        resolveIaidoWinner(player, reactionMs);
      }
    }

    function handleIaidoTap() {
      handleIaidoAction('P1');
    }

    function resolveIaidoWinner(winner, winnerMs) {
      document.getElementById('iaido-slash-overlay').style.display = 'none';
      const slashLine = document.getElementById('iaido-slash-line');
      slashLine.style.display = 'block';
      AUDIO.play('slash');

      if (winner === 'P1') {
        STATE.iaido.p1Wins++;
        document.getElementById('iaido-prompt').textContent = '⚡ 绝杀一闪！';
        document.getElementById('iaido-sub-prompt').textContent = `极速反应: ${winnerMs} 毫秒！🔴 P1 斩下 1 胜！`;
      } else {
        STATE.iaido.p2Wins++;
        const p2Label = STATE.gameMode === 'AI' ? '🔵 恶魔AI' : '🔵 P2';
        document.getElementById('iaido-prompt').textContent = STATE.gameMode === 'AI' ? '💥 慢了一步！' : '⚡ 绝杀一闪！';
        document.getElementById('iaido-sub-prompt').textContent = `极速反应: ${winnerMs} 毫秒！${p2Label} 斩下 1 胜！`;
      }

      finishIaidoRound();
    }

    function finishIaidoRound() {
      updateIaidoHUD();
      if (STATE.iaido.p1Wins >= STATE.iaido.targetWins || STATE.iaido.p2Wins >= STATE.iaido.targetWins) {
        STATE.iaido.state = 'OVER';
        if (STATE.iaido.modalTimer) clearTimeout(STATE.iaido.modalTimer);
        STATE.iaido.modalTimer = setTimeout(() => {
          let winMsg = '';
          if (STATE.gameMode === 'AI') {
            winMsg = STATE.iaido.p1Wins >= STATE.iaido.targetWins
              ? '🏆 恭喜！你以高超剑术斩落对手，问鼎剑圣！'
              : '💀 惜败！对手刀光更快一筹，再接再厉！';
          } else {
            winMsg = STATE.iaido.p1Wins >= STATE.iaido.targetWins
              ? '🏆 恭喜 🔴 剑客P1 刀光夺魄，问鼎剑圣！'
              : '🏆 恭喜 🔵 剑客P2 刀光夺魄，问鼎剑圣！';
          }
          showModal('决斗落幕', winMsg);
        }, 1000);
      } else {
        STATE.iaido.roundNum++;
        if (STATE.iaido.roundTimer) clearTimeout(STATE.iaido.roundTimer);
        STATE.iaido.roundTimer = setTimeout(startIaidoRound, 2400);
      }
    }

    function resetIaidoMatch() {
      initIaidoGame();
    }

    function setupIaidoInputs() {
      const p1Zone = document.getElementById('iaido-touch-p1');
      const p2Zone = document.getElementById('iaido-touch-p2');

      if (p1Zone) {
        p1Zone.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleIaidoAction('P1');
        });
      }

      if (p2Zone) {
        p2Zone.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (STATE.gameMode === 'LOCAL') {
            handleIaidoAction('P2');
          } else {
            handleIaidoAction('P1');
          }
        });
      }

      window.addEventListener('keydown', (e) => {
        if (STATE.currentGame !== 'IAIDO') return;
        const code = e.code;
        const key = e.key;

        if (code === 'Space' || code === 'KeyA' || code === 'KeyL' || code === 'Enter' || key === ' ' || key === 'Enter') {
          e.preventDefault();
        }

        // P1: KeyA, Space
        if (code === 'KeyA' || code === 'Space' || key === 'a' || key === 'A' || key === ' ') {
          handleIaidoAction('P1');
        }
        // P2: KeyL, Enter (only in LOCAL mode)
        else if (STATE.gameMode === 'LOCAL' && (code === 'KeyL' || code === 'Enter' || key === 'l' || key === 'L' || key === 'Enter')) {
          handleIaidoAction('P2');
        }
      });
    }

    // ==========================================================================
    

    function resetCurrentGame() {
      initIaidoGame();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCommonHeader("拔刀居合斩 规则", `<p><strong>屏息凝神：</strong>屏幕变暗等待，切勿提前触碰，<strong>抢跑直接判负！</strong></p><br>
          <p><strong>一击必杀：</strong>红光闪现「斬」字瞬间出刀！快 1 毫秒者胜！率先赢下 3 胜者问鼎剑圣！</p><br>
          <p><strong>双人键位：</strong>P1 使用 <code>A</code> 或 <code>空格</code> (左半屏)；P2 使用 <code>L</code> 或 <code>回车</code> (右半屏)。</p>`, resetCurrentGame);
      setupIaidoInputs();
      initIaidoGame();
    });
  </script>
</body>
</html>
