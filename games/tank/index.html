<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💣 极限抛物线弹道 (Scorched Earth Tank) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game-layout.css">
  <style>
4. 极限抛物线弹道 (TANK) 样式
       ========================================================================== */
    #tank-stage {
      width: 100%;
      min-height: 440px;
      position: relative;
      background: linear-gradient(180deg, #0b1329 0%, #172554 60%, #1e293b 100%);
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    #tank-canvas {
      width: 100%;
      height: 290px;
      display: block;
    }

    .tank-hud-top {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .tank-hp-bar {
      width: 90px;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .tank-hp-fill {
      height: 100%;
      transition: width 0.3s ease;
    }
    .tank-hp-p1 { background: #ef4444; width: 100%; }
    .tank-hp-p2 { background: #22c55e; width: 100%; }

    .tank-wind-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .tank-controls-dock {
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #334155;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tank-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .tank-slider-row input[type=range] {
      flex: 1;
      accent-color: #3b82f6;
    }

    .btn-tank-fire {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 1px solid #fbbf24;
      color: #000;
      font-weight: 900;
      font-size: 1rem;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
    }

    /* ==========================================================================
       
  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部通用导航栏 -->
    <header class="app-header">
      <div class="brand-title" onclick="window.location.href='../../'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">返回大厅</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" id="btn-sound-toggle" onclick="toggleSound()">🔊</button>
        <button class="btn-icon" id="btn-rules-header" onclick="showCurrentRules()">规则</button>
      </div>
    </header>

    <!-- 游戏导航栏 -->
    <div class="game-nav-bar">
      <button class="btn-back-lobby" onclick="window.location.href='../../'">
        <span>◀ 返回大厅</span>
      </button>
      <div class="current-game-badge" id="current-game-title">💣 极限抛物线弹道 (Scorched Earth Tank)</div>
      
      <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重开</button>
    </div>

    
    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对战</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 同屏双人</div>
    </div>
    

    <!-- 舞台容器 -->
    <div class="stage-wrapper">
<div id="tank-stage">
          <canvas id="tank-canvas"></canvas>
          <div class="tank-hud-top">
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:0.75rem; color:#ef4444; font-weight:700;" id="tank-p1-label">🔴 玩家坦克</span>
              <div class="tank-hp-bar"><div class="tank-hp-fill tank-hp-p1" id="tank-hp-p1"></div></div>
            </div>
            <div class="tank-wind-badge" id="tank-wind-badge">💨 0 m/s</div>
            <div style="display:flex; flex-direction:column; gap:2px; align-items:flex-end;">
              <span style="font-size:0.75rem; color:#22c55e; font-weight:700;" id="tank-p2-label">🟢 电脑坦克</span>
              <div class="tank-hp-bar"><div class="tank-hp-fill tank-hp-p2" id="tank-hp-p2"></div></div>
            </div>
          </div>
          <div class="tank-controls-dock" id="tank-controls-dock">
            <div class="tank-slider-row">
              <span>角度: <b id="tank-angle-val" style="color:#38bdf8;">45°</b></span>
              <input type="range" id="tank-angle-slider" min="10" max="85" value="45" oninput="updateTankAimHUD()">
              <span>力度: <b id="tank-power-val" style="color:#f59e0b;">60%</b></span>
              <input type="range" id="tank-power-slider" min="20" max="100" value="60" oninput="updateTankAimHUD()">
            </div>
            <button class="btn-tank-fire" id="btn-tank-fire" onclick="fireTankPlayer()">🔥 发射炮弹！</button>
          </div>
        </div>

        
        <!-- 10. 魂斗罗经典第一关舞台 -->
        
    </div>
  </div>


  <!-- Toast 提示 -->
  <div class="toast" id="toast-msg"></div>

  <!-- 规则与结算弹窗 -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">游戏规则</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-btn" id="modal-confirm-btn">我知道了</button>
    </div>
  </div>


  <script src="../../shared/js/audio.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="game.js"></script>
</body>
</html>
