<head>
	<meta charset="UTF-8" />

	<title>三国杀 (Legends of the Three Kingdoms) · 聚会游戏大厅</title>
	<script>
		"use strict";
		(() => {
			// Protect Audio.prototype.play from browser autoplay rejections
			const origAudioPlay = HTMLAudioElement.prototype.play;
			HTMLAudioElement.prototype.play = function () {
				const res = origAudioPlay.apply(this, arguments);
				if (res && typeof res.catch === "function") {
					res.catch(err => {
						if (err && (err.name === "NotAllowedError" || (typeof err.message === "string" && err.message.includes("interact")))) {
							// Browser autoplay restriction - deferred until gesture
						} else {
							console.warn("[Audio Play]", err?.message || err);
						}
					});
				}
				return res;
			};

			const unlockAudio = () => {
				document.removeEventListener("click", unlockAudio);
				document.removeEventListener("touchstart", unlockAudio);
				document.removeEventListener("keydown", unlockAudio);
				if (window.ui?.backgroundMusic && window.lib?.config?.background_music !== "music_off") {
					window.ui.backgroundMusic.play().catch(() => {});
				}
			};
			document.addEventListener("click", unlockAudio, { passive: true });
			document.addEventListener("touchstart", unlockAudio, { passive: true });
			document.addEventListener("keydown", unlockAudio, { passive: true });

			window.onerror = function (msg, src, line, column, err) {
				let str = `[Sanguosha Error] 文件: ${typeof src == "string" && src.length > 0 ? decodeURI(src) : "未知"}`;
				str += ` | 信息: ${msg} (L${line}:C${column})`;
				if (err && err.stack) str += "\n" + decodeURI(err.stack);
				console.error(str);
				if (typeof msg === "string" && (msg.includes("interact") || msg.includes("NotAllowedError") || msg.includes("play()"))) {
					return true;
				}
				return false;
			};

			window.onunhandledrejection = event => {
				if (event && event.reason) {
					const reason = event.reason;
					if (reason && (reason.name === "NotAllowedError" || (typeof reason.message === "string" && reason.message.includes("interact")))) {
						event.preventDefault();
						return;
					}
					console.warn("[UnhandledRejection]", reason);
				}
			};
		})();
	</script>
	<script>
		// 聚会游戏大厅环境自适应与预设优化
		try {
			localStorage.setItem("gplv3_noname_alerted", "true");
			sessionStorage.setItem("canUseTs", "1");
		} catch(e) {}
	</script>
	<link rel="icon" type="image/svg+xml" href="../../icons/icon.svg">

	<style>
		/* 聚会大厅 · 三国杀 极致视觉与响应式深度优化 */
		#system {
			padding: 4px 8px !important;
			z-index: 10000 !important;
			height: 36px !important;
			pointer-events: none !important;
			display: flex !important;
			align-items: center !important;
			justify-content: space-between !important;
			box-sizing: border-box !important;
			background: linear-gradient(180deg, rgba(15, 23, 42, 0.88) 0%, rgba(15, 23, 42, 0.45) 75%, transparent 100%) !important;
		}
		#system > div {
			pointer-events: auto !important;
			display: inline-flex !important;
			align-items: center !important;
			gap: 4px !important;
		}
		#system > #system1 {
			margin-left: 108px !important;
		}
		#system > div > div {
			padding: 3px 10px !important;
			font-size: 13px !important;
			font-weight: 600 !important;
			border-radius: 6px !important;
			background: rgba(30, 41, 59, 0.85) !important;
			border: 1px solid rgba(255, 255, 255, 0.15) !important;
			color: #f8fafc !important;
			backdrop-filter: blur(8px) !important;
			-webkit-backdrop-filter: blur(8px) !important;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35) !important;
			transition: all 0.15s ease !important;
			cursor: pointer !important;
			user-select: none !important;
			-webkit-user-select: none !important;
		}
		#system > div > div:hover {
			background: rgba(51, 65, 85, 0.95) !important;
			border-color: rgba(245, 158, 11, 0.6) !important;
			color: #fef08a !important;
		}
		#system > div > div:active {
			transform: scale(0.96) !important;
		}
		#arena {
			top: 38px !important;
			height: calc(100% - 40px) !important;
		}

		/* 角色选择对话框完美适配：下边界留出操作栏空间，防止按钮挡住卡牌 */
		#arena.choose-character > .dialog {
			top: 42px !important;
			bottom: 68px !important;
			height: calc(100% - 110px) !important;
			max-height: calc(100vh - 110px) !important;
			background: rgba(15, 23, 42, 0.94) !important;
			backdrop-filter: blur(14px) !important;
			-webkit-backdrop-filter: blur(14px) !important;
			border: 1px solid rgba(245, 158, 11, 0.45) !important;
			border-radius: 12px !important;
			box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75) !important;
			overflow: hidden !important;
		}
		#arena.choose-character > .dialog > .content-container {
			height: 100% !important;
			max-height: 100% !important;
			overflow-y: auto !important;
			-webkit-overflow-scrolling: touch;
			padding-bottom: 24px !important;
			box-sizing: border-box !important;
		}

		/* 选将辅助操作栏（自由选将、重选等）：置于弹窗正下方，绝不遮挡武将立绘 */
		#arena.choose-character > #control {
			bottom: 16px !important;
			top: auto !important;
			height: 38px !important;
			z-index: 10005 !important;
			display: flex !important;
			justify-content: center !important;
			align-items: center !important;
		}
		#arena.choose-character > #control > .control {
			position: relative !important;
			left: auto !important;
			top: auto !important;
			transform: none !important;
			background: rgba(30, 41, 59, 0.9) !important;
			border: 1px solid rgba(245, 158, 11, 0.6) !important;
			border-radius: 8px !important;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5) !important;
			color: #fef08a !important;
			padding: 4px 14px !important;
			font-weight: 700 !important;
			cursor: pointer !important;
			transition: all 0.15s ease !important;
		}
		#arena.choose-character > #control > .control:hover {
			background: rgba(51, 65, 85, 0.98) !important;
			border-color: #f59e0b !important;
			transform: scale(1.04) !important;
		}

		/* 武将与手牌专业质感 */
		.player:not(.minskin) {
			border-radius: 8px !important;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12) !important;
		}
		.player .avatar {
			border-radius: 6px !important;
		}

		/* 身份标记精细化：仅针对其他玩家与P0内部徽章生效，消除P0上方的130px宽模糊灰块 */
		.player:not([data-position="0"]) > .identity,
		.player[data-position="0"] > .identity > div {
			border-radius: 4px !important;
			background: rgba(15, 23, 42, 0.85) !important;
			backdrop-filter: blur(4px) !important;
			-webkit-backdrop-filter: blur(4px) !important;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4) !important;
			border: 1px solid rgba(255, 255, 255, 0.15) !important;
		}
		.player[data-position="0"] > .identity {
			background: none !important;
			border: none !important;
			box-shadow: none !important;
			backdrop-filter: none !important;
			-webkit-backdrop-filter: none !important;
		}

		/* 手牌悬浮与阴影 */
		.handcards > .card {
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.2) !important;
			border-radius: 6px !important;
			transition: transform 0.15s ease, box-shadow 0.15s ease !important;
		}
		.handcards > .card:hover {
			box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4), 0 0 0 2px rgba(245, 158, 11, 0.6) !important;
		}

		/* 操作按钮（确定、取消、出牌、结束回合）清晰质感 */
		#control > .control > div {
			border-radius: 6px !important;
			font-weight: 700 !important;
			letter-spacing: 0.5px !important;
			transition: all 0.15s ease !important;
		}
		#control > .control > div:hover {
			filter: brightness(1.15) !important;
		}

		/* 系统设置面板高层级与毛玻璃 */
		.menu-container:not(.hidden) {
			z-index: 99999 !important;
		}
		.menu-container:not(.hidden) > .menu.main {
			box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(245, 158, 11, 0.45) !important;
			border-radius: 12px !important;
			background: rgba(15, 23, 42, 0.96) !important;
			backdrop-filter: blur(16px) !important;
			-webkit-backdrop-filter: blur(16px) !important;
		}

		/* 移动端竖屏优雅提示：居于战场中下开阔处，绝不遮挡顶部武将 */
		#portrait-tip {
			display: none;
			position: fixed;
			bottom: 135px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 9999999;
			background: rgba(15, 23, 42, 0.95);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border: 1px solid rgba(245, 158, 11, 0.5);
			color: #f8fafc;
			padding: 6px 14px;
			border-radius: 20px;
			font-size: 12px;
			font-weight: 600;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
			pointer-events: auto;
			align-items: center;
			gap: 8px;
			animation: tipFadeIn 0.3s ease;
		}
		@keyframes tipFadeIn {
			from { opacity: 0; transform: translate(-50%, 10px); }
			to { opacity: 1; transform: translate(-50%, 0); }
		}
		@media screen and (orientation: portrait) and (max-width: 768px) {
			#portrait-tip {
				display: flex;
			}
			#system > #system1 {
				margin-left: 84px !important;
				gap: 2px !important;
			}
			#system > div > div {
				padding: 2px 7px !important;
				font-size: 11px !important;
			}
			#hub-back-banner a {
				padding: 4px 9px !important;
				font-size: 11px !important;
			}
		}
	</style>

	<script src="game/config.js"></script>
	<script src="game/package.js"></script>
	<script src="game/game.js"></script>

		<span>📱</span> <span>推荐横屏游玩，视野更佳</span> <span style="opacity:0.6;margin-left:4px;cursor:pointer;">✕</span>
	</div>

			<span>🔙</span> <span>聚会大厅</span>
		</a>
	</div>
