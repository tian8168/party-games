<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>彩虹乌诺牌 (UNO Party 4P) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../common/common.css">
  <style>
    /* ==========================================================================
       彩虹乌诺牌专属极光牌桌与矢量卡牌 (UNO PARTY TABLE & CARDS)
       ========================================================================== */
    .uno-wrapper {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 4人座位席位栏 (Seats Grid) */
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }
    @media (max-width: 620px) {
      .seats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
    }

    .seat-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .seat-card.active-turn {
      border-color: #f59e0b;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.5), inset 0 0 10px rgba(245, 158, 11, 0.15);
      transform: translateY(-2px);
    }
    .seat-p1 { border-left: 4px solid #ef4444; }
    .seat-p2 { border-left: 4px solid #22c55e; }
    .seat-p3 { border-left: 4px solid #3b82f6; }
    .seat-p4 { border-left: 4px solid #eab308; }

    .seat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 800;
    }
    .seat-p1 .seat-head { color: #f87171; }
    .seat-p2 .seat-head { color: #4ade80; }
    .seat-p3 .seat-head { color: #60a5fa; }
    .seat-p4 .seat-head { color: #facc15; }

    .seat-turn-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: #f59e0b;
      color: #0f172a;
      animation: pulseBadge 0.6s infinite alternate;
    }
    @keyframes pulseBadge {
      from { transform: scale(0.95); opacity: 0.85; }
      to { transform: scale(1.05); opacity: 1; }
    }

    .seat-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: #94a3b8;
    }
    .seat-cards-count {
      font-weight: 900;
      color: #f8fafc;
      font-family: monospace;
      font-size: 0.95rem;
    }
    .seat-score {
      font-weight: 800;
      color: #38bdf8;
      font-family: monospace;
    }
    .seat-uno-pill {
      font-size: 0.65rem;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .seat-uno-pill.called {
      background: #ef4444;
      color: #ffffff;
      animation: pulseBadge 0.5s infinite alternate;
    }
    .seat-uno-pill.danger {
      background: #f59e0b;
      color: #0f172a;
      animation: pulseBadge 0.3s infinite alternate;
    }

    /* 模式切换与房规栏 */
    .uno-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    .uno-mode-toggle {
      display: flex;
      gap: 4px;
    }
    .uno-mode-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .uno-mode-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
    .uno-rules-switches {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rule-checkbox {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    /* 主牌桌中心区域 (Center Table Stage) */
    .uno-table-stage {
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7), 0 12px 36px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* 环形流向发光光环 */
    .turn-flow-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 290px;
      height: 290px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
    .turn-flow-indicator.clockwise {
      border-top-color: #38bdf8;
      border-right-color: #22c55e;
      animation: rotateClockwise 12s linear infinite;
    }
    .turn-flow-indicator.counter-clockwise {
      border-top-color: #ef4444;
      border-left-color: #eab308;
      animation: rotateCounterClockwise 12s linear infinite;
    }
    @keyframes rotateClockwise {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    /* 桌面中心牌堆交互区 */
    .piles-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      z-index: 2;
    }

    /* 摸牌堆 */
    .draw-pile-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .uno-deck-back {
      width: 80px;
      height: 120px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 3px solid #38bdf8;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
      transition: all 0.2s ease;
      position: relative;
    }
    .uno-deck-back:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 12px 28px rgba(56, 189, 248, 0.5);
    }
    .deck-logo {
      font-size: 1.1rem;
      font-weight: 900;
      color: #f59e0b;
      transform: rotate(-18deg);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      letter-spacing: 1px;
    }
    .deck-count-badge {
      font-size: 0.72rem;
      font-weight: 800;
      color: #94a3b8;
    }

    /* 弃牌堆顶牌 */
    .top-card-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* 矢量乌诺卡牌 (UNO CARD) */
    .uno-card {
      width: 80px;
      height: 120px;
      border-radius: 12px;
      border: 3px solid #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      box-sizing: border-box;
      position: relative;
      user-select: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      flex-shrink: 0;
    }
    .uno-card-inner {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .uno-card-corner {
      font-size: 0.85rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
    }
    .uno-card-corner.bottom-right {
      align-self: flex-end;
      transform: rotate(180deg);
    }
    .uno-card-oval {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-25deg);
      width: 58px;
      height: 80px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .uno-card-symbol {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0f172a;
      transform: rotate(25deg);
    }

    /* 可出牌与禁出状态 */
    .uno-card.playable {
      cursor: pointer;
      box-shadow: 0 0 14px #ffffff, 0 10px 24px rgba(0, 0, 0, 0.6);
      transform: translateY(-6px);
      animation: cardPulse 1.2s infinite alternate;
    }
    .uno-card.playable:hover {
      transform: translateY(-12px) scale(1.08);
      box-shadow: 0 0 22px #ffffff, 0 14px 30px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }
    .uno-card.disabled {
      opacity: 0.45;
      filter: grayscale(0.5);
      cursor: not-allowed;
    }
    @keyframes cardPulse {
      from { box-shadow: 0 0 8px #ffffff; }
      to { box-shadow: 0 0 20px #ffffff; }
    }

    /* 当前主色发光宝石 */
    .active-color-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      z-index: 2;
    }
    .color-gem {
      padding: 3px 12px;
      border-radius: 20px;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    /* 叠牌惩罚横幅 */
    .penalty-banner {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.6);
      animation: bannerShake 0.4s infinite alternate;
      z-index: 2;
    }
    @keyframes bannerShake {
      from { transform: translateX(-2px); }
      to { transform: translateX(2px); }
    }

    /* 悬浮互动按键栏 (UNO & Catch) */
    .table-actions-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 2;
    }
    .btn-action-main {
      padding: 8px 18px;
      border-radius: 24px;
      border: none;
      font-weight: 900;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .btn-draw-card {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
    }
    .btn-draw-card:not(:disabled):hover {
      background: #475569;
    }
    .btn-draw-card.penalty {
      background: #dc2626 !important;
      border-color: #ef4444 !important;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(220, 38, 38, 0.7);
    }
    .btn-call-uno {
      background: #475569;
      color: #94a3b8;
      border: 2px solid #64748b;
    }
    .btn-call-uno.active-glow {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border-color: #fbbf24;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.8);
      animation: pulseBtn 0.4s infinite alternate;
    }
    .btn-catch-uno {
      background: #475569;
      color: #94a3b8;
      border: 2px solid #64748b;
    }
    .btn-catch-uno.active-alert {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      border-color: #f87171;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.8);
      animation: pulseBtn 0.4s infinite alternate;
    }
    @keyframes pulseBtn {
      from { transform: scale(0.96); }
      to { transform: scale(1.06); }
    }

    /* 手牌展示容器 (Hand Container) */
    .hand-section {
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .hand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 800;
      color: #cbd5e1;
    }
    .hand-scroll-wrapper {
      width: 100%;
      overflow-x: auto;
      padding: 10px 4px 6px;
      display: flex;
      gap: 10px;
      scrollbar-width: thin;
    }
    .hand-scroll-wrapper::-webkit-scrollbar {
      height: 6px;
    }
    .hand-scroll-wrapper::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    /* 本地同屏防窥暗牌遮罩 */
    .anti-peek-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .btn-peek-hold {
      padding: 10px 20px;
      background: #3b82f6;
      border: none;
      color: #ffffff;
      border-radius: 20px;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.5);
    }

    /* 实时对局日志 (Action Log) */
    .uno-log-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 8px 12px;
      max-height: 90px;
      overflow-y: auto;
    }
    .uno-log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.74rem;
      color: #94a3b8;
    }
    .log-time {
      color: #64748b;
      font-family: monospace;
    }

    /* 变色选择转盘模态浮层 (Color Picker Modal) */
    .color-picker-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .color-wheel-card {
      background: #1e293b;
      border: 2px solid #64748b;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }
    .wheel-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: #f8fafc;
    }
    .color-quadrants {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .quadrant-btn {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      border: 3px solid #ffffff;
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }
    .quadrant-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 24px rgba(255, 255, 255, 0.4);
    }
    .btn-q-red { background: #ef4444; }
    .btn-q-yellow { background: #eab308; }
    .btn-q-green { background: #22c55e; }
    .btn-q-blue { background: #3b82f6; }

    /* 悬浮提示条 (Floating Notification) */
    .floating-notice {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      padding: 10px 24px;
      border-radius: 30px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #f59e0b;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 900;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 200;
    }
    .floating-notice.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部通用导航栏 (Header) -->
    <div class="app-header">
      <button onclick="window.location.href='../index.html'" title="返回大厅">◀ 返回大厅</button>
      <span style="font-weight:900; font-size:1.05rem; letter-spacing:1px;">🌈 彩虹乌诺牌 (UNO)</span>
      <div style="display:flex; gap:8px;">
        <button id="btn-sound-toggle" title="音效开关">🔊</button>
        <button id="btn-rules-header" title="规则说明">❓</button>
      </div>
    </div>

    <div class="uno-wrapper">
      <!-- 4人席位状态栏 -->
      <div class="seats-grid" id="uno-seats-grid"></div>

      <!-- 模式与房规开关栏 -->
      <div class="uno-meta-bar">
        <div class="uno-mode-toggle">
          <button class="uno-mode-btn active" data-mode="AI3">1人 vs 3AI</button>
          <button class="uno-mode-btn" data-mode="AI1">1v1 人机</button>
          <button class="uno-mode-btn" data-mode="LOCAL2">双人同屏</button>
          <button class="uno-mode-btn" data-mode="LOCAL4">四人同屏</button>
        </div>
        <div class="uno-rules-switches">
          <label class="rule-checkbox" title="允许 +2/+4 叠牌反弹">
            <input type="checkbox" id="toggle-rule-stacking" checked>
            <span>⚡ 连环叠牌反弹</span>
          </label>
        </div>
      </div>

      <!-- 主牌桌中心竞技场 -->
      <div class="uno-table-stage">
        <!-- 环形流向光环 -->
        <div class="turn-flow-indicator clockwise" id="uno-turn-flow"></div>

        <!-- 叠牌惩罚预警横幅 -->
        <div class="penalty-banner" id="uno-penalty-banner" style="display:none;"></div>

        <!-- 当前颜色指示器 -->
        <div class="active-color-indicator">
          <span>当前颜色:</span>
          <span class="color-gem" id="uno-active-color-gem" style="background:#ef4444;">红</span>
        </div>

        <!-- 牌堆与弃牌堆 -->
        <div class="piles-container">
          <!-- 摸牌堆 -->
          <div class="draw-pile-box" id="uno-deck-pile" title="点击摸牌">
            <div class="uno-deck-back">
              <span class="deck-logo">UNO</span>
            </div>
            <span class="deck-count-badge" id="uno-deck-count">100 张</span>
          </div>

          <!-- 弃牌堆顶牌 -->
          <div class="top-card-box">
            <div class="uno-card" id="uno-top-card"></div>
            <span class="deck-count-badge">当前弃牌</span>
          </div>
        </div>

        <!-- 悬浮操作按钮栏 -->
        <div class="table-actions-row">
          <button class="btn-action-main btn-draw-card" id="btn-uno-draw">🃏 无牌可出 · 摸 1 张</button>
          <button class="btn-action-main btn-call-uno" id="btn-call-uno" disabled>📣 喊 UNO!</button>
          <button class="btn-action-main btn-catch-uno" id="btn-catch-uno" disabled>🚨 抓漏 CATCH!</button>
        </div>
      </div>

      <!-- 手牌展示区 -->
      <div class="hand-section">
        <div class="hand-header">
          <span>🎴 你的手牌 (点击微光牌出牌)</span>
          <span id="uno-hand-count-text"></span>
        </div>
        <div class="hand-scroll-wrapper" id="uno-player-hand"></div>

        <!-- 本地同屏防窥暗牌遮罩 -->
        <div class="anti-peek-overlay" id="uno-anti-peek-cover">
          <span style="font-size:0.9rem; font-weight:800; color:#cbd5e1;">🔒 换人准备 · 严防偷窥手牌</span>
          <button class="btn-peek-hold" id="btn-anti-peek-hold">按住展开手牌</button>
        </div>
      </div>

      <!-- 实时日志栏 -->
      <div class="uno-log-box">
        <ul class="uno-log-list" id="uno-log-list"></ul>
      </div>
    </div>
  </div>

  <!-- 四色选择转盘模态弹窗 -->
  <div class="color-picker-overlay" id="uno-color-modal">
    <div class="color-wheel-card">
      <span class="wheel-title">🌈 请选择变色牌指定的目标颜色</span>
      <div class="color-quadrants">
        <button class="quadrant-btn btn-q-red" onclick="selectUnoColor('RED')">🔴 红</button>
        <button class="quadrant-btn btn-q-yellow" onclick="selectUnoColor('YELLOW')">🟡 黄</button>
        <button class="quadrant-btn btn-q-green" onclick="selectUnoColor('GREEN')">🟢 绿</button>
        <button class="quadrant-btn btn-q-blue" onclick="selectUnoColor('BLUE')">🔵 蓝</button>
      </div>
    </div>
  </div>

  <!-- 单局结算弹窗 -->
  <div class="color-picker-overlay" id="uno-round-modal">
    <div class="color-wheel-card" style="max-width:360px; text-align:center;">
      <span class="wheel-title" id="uno-round-winner-title">🎉 局结算</span>
      <p id="uno-round-points-detail" style="font-size:0.9rem; color:#cbd5e1;"></p>
      <button class="btn-action-main btn-draw-card" style="background:#3b82f6; border:none; margin-top:8px;" onclick="nextUnoRound()">下一局继续 ▶</button>
    </div>
  </div>

  <!-- 总冠军胜利结算弹窗 -->
  <div class="color-picker-overlay" id="uno-victory-modal">
    <div class="color-wheel-card" style="max-width:400px; text-align:center;">
      <span class="wheel-title" style="color:#f59e0b; font-size:1.3rem;">👑 乌诺之王终极加冕！</span>
      <p id="uno-victory-text" style="font-size:1rem; color:#f8fafc; font-weight:800; margin:10px 0;"></p>
      <button class="btn-action-main btn-draw-card" style="background:linear-gradient(135deg,#f59e0b,#d97706); border:none;" onclick="restartUnoMatch()">再战一轮 🔄</button>
    </div>
  </div>

  <!-- 浮动通知条 -->
  <div class="floating-notice" id="uno-floating-notice"></div>

  <!-- 全局规则模态弹窗绑定 -->
  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>
  <script src="./js/uno.js"></script>
  <script>
    // 规则弹窗绑定
    document.getElementById('btn-rules-header').onclick = function() {
      if (window.AUDIO) AUDIO.play('click');
      showModal('🌈 彩虹乌诺牌 (UNO) 规则说明', `
        <p><strong>经典规则：</strong></p><br>
        <p>1. <b>跟牌判定</b>：打出的牌必须与弃牌堆顶牌在 <b>颜色</b> 或 <b>数字/符号</b> 上匹配；万能牌随时可出。</p><br>
        <p>2. <b>特殊功能牌</b>：<br>
        • <b>🚫 跳过 (Skip)</b>：直接跳过下家出牌回合。<br>
        • <b>🔄 逆转 (Reverse)</b>：改变出牌流向（顺时针/逆时针），2人局等同于跳过对手。<br>
        • <b>⚡ 罚抽两张 (+2)</b>：下家若无法接牌需罚抽 2 张。<br>
        • <b>🌈 万能牌 (Wild)</b>：可任意指定下一回合的新颜色。<br>
        • <b>💣 王牌 +4 (Wild Draw 4)</b>：指定颜色，并迫使下家罚抽 4 张！</p><br>
        <p>3. <b>⚡ 连环叠牌反弹</b>：当下家被罚 +2 时，若手里也有 +2 可直接叠牌反弹给再下家，惩罚累计至 4 张甚至更多！</p><br>
        <p>4. <b>📣 喊 UNO 与 抓漏</b>：当手中仅剩 1 张牌时，必须立即按下 <b>【UNO!】</b> 报备！若漏喊被对手按下 <b>【🚨 抓漏】</b>，将被重罚摸 2 张牌！</p>
      `);
    };
  </script>
</body>
</html>
