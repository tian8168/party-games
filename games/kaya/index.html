  <body>
    
    <!-- Party Game Lobby Navigation Bar / Floating Button -->
    <style>
      .kaya-partygame-nav {
        position: fixed;
        top: 10px;
        left: 12px;
        z-index: 999999;
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }
      .kaya-back-home-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(56, 189, 248, 0.45);
        border-radius: 9999px;
        color: #38bdf8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        user-select: none;
        cursor: pointer;
      }
      .kaya-back-home-btn:hover {
        background: rgba(30, 41, 59, 0.98);
        border-color: #38bdf8;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 6px 22px rgba(56, 189, 248, 0.35);
      }
      .kaya-back-home-btn:active {
        transform: translateY(0);
      }
    </style>
    <div class="kaya-partygame-nav">
      <a href="../../index.html" class="kaya-back-home-btn" title="返回聚会游戏大厅">
        <span>🔙</span>
        <span>返回大厅</span>
      </a>
    </div>

    <div id="root"></div>
  </body>
