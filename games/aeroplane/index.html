<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✈️ 四人飞行棋 (Aeroplane Chess 4P) · 聚会游戏大厅</title>
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game-layout.css">
  <style>
/* ==========================================================================
   ✈️ 四人飞行棋 (Aeroplane Chess 4P) 专属样式
   ========================================================================== */
/* ==========================================================================
       飞行棋专属样式 (AEROPLANE CHESS 4P)
       ========================================================================== */
    .aeroplane-hud {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 2px;
    }
    @media (max-width: 480px) {
      .aeroplane-hud {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
    }
    .aero-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .aero-card:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: #475569;
    }
    .aero-p0.active {
      border-color: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.55);
      background: rgba(239, 68, 68, 0.12);
    }
    .aero-p1.active {
      border-color: #f59e0b;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.12);
    }
    .aero-p2.active {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.12);
    }
    .aero-p3.active {
      border-color: #22c55e;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.55);
      background: rgba(34, 197, 94, 0.12);
    }
    .aero-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .aero-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .aero-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: space-between;
    }
    .aero-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: #f8fafc;
      white-space: nowrap;
    }
    .aero-role-badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-weight: 600;
    }
    .aero-card.active .aero-role-badge {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .aero-stats {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* 舞台包装与Canvas */
    #aeroplane-stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: none;
    }
    #aeroplane-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 12px;
      cursor: pointer;
    }

    /* 飞行棋底部控制台 */
    .aeroplane-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .aero-ctrl-top {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .aero-dice-wrap {
      cursor: pointer;
      flex-shrink: 0;
      perspective: 400px;
    }
    .aero-dice {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #ffffff, #e2e8f0);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45), inset 0 2px 3px rgba(255, 255, 255, 0.9);
      border: 2px solid #cbd5e1;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none;
    }
    .aero-dice:hover {
      transform: scale(1.06);
    }
    .aero-dice.rolling {
      animation: aero-dice-spin 0.4s ease-in-out infinite;
    }
    @keyframes aero-dice-spin {
      0% { transform: rotate(0deg) rotateX(0deg) scale(0.9); }
      25% { transform: rotate(90deg) rotateX(40deg) scale(1.08); }
      50% { transform: rotate(180deg) rotateX(0deg) scale(0.95); }
      75% { transform: rotate(270deg) rotateX(-40deg) scale(1.08); }
      100% { transform: rotate(360deg) rotateX(0deg) scale(1); }
    }
    .dice-pip-text {
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      color: #1e293b;
    }
    .aero-action-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .aero-prompt {
      font-size: 0.82rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-aero-roll {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: 1px solid #60a5fa;
      color: #fff;
      padding: 7px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
    }
    .btn-aero-roll:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
    .btn-aero-roll:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }
    .aero-plane-picker {
      background: rgba(30, 41, 59, 0.9);
      border: 1px dashed #64748b;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: aero-fade-in 0.25s ease-out;
    }
    @keyframes aero-fade-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .aero-picker-title {
      font-size: 0.76rem;
      color: #38bdf8;
      font-weight: 700;
    }
    .aero-picker-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-plane-choice {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-plane-choice:hover {
      background: #2563eb;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
    }
    .aero-settings-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 2px 4px;
    }
    .aero-chip-group {
      display: flex;
      gap: 6px;
    }
    .aero-chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.74rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .aero-chip:hover {
      color: #e2e8f0;
      border-color: #475569;
    }
    .aero-chip.active {
      background: rgba(59, 130, 246, 0.25);
      border-color: #3b82f6;
      color: #60a5fa;
      font-weight: 700;
    }



      #aeroplane-stage { display: block !important; }
      #aeroplane-hud { display: grid !important; }
      #aeroplane-controls { display: flex !important; }
    
  </style>
</head>
<body>
  <div class="container in-game">
    <!-- 顶部通用导航栏 -->
    <header class="app-header">
      <div class="brand-title" onclick="window.location.href='../../'">
        <span>🎮 聚会游戏大厅</span>
        <span class="badge">返回大厅</span>
      </div>
      <div class="header-tools">
        <button class="btn-icon" id="btn-sound-toggle" onclick="toggleSound()">🔊</button>
        <button class="btn-icon" id="btn-rules-header" onclick="showCurrentRules()">规则</button>
      </div>
    </header>

    <!-- 游戏导航栏 -->
    <div class="game-nav-bar">
      <button class="btn-back-lobby" onclick="window.location.href='../../'">
        <span>◀ 返回大厅</span>
      </button>
      <div class="current-game-badge" id="current-game-title">✈️ 四人飞行棋 (Aeroplane Chess 4P)</div>
      
      <button class="btn-icon" id="restart-btn" onclick="resetCurrentGame()">🔄 重开</button>
    </div>

    
    <div class="mode-nav">
      <div class="mode-tab active" id="tab-ai" onclick="switchGameMode('AI')">🤖 人机对战</div>
      <div class="mode-tab" id="tab-local" onclick="switchGameMode('LOCAL')">👥 同屏双人</div>
      <div class="mode-tab" id="tab-online" onclick="switchGameMode('ONLINE')">🌐 好友联机</div>
    </div>
    <!-- 联机房间控制面板 -->
      <div class="online-panel hidden" id="online-panel">
        <div class="room-header">
          <div>房间号: <span class="room-id-badge" id="display-room-id">未创建</span></div>
          <div id="display-role-info" style="font-size:0.8rem; color:#cbd5e1;">尚未进入房间</div>
        </div>
        <div class="online-actions">
          <button class="btn-action-primary" id="btn-create-room" onclick="createOnlineRoom()">
            <span>➕ 创建新房间</span>
          </button>
          <button class="btn-action-primary" id="btn-share-link" style="display:none;" onclick="copyInviteLink()">
            <span>📋 复制邀请链接发好友</span>
          </button>
          <button class="btn-action-secondary" id="btn-join-room" onclick="promptJoinRoom()">
            <span>加入房间</span>
          </button>
        </div>
      </div>

      
    <div class="aeroplane-hud" id="aeroplane-hud" style="display:grid;">
        <div class="aero-card aero-p0 active" id="aero-card-0" onclick="handleAeroCardClick(0)">
          <div class="aero-avatar" style="background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#ef4444;">🔴</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-0">红方</span>
              <span class="aero-role-badge" id="aero-role-0">玩家</span>
            </div>
            <div class="aero-stats" id="aero-stats-0">待机:4 · 🏁 0/4</div>
          </div>
        </div>
        <div class="aero-card aero-p1" id="aero-card-1" onclick="handleAeroCardClick(1)">
          <div class="aero-avatar" style="background:rgba(245,158,11,0.2); border:1px solid #f59e0b; color:#f59e0b;">🟡</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-1">黄方</span>
              <span class="aero-role-badge" id="aero-role-1">电脑</span>
            </div>
            <div class="aero-stats" id="aero-stats-1">待机:4 · 🏁 0/4</div>
          </div>
        </div>
        <div class="aero-card aero-p2" id="aero-card-2" onclick="handleAeroCardClick(2)">
          <div class="aero-avatar" style="background:rgba(56,189,248,0.2); border:1px solid #38bdf8; color:#38bdf8;">🔵</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-2">蓝方</span>
              <span class="aero-role-badge" id="aero-role-2">电脑</span>
            </div>
            <div class="aero-stats" id="aero-stats-2">待机:4 · 🏁 0/4</div>
          </div>
        </div>
        <div class="aero-card aero-p3" id="aero-card-3" onclick="handleAeroCardClick(3)">
          <div class="aero-avatar" style="background:rgba(34,197,94,0.2); border:1px solid #22c55e; color:#22c55e;">🟢</div>
          <div class="aero-info">
            <div class="aero-name-row">
              <span class="aero-name" id="aero-name-3">绿方</span>
              <span class="aero-role-badge" id="aero-role-3">电脑</span>
            </div>
            <div class="aero-stats" id="aero-stats-3">待机:4 · 🏁 0/4</div>
          </div>
        </div>
      </div>

      <!-- 步步为营 2人/4人 模式切换栏 -->
      

    <!-- 舞台主容器 -->
    <div class="stage-wrapper">
<div id="aeroplane-stage" style="display:block;">
          <canvas id="aeroplane-canvas" width="480" height="480"></canvas>
        </div>
    </div>
    <div class="game-status" id="status-text"></div>

    <div id="aeroplane-controls" class="aeroplane-controls" style="display:flex;">
        <div class="aero-ctrl-top">
          <!-- 3D 拟真骰子 -->
          <div class="aero-dice-wrap" id="aero-dice-wrap" onclick="triggerAeroplaneRoll()" title="点击掷骰子">
            <div class="aero-dice" id="aero-dice">
              <span class="dice-pip-text" id="dice-pip-text">🎲</span>
            </div>
          </div>
          <!-- 核心操作与状态提示 -->
          <div class="aero-action-box">
            <div class="aero-prompt" id="aero-prompt">🔴 红方回合：请点击掷骰子</div>
            <button class="btn-aero-roll" id="btn-aero-roll" onclick="triggerAeroplaneRoll()">
              <span>🎲 掷骰子</span>
            </button>
          </div>
        </div>
        <!-- 战机快速选取按钮列表 (当有多架可动时) -->
        <div class="aero-plane-picker" id="aero-plane-picker" style="display:none;">
          <span class="aero-picker-title">✈️ 请选择要移动的战机：</span>
          <div class="aero-picker-buttons" id="aero-picker-buttons"></div>
        </div>
        <!-- 快捷选项与模式微调 -->
        <div class="aero-settings-bar">
          <div class="aero-chip-group">
            <button class="aero-chip active" id="chip-mode-1p" onclick="setAeroplaneHumans(1)">👤 1人vs3电脑</button>
            <button class="aero-chip" id="chip-mode-2p" onclick="setAeroplaneHumans(2)">👥 2人对战</button>
            <button class="aero-chip" id="chip-mode-4p" onclick="setAeroplaneHumans(4)">👥👥 4人同屏</button>
          </div>
          <button class="aero-chip" id="chip-fast-ai" onclick="toggleAeroplaneFastAI()">⚡ 极速AI: 关</button>
        </div>
      </div>
    </div>
  </div>

  
  </div>


  <!-- Toast 提示 -->
  <div class="toast" id="toast-msg"></div>

  <!-- 规则与结算弹窗 -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">游戏规则</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-btn" id="modal-confirm-btn">我知道了</button>
    </div>
  </div>


  <script src="../../shared/js/audio.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../mqtt.min.js"></script>
  <script src="../../shared/js/network.js"></script>
  <script src="game.js"></script>
</body>
</html>
