<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.4"/>

  <!-- Cyberpunk Scanlines -->
  <line x1="40" y1="120" x2="472" y2="120" stroke="#4f46e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="40" y1="200" x2="472" y2="200" stroke="#4f46e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="40" y1="280" x2="472" y2="280" stroke="#4f46e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="40" y1="360" x2="472" y2="360" stroke="#4f46e5" stroke-width="1.5" opacity="0.25"/>

  <!-- Controller Base -->
  <path d="M120 180 C 80 180, 60 220, 60 280 C 60 360, 110 400, 160 400 C 190 400, 210 370, 230 350 L 282 350 C 302 370, 322 400, 352 400 C 402 400, 452 360, 452 280 C 452 220, 432 180, 392 180 Z" fill="url(#padGrad)" filter="url(#glow)"/>

  <!-- D-Pad Left -->
  <rect x="142" y="240" width="28" height="80" rx="6" fill="#0f172a"/>
  <rect x="116" y="266" width="80" height="28" rx="6" fill="#0f172a"/>
  <circle cx="156" cy="280" r="6" fill="#334155"/>

  <!-- Action Buttons Right (Red and Blue) -->
  <circle cx="340" cy="295" r="22" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="385" cy="255" r="22" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Select / Start -->
  <rect x="220" y="275" width="28" height="10" rx="3" fill="#1e293b" transform="rotate(-25 220 275)"/>
  <rect x="264" y="275" width="28" height="10" rx="3" fill="#1e293b" transform="rotate(-25 264 275)"/>

  <!-- Star / Neon Accent -->
  <polygon points="256,125 264,145 285,145 268,158 274,178 256,165 238,178 244,158 227,145 248,145" fill="#fbbf24" filter="url(#glow)"/>
</svg>
